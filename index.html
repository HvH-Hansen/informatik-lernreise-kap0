<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mediatown – Deine Lernreise durch Kapitel 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  /* Primitive Tokens */
  --c-bg:#eef3f6; --c-surface:#ffffff; --c-surface-2:#f5f9fb; --c-ink:#15303f; --c-muted:#4c6675; --c-border:#c8d7e1;
  --c-blue:#1a74ae; --c-blue-dark:#145b8a; --c-blue-soft:#dcecf7;
  --c-teal:#0f8a6e; --c-teal-dark:#0b6b55; --c-teal-soft:#d6f2ea;
  --c-good:#1f7d4a; --c-good-dark:#176139; --c-good-soft:#d9f0e2;
  --c-gold:#d89c14; --c-gold-soft:#fff5d1;
  --c-orange:#d45d12; --c-orange-soft:#fdebd9; --c-orange-line:#f3b88c;
  --c-warn:#9a6a00; --c-warn-soft:#fdf1d2;
  /* Semantic & Component Tokens */
  --bg:var(--c-bg); --surface:var(--c-surface); --surface-2:var(--c-surface-2);
  --ink:var(--c-ink); --muted:var(--c-muted); --line:var(--c-border);
  --blue:var(--c-blue); --blue-soft:var(--c-blue-soft);
  --teal:var(--c-teal); --teal-soft:var(--c-teal-soft);
  --good:var(--c-good); --good-soft:var(--c-good-soft);
  --gold:var(--c-gold); --gold-soft:var(--c-gold-soft);
  --star:var(--c-orange); --star-soft:var(--c-orange-soft); --star-line:var(--c-orange-line);
  --warn:var(--c-warn); --warn-soft:var(--c-warn-soft);
  --f-display:"Fredoka","Lexend",system-ui,"Segoe UI",sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  /* Motion Tokens */
  --m-in:150ms; --m-out:120ms; --m-press:90ms;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}

/* Skip Link */
.skip-link{position:fixed;top:-60px;left:16px;z-index:200;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-sm);font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:top var(--m-in) var(--ease)}
.skip-link:focus{top:14px}

/* Topbar */
.hub-top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1.5px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(21,48,63,.06)}
.hub-brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.hub-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--c-blue-dark),0 6px 14px rgba(26,116,174,.22)}
.hub-brand h1{font-size:22px;color:var(--ink)}
.hub-brand small{display:block;font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab-btn{min-height:44px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--line);transition:transform var(--m-in) var(--ease),background var(--m-in) var(--ease),border-color var(--m-in) var(--ease),box-shadow var(--m-in) var(--ease)}
.tab-btn:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
.tab-btn:active{transform:translateY(1px) scale(.985);box-shadow:none}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--c-blue-dark);box-shadow:0 2px 0 var(--c-blue-dark)}

.stats-pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.pill.gold{background:var(--gold-soft);border-color:#e2c56b;color:#785200}
.pill.user{min-height:44px;background:var(--blue-soft);border-color:#98c4e3;color:#114c78;cursor:pointer;box-shadow:0 2px 0 #98c4e3;transition:transform var(--m-in) var(--ease),filter var(--m-in) var(--ease)}
.pill.user:hover{filter:brightness(.97);transform:translateY(-1px)}
.pill.user:active{transform:translateY(1px) scale(.985);box-shadow:none}

/* Main Container */
.wrap{max-width:1320px;margin:0 auto;padding:24px 24px 80px;outline:none}
@keyframes viewEnter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view-enter > *{animation:viewEnter 320ms var(--ease-enter) both}

/* Map Layout (Claymorphism Elevation) */
.map-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:24px;align-items:start}
.map-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07);display:flex;flex-direction:column;gap:14px}
.map-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(95deg,var(--blue-soft),var(--teal-soft));border:1.5px solid #bdd9ea;border-radius:var(--r-md);padding:12px 18px}
.map-banner p{font-size:15px;color:#15303f;line-height:1.5}
.map-svg-box{position:relative;border-radius:var(--r-md);overflow:hidden;border:2px solid #b5cfe0;background:#b9e1f6;box-shadow:inset 0 2px 8px rgba(21,48,63,.08)}
.map-svg{display:block;width:100%;height:auto;user-select:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:2px 4px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot-c{width:14px;height:14px;border-radius:50%;display:inline-block}

/* SVG Interactive Elements */
.motif{transition:filter .5s ease, opacity .5s ease, transform .5s ease}
.motif.asleep{filter:grayscale(1) contrast(.9);opacity:.38}
.motif.awake{filter:none;opacity:1}
.marker{cursor:pointer;outline:none}
.marker .ring{transition:transform var(--m-in) var(--ease), stroke-width var(--m-in) var(--ease)}
.marker:hover .ring,.marker.selected .ring,.marker:focus-visible .ring{transform:scale(1.09)}
.marker.selected .halo,.marker:focus-visible .halo{opacity:1}
.halo{opacity:0;transition:opacity var(--m-in) var(--ease)}
@keyframes nextPulse{0%,100%{transform:scale(1);opacity:.48}50%{transform:scale(1.22);opacity:.12}}
.next-ring{transform-box:fill-box;transform-origin:center;animation:nextPulse 2.4s ease-in-out infinite}
.companion{transition:transform .7s cubic-bezier(.34,1.4,.64,1)}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.companion-inner{animation:floatBob 3s ease-in-out infinite}

/* Side Panel */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07);display:flex;flex-direction:column;gap:18px;position:sticky;top:88px}
.st-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 12px;border-radius:99px;width:fit-content}
.st-chip.r1{background:var(--blue-soft);color:var(--blue)}
.st-chip.r2{background:var(--teal-soft);color:var(--teal)}
.panel h2{font-size:26px}
.panel .desc{font-size:16px;color:#355061;line-height:1.6}
.star-box{background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.star-row{display:flex;align-items:center;gap:10px;font-size:15px}
.star-row.earned{color:var(--ink);font-weight:600}
.star-row.open{color:var(--muted)}
.task-mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task-mini{min-height:44px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);font-size:15px;cursor:pointer;text-align:left;width:100%;box-shadow:0 2px 0 var(--line);transition:transform var(--m-in) var(--ease),border-color var(--m-in) var(--ease),background var(--m-in) var(--ease)}
.task-mini:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
.task-mini:active{transform:translateY(1px) scale(.988);box-shadow:none}
.task-mini .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:2px solid var(--line);background:#fff;color:var(--muted)}
.task-mini.done .ic{background:var(--good);border-color:var(--good);color:#fff}
.task-mini.started .ic{border-color:var(--blue);color:var(--blue)}
.task-mini.zusatz.done .ic{background:var(--star);border-color:var(--star);color:#fff}

/* Tactile Claymorphic Buttons */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--blue);color:#fff;border-radius:var(--r-md);padding:12px 22px;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--c-blue-dark),0 4px 12px rgba(26,116,174,.2);transition:filter var(--m-in) var(--ease),transform var(--m-press) var(--ease),box-shadow var(--m-press) var(--ease)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 var(--c-blue-dark)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 var(--c-teal-dark),0 4px 12px rgba(15,138,110,.2)}
.btn.teal:active{box-shadow:0 1px 0 var(--c-teal-dark)}
.btn.good{background:var(--good);box-shadow:0 3px 0 var(--c-good-dark),0 4px 12px rgba(31,125,74,.2)}
.btn.good:active{box-shadow:0 1px 0 var(--c-good-dark)}
.btn.ghost{background:var(--surface);color:var(--blue);border:1.5px solid var(--blue);box-shadow:0 2px 0 var(--c-blue-soft)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.ghost:active{box-shadow:none}
.btn.small{min-height:44px;padding:9px 16px;font-size:14px;border-radius:var(--r-sm)}
.btn.big{font-size:18px;padding:14px 26px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* Passport View */
.pp-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.pp-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07);display:flex;flex-direction:column;gap:18px}
.avatar-stage{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--blue-soft),var(--teal-soft));border:1.5px solid #bdd9ea;border-radius:16px;padding:16px}
.avatar-circle{width:76px;height:76px;border-radius:50%;background:#fff;border:3px solid var(--blue);display:grid;place-items:center;font-size:44px;flex:none;box-shadow:0 4px 12px rgba(21,48,63,.12)}
.avatar-picker{display:flex;gap:8px;flex-wrap:wrap}
.av-opt{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:24px;display:grid;place-items:center;box-shadow:0 2px 0 var(--line);transition:transform var(--m-in) var(--ease),border-color var(--m-in) var(--ease)}
.av-opt:hover{transform:translateY(-1px);border-color:var(--blue)}
.av-opt:active{transform:translateY(1px) scale(.96)}
.av-opt.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 2px 0 var(--blue);transform:scale(1.05)}

.pp-bar{height:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.pp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .5s var(--ease-enter)}

.stamps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;font-variant-numeric:tabular-nums}
.stamp-slot{border:2px dashed var(--line);border-radius:18px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:transform var(--m-in) var(--ease),box-shadow var(--m-in) var(--ease)}
.stamp-slot:hover{transform:translateY(-2px)}
.stamp-slot.earned{border-style:solid;border-color:#93c5ab;background:linear-gradient(180deg,#ffffff,#f2fbf6);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 6px 16px rgba(31,125,74,.1)}
.stamp-seal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:38px;border:3px dashed #b9c9d4;color:#8ea3b0;background:#fff;position:relative}
.stamp-slot.earned .stamp-seal{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good);transform:rotate(-4deg)}
.stamp-slot.earned.r2 .stamp-seal{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}

.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ach-card{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;opacity:.55;filter:grayscale(.9);transition:transform var(--m-in) var(--ease)}
.ach-card.on{opacity:1;filter:none;border-color:#e2c56b;background:#fffdf2;box-shadow:0 3px 0 #ead794,0 5px 14px rgba(216,156,20,.14)}
.ach-card .ai{font-size:30px}

/* Export View */
.export-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:28px 32px;display:flex;flex-direction:column;gap:20px;max-width:900px;margin:0 auto;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07)}
.export-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r-md);background:var(--surface-2);border:1.5px solid var(--line);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.save-ok{background:var(--good-soft);border:1.5px solid #93c5ab;border-radius:var(--r-md);padding:16px 20px;font-size:16px}

/* Login / Start Screen */
.start{max-width:650px;margin:48px auto;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:38px 40px;display:flex;flex-direction:column;gap:22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 10px 32px rgba(21,48,63,.08)}
.start h1{font-size:36px}
.start h1 small{display:block;font-size:18px;color:var(--blue);font-weight:600;margin-bottom:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.field input{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;background:var(--surface-2)}
.field:first-child{grid-column:1/-1;max-width:50%}

/* Embedded Station Player Overlay */
.player{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.player-bar{background:#15303f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.player-bar .title{font-family:var(--f-display);font-size:19px;font-weight:600;flex:1}
.player-bar .btn-back{min-height:44px;background:#fff;color:#15303f;border:0;border-radius:var(--r-sm);padding:8px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 #b8c9d4;transition:background var(--m-in) var(--ease),transform var(--m-press) var(--ease)}
.player-bar .btn-back:hover{background:#dcecf7;transform:translateY(-1px)}
.player-bar .btn-back:active{transform:translateY(1px) scale(.985);box-shadow:none}
.player-frame{flex:1;width:100%;border:0;background:#edf3f7}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--good);color:#fff;font-weight:600;padding:14px 24px;border-radius:99px;opacity:0;transition:opacity .3s,transform .3s;z-index:150;pointer-events:none;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;border-radius:2px;z-index:149;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.6}}

details.teacher{font-size:14px;color:var(--muted)}
details.teacher summary{cursor:pointer;font-weight:600}

@media (max-width:960px){
  .map-layout,.pp-grid{grid-template-columns:1fr}
  .panel{position:static}
  .fields{grid-template-columns:1fr}
  .field:first-child{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<div id="app"></div>

rm */\nfunction startScreen(){\n  const prev = loadState();\n  const hs = hubStudent();\n  if (hs){\n    if (prev \u0026\u0026 sameStudent(prev.student, hs)){ S = prev; shell(); return; }\n    if (prev \u0026\u0026 prev.student) archive(prev);\n    S = freshState(hs); if (!IN_FRAME) saveState(); shell(); return;\n  }\n  const app = $(\u0027#app\u0027); app.innerHTML = \u0027\u0027;\n  const box = h(\u0027div\u0027, {class:\u0027start\u0027});\n  box.append(h(\u0027h1\u0027, {}, h(\u0027small\u0027, {}, `Informatik · Kapitel ${LESSON.id}`), LESSON.shortTitle),\n    h(\u0027p\u0027, {}, LESSON.startText),\n    h(\u0027p\u0027, {class:\u0027hint-line\u0027}, \u0027Lies jede Aufgabe in Ruhe. Wenn du nicht weiterkommst, hilft dir der Tipp-Knopf.\u0027));\n  if (prev \u0026\u0026 prev.student){\n    box.append(h(\u0027div\u0027, {class:\u0027task\u0027, style:\u0027gap:14px;padding:22px\u0027},\n      h(\u0027p\u0027, {}, h(\u0027b\u0027, {}, `Willkommen zurück, ${prev.student.vorname} ${prev.student.initial}. (${prev.student.klasse})!`)),\n      h(\u0027div\u0027, {class:\u0027row\u0027},\n        h(\u0027button\u0027, {class:\u0027btn big\u0027, type:\u0027button\u0027, onclick:() =\u003e { S = prev; saveHubStudent(S.student); shell(); }}, \u0027Weiterarbeiten →\u0027),\n        h(\u0027button\u0027, {class:\u0027btn ghost\u0027, type:\u0027button\u0027, onclick:() =\u003e { form.hidden = false; warn.hidden = false; }}, `Ich bin nicht ${prev.student.vorname}`))));\n  }\n  const warn = h(\u0027p\u0027, {class:\u0027msg warn\u0027, hidden:true}, `Der Stand von ${prev \u0026\u0026 prev.student ? prev.student.vorname : \u0027\u0027} bleibt für die Lehrkraft gespeichert.`);\n  const fK = h(\u0027input\u0027, {id:\u0027klasse\u0027, placeholder:\u0027z. B. 5b\u0027, maxlength:\u00276\u0027, autocomplete:\u0027off\u0027});\n  const fV = h(\u0027input\u0027, {id:\u0027vorname\u0027, placeholder:\u0027z. B. Lisa\u0027, maxlength:\u002730\u0027, autocomplete:\u0027off\u0027});\n  const fI = h(\u0027input\u0027, {id:\u0027initial\u0027, placeholder:\u0027z. B. M\u0027, maxlength:\u00272\u0027, autocomplete:\u0027off\u0027});\n  const err = h(\u0027p\u0027, {class:\u0027msg bad\u0027});\n  const form = h(\u0027form\u0027, {style:\u0027display:flex;flex-direction:column;gap:16px\u0027, hidden:!!(prev \u0026\u0026 prev.student)},\n    warn,\n    h(\u0027div\u0027, {class:\u0027fields\u0027},\n      h(\u0027label\u0027, {class:\u0027field\u0027, for:\u0027klasse\u0027}, \u0027Klasse\u0027, fK),\n      h(\u0027label\u0027, {class:\u0027field\u0027, for:\u0027vorname\u0027}, \u0027Vorname\u0027, fV),\n      h(\u0027label\u0027, {class:\u0027field\u0027, for:\u0027initial\u0027}, \u00271. Buchstabe Nachname\u0027, fI)),\n    err, h(\u0027div\u0027, {class:\u0027row\u0027}, h(\u0027button\u0027, {class:\u0027btn big\u0027, type:\u0027submit\u0027}, \u0027Los geht’s →\u0027)));\n  form.addEventListener(\u0027submit\u0027, e =\u003e {\n    e.preventDefault();\n    const k = fK.value.trim(), v = fV.value.trim(), i = fI.value.trim().replace(\u0027.\u0027, \u0027\u0027).toUpperCase();\n    if (!k || !v || !i){ err.textContent = \u0027Bitte fülle alle drei Felder aus.\u0027; return; }\n    if (prev \u0026\u0026 prev.student) archive(prev);\n    S = freshState({klasse:k, vorname:v, initial:i});\n    saveState(); shell();\n  });\n  box.append(form, h(\u0027div\u0027, {class:\u0027row\u0027}, h(\u0027a\u0027, {class:\u0027btn small ghost\u0027, href:HUB_FILE}, \u0027🗺️ Lieber über die Lernlandkarte starten\u0027)));\n  const arch = loadArchive();\n  const det = h(\u0027details\u0027, {class:\u0027teacher\u0027}, h(\u0027summary\u0027, {}, \u0027Für Lehrkräfte\u0027));\n  const al = h(\u0027div\u0027, {class:\u0027arch\u0027});\n  const all = (prev \u0026\u0026 prev.student ? [prev] : []).concat(arch);\n  if (!all.length) al.append(h(\u0027span\u0027, {}, \u0027Noch keine Ergebnisse auf diesem Gerät gespeichert.\u0027));\n  all.forEach(st =\u003e {\n    const  === \u0027begonnen\u0027 ? \u0027started\u0027 : \u0027open\u0027;\n}\nfunction refreshNav(){\n  if (!S || !S.student) return;\n  document.querySelectorAll(\u0027.nav-item[data-id]\u0027).forEach(b =\u003e {\n    const pg = PAGES.find(x =\u003e x.id === b.dataset.id);\n    if (pg) b.dataset.state = pageState(pg);\n  });\n  document.querySelectorAll(\u0027[data-badge]\u0027).forEach(b =\u003e {\n    const id = b.dataset.badge, part = b.dataset.part;\n    const t = S.tasks[id];\n    let st = \u0027offen\u0027;\n    if (t){\n      if (part \u0026\u0026 t.parts \u0026\u0026 t.parts[part] \u0026\u0026 t.parts[part].done) st = \u0027erledigt\u0027;\n      else if (t.status === \u0027erledigt\u0027) st = \u0027erledigt\u0027;\n      else if (t.status === \u0027begonnen\u0027) st = \u0027begonnen\u0027;\n    }\n    b.dataset.s = st; b.textContent = st === \u0027erledigt\u0027 ? \u0027✓ erledigt\u0027 : st === \u0027begonnen\u0027 ? \u0027begonnen\u0027 : \u0027offen\u0027;\n  });\n  const s = summary(S), st = calcStars(S);\n  const bar = $(\u0027#bar\u0027); if (bar){ bar.style.width = s.pct + \u0027%\u0027; if (bar.parentElement) bar.parentElement.setAttribute(\u0027aria-valuenow\u0027, String(s.pct)); }\n  const lbl = $(\u0027#bar-lbl\u0027); if (lbl) lbl.textContent = `${s.done} von ${s.total} Pflichtaufgaben`;\n  const zl = $(\u0027#bar-zus\u0027); if (zl) zl.textContent = s.zusDone ? `⭐ ${s.zusDone} Zusatz` : \u0027\u0027;\n  const sp = $(\u0027#stars-pill\u0027); if (sp) sp.textContent = `${\u0027⭐\u0027.repeat(st.count)}${\u0027☆\u0027.repeat(3 - st.count)} (${st.count}/3)`;\n}\nfunction go(id){\n  ladders = [];\n  const pg = PAGES.find(x =\u003e x.id === id) || PAGES[0];\n  S.current = pg.id; lastProgress = Date.now(); nudged = false;\n  if (pg.info){ S.infoSeen = S.infoSeen || {}; S.infoSeen[pg.id] = true; }\n  saveState();\n  const main = $(\u0027#main\u0027); main.innerHTML = \u0027\u0027;\n  RENDER[pg.id](pg, main);\n  document.querySelectorAll(\u0027.nav-item\ | d.lessonId !== LESSON.id) return;\n  if (d.type === \u0027pc00_hydrate\u0027 \u0026\u0026 d.rawState \u0026\u0026 d.rawState.student){\n    const inc = normState(d.rawState);\n    const incT = inc.lastSavedAt ? new Date(inc.lastSavedAt).getTime() : 0;\n    const curT = S \u0026\u0026 S.lastSavedAt ? new Date(S.lastSavedAt).getTime() : 0;\n    const upgradeEmpty = S \u0026\u0026 sameStudent(S.student, inc.student) \u0026\u0026 !hasTaskProg(S) \u0026\u0026 hasTaskProg(inc);\n    if (!S || !sameStudent(S.student, inc.student) || upgradeEmpty || incT \u003e curT){\n      if (S \u0026\u0026 S.student \u0026\u0026 !sameStudent(S.student, inc.student)) archive(S);\n      S = inc;\n      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}\n      shell();\n    }\n  } else if (d.type === \u0027pc00_goto\u0027 \u0026\u0026 d.page \u0026\u0026 S){\n    go(d.page);\n  }\n});\n\nfunction startScreen(){\n  const prev = loadState();\n  const hs = hubStudent();\n  if (hs){\n    if (prev \u0026\u0026 sameStudent(prev.student, hs)){ S = prev; shell(); return; }\n    if (prev \u0026\u0026 prev.student) archive(prev);\n    S = freshState(hs); if (!IN_FRAME) saveState(); shell(); return;\n  }\n  const app = $(\u0027#app\u0027); app.innerHTML = \u0027\u0027;\n  const box = h(\u0027div\u0027, {class:\u0027start\u0027});\n  box.append(h(\u0027h1\u0027, {}, h(\u0027small\u0027, {}, `Informatik · Kapitel ${LESSON.id}`), LESSON.shortTitle),\n    h(\u0027p\u0027, {}, LESSON.startText),\n    h(\u0027p\u0027, {class:\u0027hint-line\u0027}, \u0027Lies jede Aufgabe in Ruhe. Wenn du nicht weiterkommst, hilft dir der Tipp-Knopf.\u0027));\n  if (prev \u0026\u0026 prev.student){\n    box.append(h(\u0027div\u0027, {class:\u0027task\u0027, style:\u0027gap:14px;padding:22px\u0027},\n      h(\u0027p\u0027, {}, h(\u0027b\u0027, {}, `Willkommen zurück, ${prev.student.vorname} ${prev.student.initial}. (${prev.student.klasse})!`)),\n      h(\u0027div\u0027, {class:\u0027row\u0027},\n        h(\u f=\"https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600\u0026family=Fredoka:wght@500;600\u0026display=swap\"\u003e\n\u003cstyle\u003e\n/* Layout: Ruhiger, offener Lernpfad – maximal 1 Übung pro Seite, ohne Audio, Hub-kompatibel */\n:root{\n  --bg:#edf3f6; --surface:#ffffff; --surface-2:#f5f9fb; --ink:#15303f; --muted:#4c6675; --line:#c8d7e1;\n  --accent:#1a74ae; --accent-dark:#145b8a; --accent-ink:#ffffff; --accent-soft:#dcecf7;\n  --merke:#fdf1bf; --merke-line:#d8ae28;\n  --good:#1f7d4a; --good-soft:#d9f0e2; --bad:#bf3e2d; --bad-soft:#fae1dc; --warn:#9a6a00; --warn-soft:#fdf1d2;\n  --star:#d45d12; --star-soft:#fdebd9; --star-line:#f3b88c;\n  --f-display:\"Fredoka\",\"Lexend\",system-ui,\"Segoe UI\",sans-serif;\n  --f-body:\"Lexend\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --r:18px; --r-lg:22px; --r-md:14px; --r-sm:10px;\n  --m-in:150ms; --m-out:120ms; --m-press:90ms;\n  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);\n  color-scheme:light;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.75;letter-spacing:.01em}\nbutton,input,textarea,select{font:inherit;color:inherit;touch-action:manipulation}\nbutton{cursor:pointer}\na{color:inherit;text-decoration:none}\n:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}\np{margin:0}\n\n/* Skip Link */\n.skip-link{position:fixed;top:-60px;left:16px;z-index:200;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-sm);font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:top var(--m-in) var(--ease)}\n.skip-link:focus{top:14px}\n\n/* Kopfzeile */\n.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(21,48,63,.05)}\n.brand{display:flex;align-items:center;gap:10px;min-width:0}\n.brand b{font-family:var(--f-display);font-size:26px;color:var(--accent);font-weight:600;flex:none}\n.brand span{font-family:var(--f-display);font-size:17px;line-height:1.2;max-width:240px}\n.progress{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px}\n.progress-label{font-size:13px;line-height:1.25;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}\n.bar{height:12px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:99px;overflow:hidden}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#2ea0c9);border-radius:99px;transition:width .5s var(--ease-enter)}\n.stars-pill{display:inline-flex;align-items:center;gap:5px;background:#fff8db;border:1.5px solid #e2c56b;color:#785200;border-radius:99px;padding:5px 13px;font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}\n.who{font-size:15px;color:var(--muted);white-space:nowrap}\n.who strong{color:var(--ink)}\n\n/* Grundgerüst */\n.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;max-width:1220px;margin:0 auto;padding:34px 32px 100px}\n.nav{position:sticky;top:92px;align-self:start;display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:6px}\n.nav-item{min-height:44px;display:flex;align-items:center;gap:11px;text-align:left;background:none;border:0;border-radius:12px;padding:9px 12px;font-size:15px;color:var(--ink);line-height:1.35;transition:background var(--m-in) var(--ease),transform var(--m-in) var(--ease),box-shadow var(--m-in) var(--ease)}\n.nav-item:hover{background:var(--surface);transform:translateX(2px)}\n.nav-item.active{background:var(--surface);box-shadow:inset 4px 0 0 var(--accent),0 3px 10px rgba(21,48,63,.08);font-weight:600;color:var(--accent)}\n.nav-num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}\n.nav-item[data-state=started] .nav-num{border-color:var(--accent);color:var(--accent)}\n.nav-item[data-state=done] .nav-num{border-color:var(--good);background:var(--good);color:#fff}\n.nav-item.zusatz .nav-num{border-style:dashed;border-color:var(--star-line);color:var(--star)}\n.nav-item.zusatz[data-state=done] .nav-num{background:var(--star);border-color:var(--star);border-style:solid;color:#fff}\n.nav-sep{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px;font-weight:600}\nmain{min-width:0;max-width:860px;display:flex;flex-direction:column;gap:28px;outline:none}\n@keyframes pageEnter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media (prefers-reduced-motion:no-preference){main \u003e *{animation:pageEnter 260ms var(--ease-enter) both}}\n\n/* Seitenkopf */\n.st-head{display:flex;flex-direction:column;gap:10px}\n.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.st-head h2{font-size:32px}\n.intro{max-width:58ch;color:#274454;font-size:18px;line-height:1.7}\n\n/* Aufgabenblock – großzügiges Spacing \u0026 taktile Claymorphism-Tiefe */\n.task{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:30px 34px;display:flex;flex-direction:column;gap:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 24px rgba(21,48,63,.05)}\n.task.zusatz{border:2px dashed var(--star-line);background:linear-gradient(180deg,#ffffff,#fffaf5)}\n.task-head{display:flex;gap:14px;align-items:flex-start}\n.tag{flex:none;font-size:13px;font-weight:600;background:var(--good-soft);color:var(--good);border-radius (function(){
'use strict';

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const iso = (t = Date.now()) => new Date(t).toISOString();
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const HUB_STUDENT_KEY = 'pc00_hub_student_v2';
const HUB_CACHE_KEY   = 'pc00_hub_cache_v2';
const HUB_META_KEY    = 'pc00_hub_meta_v2';
const HUB_LASTSYNC_KEY = 'pc00_hub_lastsync_v2';
const EMBEDDED_LESSONS = (() => {
  const el = document.getElementById('pc00-bundle');
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch(e){ return null; }
})();
function getSyncConfig(){ return (window.PC00_CONFIG && typeof window.PC00_CONFIG === 'object') ? window.PC00_CONFIG : {}; }
function getSyncEndpoint(){
  const u = String(getSyncConfig().endpointUrl || '').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}
function studentKey(s){
  return s ? `${String(s.klasse || '').trim()}|${String(s.vorname || '').trim()}|${String(s.initial || '').trim()}`.toLowerCase() : '';
}
function countRawTasks(r){
  if (!r || !r.tasks) return 0;
  return Object.values(r.tasks).filter(t => t && t.status && t.status !== 'offen').length;
}
async function sendToTeacher(ov, silent){
  const endpoint = getSyncEndpoint();
  if (!endpoint) return { ok:false, error:'Kein Endpunkt konfiguriert' };
  const payload = buildBundleExport(ov);
  try {
    const res = await fetch(endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body:JSON.stringify(payload),
      redirect:'follow'
    });
    let data = null;
    const txt = await res.text();
    try { data = JSON.parse(txt); } catch(e){}
    if (!res.ok || (data && data.ok === false)){
      throw new Error((data && data.error) || ('HTTP ' + res.status));
    }
    const at = iso();
    writeJSON(HUB_LASTSYNC_KEY, { at, schueler:student });
    return { ok:true, at, data };
  } catch(err){
    if (!silent) console.warn('Sync error:', err);
    return { ok:false, error:String(err && err.message ? err.message : err) };
  }
}
function maybeAutoSync(){
  if (!student || !getSyncEndpoint() || getSyncConfig().autoSync === false) return;
  const ov = getOverview();
  if (!ov.list.some(x => x.pr.state !== 'open')) return;
  sendToTeacher(ov, true);
}
async function loadFromTeacher(stObj){
  const endpoint = getSyncEndpoint();
  const id = studentKey(stObj);
  if (!endpoint || !id) return { ok:false, found:false };
  const sep = endpoint.includes('?') ? '&' : '?';
  const url = `${endpoint}${sep}action=load&id=${encodeURIComponent(id)}`;
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
  try {
    const res = await fetch(url, { redirect:'follow', signal: ctrl ? ctrl.signal : undefined });
    if (timer) clearTimeout(timer);
    const txt = await res.text();
    const data = JSON.parse(txt);
    if (!res.ok || !data || data.ok === false) return { ok:false, found:false };
    return data;
  } catch(err){
    if (timer) clearTimeout(timer);
    return { ok:false, found:false };
  }
}
function applyCloudSnapshot(snap){
  if (!snap || !student) return false;
  if (snap.schueler && !sameStudent(snap.schueler, student)) return false;
  let changed = false;
  if (snap.begleiter && AVATARS.some(a => a.id === snap.begleiter) && meta.avatar !== snap.begleiter){
    meta.avatar = snap.begleiter;
    writeJSON(HUB_META_KEY, meta);
    changed = true;
  }
  const stationsMap = snap.stations || {};
  STATIONS.forEach(st => {
    const cloudRaw = stationsMap[st.id];
    if (!cloudRaw || !cloudRaw.tasks) return;
    if (!cloudRaw.student) cloudRaw.student = student;
    const localRaw = getStationRaw(st);
    const cloudCnt = countRawTasks(cloudRaw);
    const localCnt = countRawTasks(localRaw);
    const cloudT = cloudRaw.lastSavedAt ? new Date(cloudRaw.lastSavedAt).getTime() : 0;
    const localT = localRaw && localRaw.lastSavedAt ? new Date(localRaw.lastSavedAt).getTime() : 0;
    if (!localRaw || cloudCnt > localCnt || (cloudCnt === localCnt && cloudT > localT)){
      writeJSON(st.key, cloudRaw);
      setCacheFor(st.id, cloudRaw, null);
      changed = true;
    }
  });
  return changed;
}

let student = null;
let meta = {avatar:'fuchs'};
let view = {tab:'map', sel:'0.1', activeLesson:null};

function readJSON(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function getCache(){ return readJSON(HUB_CACHE_KEY) || {}; }
function setCacheFor(id, rawState, exportData){
  const c = getCache();
  c[id] = {rawState, exportData, syncedAt:iso()};
  writeJSON(HUB_CACHE_KEY, c);
}

function sameStudent(a, b){
  return a && b && String(a.klasse).toLowerCase() === String(b.klasse).toLowerCase()
    && String(a.vorname).toLowerCase() === String(b.vorname).toLowerCase()
    && String(a.initial).toUpperCase() === String(b.initial).toUpperCase();
}

function getStationRaw(st){
  const direct = readJSON(st.key);
  const cached = (getCache()[st.id] || {}).rawState || null;
  if (direct && student && sameStudent(direct.student, student)){
    if (!cached || !sameStudent(cached.student, student)) return direct;
    const dT = direct.lastSavedAt ? new Date(direct.lastSavedAt).getTime() : 0;
    const cT = cached.lastSavedAt ? new Date(cached.lastSavedAt).getTime() : 0;
    return dT >= cT ? direct : cached;
  }
  if (cached && student && sameStudent(cached.student, student)) return cached;
  return null;
}

function computeStationProgress(st){
  const raw = getStationRaw(st);
  const pflicht = st.tasks.filter(t => t.type === 'pflicht');
  const zusatz  = st.tasks.filter(t => t.type === 'zusatz');
  if (!raw){
    return {
      raw:null, state:'open', done:0, total:pflicht.length, pct:0,
      zusDone:0, zusTotal:zusatz.length,
      star1:false, star2:false, star3:false, stars:0, pctAuto:0, stampDate:null
    };
  }
  const tasks = raw.tasks || {};
  const done = pflicht.filter(t => tasks[t.id] && tasks[t.id].status === 'erledigt').length;
  const started = st.tasks.some(t => tasks[t.id] && tasks[t.id].status !== 'offen');
  const zusDone = zusatz.filter(t => tasks[t.id] && tasks[t.id].status === 'erledigt').length;

  let aP = 0, aM = 0;
  pflicht.forEach(def => {
    if (def.max){
      aM += def.max;
      const t = tasks[def.id];
      if (t) Object.values(t.parts || {}).forEach(p => { if (p.max) aP += p.score || 0; });
    }
  });
  const pctAuto = aM ? Math.min(100, Math.round(aP / aM * 100)) : 100;
  const star1 = done === pflicht.length;
  const star2 = star1 && pctAuto >= 80;
  const star3 = zusDone > 0;
  let lastDoneAt = null;
  if (star1){
    pflicht.forEach(def => {
      const d = tasks[def.id]?.doneAt;
      if (d && (!lastDoneAt || d > lastDoneAt)) lastDoneAt = d;
    });
  }
  return {
    raw, state: star1 ? 'done' : started ? 'started' : 'open',
    done, total:pflicht.length, pct:Math.round(done / pflicht.length * 100),
    zusDone, zusTotal:zusatz.length,
    star1, star2, star3, stars:(star1?1:0)+(star2?1:0)+(star3?1:0),
    pctAuto, stampDate:lastDoneAt
  };
}

function getOverview(){
  const list = STATIONS.map(st => ({st, pr:computeStationProgress(st)}));
  const stamps = list.filter(x => x.pr.star1).length;
  const stars  = list.reduce((a, x) => a + x.pr.stars, 0);
  const anyStarted = list.some(x => x.pr.state !== 'open');
  const ach = {
    start: anyStarted,
    s01: list[0].pr.star1, s02: list[1].pr.star1, s03: list[2].pr.star1,
    s04: list[3].pr.star1, s05: list[4].pr.star1, s06: list[5].pr.star1,
    master: stamps === STATIONS.length
  };
  const nextStation = (list.find(x => !x.pr.star1) || list[list.length - 1]).st;
  return {list, stamps, stars, maxStars:STATIONS.length * 3, ach, nextStation};
}

/* Toast & Konfetti */
let toastT = null;
function toast(text){ const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2500); }
function celebrate(text){
  toast(text);
  if (reduced()) return;
  const colors = ['#1a74ae','#0f8a6e','#e8a317','#d45d12','#2ea0c9'];
  for (let i = 0; i < 28; i++){
    const c = h('div', {class:'confetti'});
    c.style.left = (25 + Math.random() * 50) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'vw');
    c.style.setProperty('--rot', (Math.random() * 720) + 'deg');
    c.style.animationDelay = (Math.random() * .25) + 's';
    document.body.append(c);
    setTimeout(() => c.remove(), 2100);
  }
}

/* ================= Embedded Player ================= */
let lastKnownStamps = 0;
let lastTriggerSel = null;

function openStation(stId, specificPage){
  const st = STATIONS.find(x => x.id === stId);
  if (!st) return;
  const act = document.activeElement;
  if (act && act.dataset && act.dataset.trigger) lastTriggerSel = `[data-trigger="${act.dataset.trigger}"]`;
  else if (act && act.closest && act.closest('.marker[data-st]')) lastTriggerSel = `.marker[data-st="${act.closest('.marker[data-st]').dataset.st}"]`;
  else lastTriggerSel = `[data-trigger="panel-open-${stId}"], .marker[data-st="${stId}"]`;
  view.activeLesson = st.id;
  lastKnownStamps = getOverview().stamps;
  const player = $('#player');
  const frame  = $('#pl-frame');
  const title  = $('#pl-title');
  const newtab = $('#pl-newtab');

  const qs = new URLSearchParams({
    hub:'1',
    klasse:student.klasse,
    vorname:student.vorname,
    initial:student.initial
  });
  if (specificPage) qs.set('page', specificPage);
  if (getSyncEndpoint()) qs.set('cloud', '1');
  const url = `${st.file}?${qs.toString()}`;

  title.textContent = `${st.id} ${st.place} – ${st.title}`;
  if (EMBEDDED_LESSONS && EMBEDDED_LESSONS[st.id]){ newtab.hidden = true; } else { newtab.hidden = false; newtab.href = url; }
  updatePlayerStars(st);

  frame.onload = () => {
    const raw = getStationRaw(st);
    if (raw){
      try { frame.contentWindow.postMessage({type:'pc00_hydrate', lessonId:st.id, rawState:raw}, '*'); } catch(e){}
    }
  };
  const embeddedHtml = EMBEDDED_LESSONS && EMBEDDED_LESSONS[st.id];
  if (embeddedHtml){
    const qsTag = `\x3cscript>window.__PC00_QS__=${JSON.stringify('?' + qs.toString())};\x3c/script>`;
    const injectedHtml = /<head>/i.test(embeddedHtml)
      ? embeddedHtml.replace(/<head>/i, m => m + qsTag)
      : (qsTag + embeddedHtml);
    frame.removeAttribute('src');
    frame.srcdoc = injectedHtml;
  } else {
    frame.removeAttribute('srcdoc');
    frame.src = url;
  }
  const appEl = $('#app');
  if (appEl) appEl.inert = true;
  player.hidden = false;
  setTimeout(() => { const cb = $('#pl-close'); if (cb) cb.focus(); }, 20);
}

function updatePlayerStars(st){
  const pr = computeStationProgress(st);
  const el = $('#pl-stars');
  if (el) el.textContent = `${'⭐'.repeat(pr.stars)}${'☆'.repeat(3 - pr.stars)} (${pr.stars}/3)`;
}

function closePlayer(){
  const player = $('#player');
  const frame  = $('#pl-frame');
  const prevStamps = lastKnownStamps;
  player.hidden = true;
  const appEl = $('#app');
  if (appEl) appEl.inert = false;
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  view.activeLesson = null;
  maybeAutoSync();
  renderApp();
  const restoreEl = (lastTriggerSel && $(lastTriggerSel)) || $('.panel .btn.big') || $('.map-banner .btn');
  if (restoreEl){
    try { restoreEl.focus(); } catch(e){}
  }
  lastTriggerSel = null;
  const nowStamps = getOverview().stamps;
  if (nowStamps > prevStamps){
    celebrate('🏅 Neuer Stempel im Computer-Führerschein! Das Motiv auf der Karte ist aufgewacht!');
  }
}

$('#pl-close').addEventListener('click', closePlayer);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#player').hidden){
    e.preventDefault();
    closePlayer();
  }
});

window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d) return;
  if (d.type === 'pc00_ready' && d.lessonId){
    const st = STATIONS.find(x => x.id === d.lessonId);
    const frame = $('#pl-frame');
    const raw = st ? getStationRaw(st) : null;
    if (st && raw && frame && frame.contentWindow){
      try { frame.contentWindow.postMessage({type:'pc00_hydrate', lessonId:st.id, rawState:raw}, '*'); } catch(e){}
    }
  } else if (d.type === 'pc00_sync' && d.lessonId && d.rawState){
    const st = STATIONS.find(x => x.id === d.lessonId);
    const prevRaw = st ? getStationRaw(st) : null;
    const hasProg = r => r && r.tasks && Object.keys(r.tasks).length > 0;
    if (hasProg(prevRaw) && !hasProg(d.rawState)) return;
    setCacheFor(d.lessonId, d.rawState, d.exportData);
    if (d.key && d.rawState) writeJSON(d.key, d.rawState);
    if (st) updatePlayerStars(st);
  } else if (d.type === 'pc00_submit' && d.lessonId){
    const st = STATIONS.find(x => x.id === d.lessonId);
    if (d.rawState){
      const prevRaw = st ? getStationRaw(st) : null;
      const hasProg = r => r && r.tasks && Object.keys(r.tasks).length > 0;
      if (!(hasProg(prevRaw) && !hasProg(d.rawState))){
        setCacheFor(d.lessonId, d.rawState, d.exportData);
        if (d.key) writeJSON(d.key, d.rawState);
      }
    }
    if (st) updatePlayerStars(st);
    const targetWin = ev.source || ($('#pl-frame') && $('#pl-frame').contentWindow);
    sendToTeacher(getOverview(), false).then(res => {
      try {
        if (targetWin) targetWin.postMessage({ type:'pc00_submit_result', lessonId:d.lessonId, ok:res.ok, at:res.at, error:res.error }, '*');
      } catch(e){}
    });
  } else if (d.type === 'pc00_close'){
    closePlayer();
  }
});

      h('button', {type:'button', class:'tab-btn' + (view.tab === 'map' ? ' active' : ''), 'aria-pressed':String(view.tab === 'map'), onclick:() => { view.tab = 'map'; renderApp(); }}, '🗺️ Lernlandkarte'),
      h('button', {type:'button', class:'tab-btn' + (view.tab === 'passport' ? ' active' : ''), 'aria-pressed':String(view.tab === 'passport'), onclick:() => { view.tab = 'passport'; renderApp(); }}, '🪪 Stempelpass'),
      h('button', {type:'button', class:'tab-btn' + (view.tab === 'export' ? ' active' : ''), 'aria-pressed':String(view.tab === 'export'), onclick:() => { view.tab = 'export'; renderApp(); }}, '💾 Abgeben')),
    h('div', {class:'stats-pills'},
      h('span', {class:'pill gold'}, `🏅 ${ov.stamps}/${STATIONS.length} Stempel`),
      h('span', {class:'pill gold'}, `⭐ ${ov.stars}/${ov.maxStars}`),
      h('button', {type:'button', class:'pill user', title:'Kind wechseln / Profil', onclick:() => switchUser()}, `${av.emoji} ${student.vorname} ${student.initial}. (${student.klasse})`)));
}

function renderMapView(ov){
  const selObj = ov.list.find(x => x.st.id === view.sel) || ov.list[0];
  const st = selObj.st, pr = selObj.pr;
  const routeLabel = st.route === 1 ? 'Route 1 · Technik & System' : 'Route 2 · Medien & Kreativ';

  const mapCard = h('section', {class:'map-card'},
    h('div', {class:'map-banner'},
      h('p', {html: ov.stamps === 6
        ? '🏆 Wahnsinn! Du hast alle 6 Stationen gemeistert und deinen Computer-Führerschein verdient!'
        : `Nächstes Ziel: <b>${ov.nextStation.id} ${ov.nextStation.place}</b> (${ov.nextStation.title}). Klicke auf eine Station!`}),
      h('button', {type:'button', class:'btn small', 'data-trigger':'hero-next', onclick:() => openStation(ov.nextStation.id)}, '🚀 Weiterreisen')),
    h('div', {class:'map-svg-box', html:buildMapSVG(ov)}),
    h('div', {class:'legend'},
      h('span', {}, h('i', {class:'dot-c', style:'background:var(--blue)'}), 'Route 1: Grundlagen (0.1–0.3)'),
      h('span', {}, h('i', {class:'dot-c', style:'background:var(--teal)'}), 'Route 2: Medien-Werkzeuge (0.4–0.6)'),
      h('span', {}, '🎨 Graue Bilder wachen mit dem Stempel farbig auf!')));

  mapCard.querySelectorAll('.marker').forEach(el => {
    const pick = () => { view.sel = el.dataset.st; renderApp(); };
    el.addEventListener('click', pick);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); } });
  });

  const taskItems = st.tasks.map(t => {
    const info = pr.raw && pr.raw.tasks ? pr.raw.tasks[t.id] : null;
    const status = info ? info.status : 'offen';
    const cls = (status === 'erledigt' ? ' done' : status === 'begonnen' ? ' started' : '') + (t.type === 'zusatz' ? ' zusatz' : '');
    const mark = status === 'erledigt' ? '✓' : (t.type === 'zusatz' ? '⭐' : '○');
    return h('li', {}, h('button', {type:'button', class:'task-mini' + cls, 'data-trigger':`task-${st.id}-${t.id}`, onclick:() => openStation(st.id, t.page)},
      h('span', {class:'ic'}, mark),
      h('span', {style:'flex:1'}, t.label),
      h('small', {style:'color:var(--muted)'}, status === 'erledigt' ? 'fertig' : 'öffnen →')));
  });

  const panel = h('aside', {class:'panel'},
    h('span', {class:'st-chip ' + (st.route === 1 ? 'r1' : 'r2')}, `${routeLabel} · ${st.pages}`),
    h('h2', {}, `${st.icon} ${st.id} ${st.place}`),
    h('p', {style:'font-weight:600;color:var(--blue);margin-top:-10px'}, st.title),
    h('p', {class:'desc'}, st.desc),
    h('div', {class:'star-box'},
      h('div', {class:'star-row ' + (pr.star1 ? 'earned' : 'open')}, pr.star1 ? '⭐' : '☆', h('span', {}, `Stern 1: Pflichtaufgaben (${pr.done}/${pr.total})`)),
      h('div', {class:'star-row ' + (pr.star2 ? 'earned' : 'open')}, pr.star2 ? '⭐' : '☆', h('span', {}, `Stern 2: Mind. 80 % Punkte (${pr.pctAuto} %)`)),
      h('div', {class:'star-row ' + (pr.star3 ? 'earned' : 'open')}, pr.star3 ? '⭐' : '☆', h('span', {}, `Stern 3: Zusatzaufgabe (${pr.zusDone}/${pr.zusTotal})`))),
    h('button', {type:'button', class:'btn big ' + (st.route === 2 ? 'teal' : ''), 'data-trigger':'panel-open-' + st.id, onclick:() => openStation(st.id)},
      pr.state === 'open' ? '🚀 Station starten' : pr.star1 ? '🔍 Station wiederholen / Zusatz' : '🚀 Weiterarbeiten'),
    h('div', {style:'display:flex;flex-direction:column;gap:8px'},
      h('b', {style:'font-size:15px'}, 'Aufgaben auf dieser Station (direkt anspringen):'),
      h('ul', {class:'task-mini-list'}, taskItems)));

  return h('div', {class:'map-layout'}, mapCard, panel);
}

function renderPassportView(ov){
  const av = AVATARS.find(a => a.id === meta.avatar) || AVATARS[0];

  const left = h('section', {class:'pp-card'},
    h('h2', {}, '🪪 Computer-Führerschein'),
    h('div', {class:'avatar-stage'},
      h('div', {class:'avatar-circle'}, av.emoji),
      h('div', {},
        h('b', {style:'font-size:20px;display:block'}, `${student.vorname} ${student.initial}.`),
        h('span', {style:'color:var(--muted);font-size:15px'}, `Klasse ${student.klasse} · ${av.name}`))),
    h('div', {},
      h('p', {style:'font-size:14px;font-weight:600;margin-bottom:8px'}, 'Wähle deinen Reise-Begleiter:'),
      h('div', {class:'avatar-picker'}, AVATARS.map(a =>
        h('button', {type:'button', class:'av-opt' + (meta.avatar === a.id ? ' on' : ''), title:a.name, onclick:() => {
          meta.avatar = a.id; writeJSON(HUB_META_KEY, meta); renderApp();
        }}, a.emoji)))),
    h('div', {class:'star-box'},
      h('b', {style:'font-size:16px'}, `Gesamtstand: ${ov.stamps} von ${STATIONS.length} Stempeln`),
      h('span', {style:'font-size:15px;color:var(--muted)'}, `${ov.stars} von ${ov.maxStars} möglichen Sternen ⭐ gesammelt.`),
      h('div', {class:'pp-bar', role:'progressbar', 'aria-label':'Gesamtfortschritt Stempelpass', 'aria-valuemin':'0', 'aria-valuemax':String(STATIONS.length), 'aria-valuenow':String(ov.stamps)},
        h('i', {style:`width:${Math.round(ov.stamps / STATIONS.length * 100)}%`}))),
    h('button', {type:'button', class:'btn ghost', onclick:() => { view.tab = 'map'; renderApp(); }}, '← Zurück zur Karte'));

  const stampSlots = ov.list.map(({st, pr}) => {
    const dt = pr.stampDate ? new Date(pr.stampDate).toLocaleDateString('de-DE') : '';
    return h('div', {class:'stamp-slot' + (pr.star1 ? ' earned' : '') + (st.route === 2 ? ' r2' : '')},
      h('div', {class:'stamp-seal'}, st.icon),
      h('b', {style:'font-size:17px'}, `${st.id} ${st.place}`),
      h('span', {style:'font-size:14px;color:var(--muted)'}, st.title),
      h('div', {style:'font-size:18px;color:#d89c14'}, '★'.repeat(pr.stars) + '☆'.repeat(3 - pr.stars)),
      pr.star1
        ? h('small', {style:'color:var(--good);font-weight:600'}, `✓ Gestempelt${dt ? ' am ' + dt : ''}`)
        : h('button', {type:'button', class:'btn small ghost', 'data-trigger':'pp-open-' + st.id, onclick:() => openStation(st.id)}, `${pr.done}/${pr.total} Aufgaben →`));
  });

  const achCards = ACHIEVEMENTS.map(a =>
    h('div', {class:'ach-card' + (ov.ach[a.id] ? ' on' : '')},
      h('span', {class:'ai'}, a.icon),
      h('b', {style:'font-size:15px'}, a.title),
      h('small', {style:'font-size:13px;color:var(--muted)'}, a.desc)));

  const right = h('div', {style:'display:flex;flex-direction:column;gap:24px'},
    h('section', {class:'pp-card'}, h('h2', {}, '🏅 Meine 6 Stations-Stempel'), h('div', {class:'stamps-grid'}, stampSlots)),
    h('section', {class:'pp-card'}, h('h2', {}, '🏆 Abzeichen auf deiner Reise'), h('div', {class:'badges-grid'}, achCards)));

  return h('div', {class:'pp-grid'}, left, right);
}

function buildBundleExport(ov){
  const cache = getCache();
  const units = ov.list.map(({st, pr}) => {
    const cachedExport = cache[st.id]?.exportData || null;
    return {
      id:st.id,
      titel:st.title,
      ort:st.place,
      status:pr.state,
      sterne:pr.stars,
      pflicht_erledigt:pr.done,
      pflicht_gesamt:pr.total,
      zusatz_erledigt:pr.zusDone,
      punkte_prozent:pr.pctAuto,
      export_daten:cachedExport,
      roh_stand:pr.raw
    };
  });
  return {
    format:'ki-lernlandkarte-kapitel0',
    version:2,
    schueler:student,
    begleiter:meta.avatar,
    gespeichert:iso(),
    zusammenfassung:{
      stempel:ov.stamps,
      stempel_max:STATIONS.length,
      sterne:ov.stars,
      sterne_max:ov.maxStars,
      abzeichen:Object.keys(ov.ach).filter(k => ov.ach[k])
    },
    einheiten:units
  };
}

function downloadJSON(data, name){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = h('a', {href:URL.createObjectURL(blob), download:name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function renderExportView(ov){
  const out = h('div', {style:'display:flex;flex-direction:column;gap:12px'});
  const clean = s => String(s || '').replace(/[^A-Za-z0-9ÄÖÜäöüß-]/g, '');
  const bundleName = `PC00_Reisepass_${clean(student.klasse)}_${clean(student.vorname)}${clean(student.initial)}_${new Date().toISOString().slice(0, 10)}.json`;

  const rows = ov.list.map(({st, pr}) => {
    const cachedExport = (getCache()[st.id] || {}).exportData;
    return h('div', {class:'export-row'},
      h('span', {style:'font-size:24px'}, st.icon),
      h('div', {style:'flex:1;min-width:180px'},
        h('b', {}, `${st.id} ${st.place}`),
        h('div', {style:'font-size:14px;color:var(--muted)'}, `${pr.done}/${pr.total} Pflichtaufgaben · ${pr.stars}/3 ⭐`)),
      cachedExport
        ? h('button', {type:'button', class:'btn small ghost', onclick:() => {
            const n = `${st.prefix}_${clean(student.klasse)}_${clean(student.vorname)}${clean(student.initial)}_${new Date().toISOString().slice(0, 10)}.json`;
            downloadJSON(cachedExport, n);
          }}, 'Einzel-JSON speichern')
        : h('button', {type:'button', class:'btn small ghost', 'data-trigger':'exp-open-' + st.id, onclick:() => openStation(st.id, 'ende')}, 'Im Lernpfad öffnen'));
  });

  const endpoint = getSyncEndpoint();
  const lastSync = readJSON(HUB_LASTSYNC_KEY);
  const lastSyncValid = lastSync && lastSync.at && sameStudent(lastSync.schueler, student);

  const saveAllBtn = h('button', {type:'button', class: endpoint ? 'btn ghost' : 'btn big good', onclick:() => {
    downloadJSON(buildBundleExport(ov), bundleName);
    out.innerHTML = '';
    out.append(h('div', {class:'save-ok'}, h('b', {}, 'Gesamt-Ergebnis gespeichert! \u2713 '),
      `Die Datei \u201E${bundleName}\u201C liegt im Ordner Downloads. Lade sie bei IServ hoch.`));
  }}, endpoint ? '\uD83D\uDCBE Backup als JSON speichern' : '\uD83D\uDCBE Gesamten Reisepass (Kapitel 0) speichern');

  const sendBtn = endpoint ? h('button', {type:'button', class:'btn big good', onclick:async () => {
    sendBtn.disabled = true;
    const prevTxt = sendBtn.textContent;
    sendBtn.textContent = '\u23F3 Wird gesendet\u2026';
    const res = await sendToTeacher(ov, false);
    sendBtn.disabled = false;
    sendBtn.textContent = prevTxt;
    out.innerHTML = '';
    if (res.ok){
      const tStr = new Date(res.at).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
      out.append(h('div', {class:'save-ok'}, h('b', {}, 'Erfolgreich \u00FCbermittelt! \u2713 '),
        `Deine Ergebnisse sind bei deiner Lehrkraft angekommen (${tStr} Uhr).`));
    } else {
      out.append(h('div', {style:'background:#fde8e6;border:1.5px solid #e5a39c;border-radius:var(--r-md);padding:16px 20px;font-size:16px'},
        h('b', {}, '\u26A0\uFE0F Senden fehlgeschlagen: '),
        `${res.error}. Nutze einfach \u201EBackup als JSON speichern\u201C und lade die Datei bei IServ hoch.`));
    }
  }}, '\u2601\uFE0F Ergebnisse an Lehrkraft senden') : null;

  const actions = endpoint
    ? h('div', {class:'row'}, sendBtn, saveAllBtn, h('button', {type:'button', class:'btn ghost', onclick:() => { view.tab = 'map'; renderApp(); }}, '\u2190 Zur\u00FCck zur Karte'))
    : h('div', {class:'row'}, saveAllBtn, h('button', {type:'button', class:'btn ghost', onclick:() => { view.tab = 'map'; renderApp(); }}, '\u2190 Zur\u00FCck zur Karte'));

  const syncHint = endpoint && lastSyncValid
    ? h('p', {style:'font-size:14px;color:var(--good);font-weight:600'}, `\u2713 Zuletzt zentral gespeichert: ${new Date(lastSync.at).toLocaleString('de-DE')}`)
    : null;

  const teacherNote = !endpoint
    ? h('details', {class:'teacher'}, h('summary', {}, 'F\u00FCr Lehrkr\u00E4fte: Zentrale Abgabe ohne JSON'),
        h('p', {style:'margin-top:8px'}, 'In der Online-Version (GitHub Pages) kann in config.js eine Google-Apps-Script-URL hinterlegt werden. Dann erscheinen die Ergebnisse direkt in Google Sheets.'))
    : null;

  return h('section', {class:'export-card'},
    h('h2', {}, endpoint ? '\u2601\uFE0F Ergebnisse abgeben' : '\uD83D\uDCBE Ergebnisse f\u00FCr IServ speichern'),
    h('p', {}, `Hier siehst du deinen Stand in allen sechs Einheiten (${ov.stamps} von ${STATIONS.length} Stempeln \u00B7 ${ov.stars} von ${ov.maxStars} \u2B50).`),
    h('div', {style:'display:flex;flex-direction:column;gap:10px'}, rows),
    syncHint,
    actions,
    out,
    teacherNote);
}

function switchUser(){
  if (confirm(`Möchtest du das Profil (${student.vorname} ${student.initial}.) abmelden oder ein anderes Kind anmelden?`)){
    localStorage.removeItem(HUB_STUDENT_KEY);
    student = null;
    startScreen();
  }
}

function renderApp(){
  const app = $('#app'); app.innerHTML = '';
  const ov = getOverview();
  app.append(renderHeader(ov));
  const main = h('main', {id:'main-content', class:'wrap view-enter', tabindex:'-1'});
  if (view.tab === 'map') main.append(renderMapView(ov));
  else if (view.tab === 'passport') main.append(renderPassportView(ov));
  else main.append(renderExportView(ov));
  app.append(main);
}

function startScreen(){
  const app = $('#app'); app.innerHTML = '';
  const saved = readJSON(HUB_STUDENT_KEY);
  const box = h('div', {class:'start'});
  box.append(
    h('h1', {}, h('small', {}, 'Informatik · Klasse 5/6 · Kapitel 0'), 'Willkommen in Mediatown! 🗺️'),
    h('p', {}, 'Begib dich auf die interaktive Lernreise durch alle 6 Computer-Stationen. Sammle Stempel, Sterne und erwecke die ganze Landkarte zum Leben!'));

  if (saved && saved.klasse && saved.vorname && saved.initial){
    box.append(h('div', {style:'background:var(--blue-soft);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px'},
      h('p', {}, h('b', {}, `Willkommen zurück, ${saved.vorname} ${saved.initial}. (Klasse ${saved.klasse})!`)),
      h('div', {class:'row'},
        h('button', {type:'button', class:'btn big', onclick:() => { student = saved; renderApp(); }}, 'Zur Lernlandkarte →'),
        h('button', {type:'button', class:'btn ghost', onclick:() => { form.hidden = false; }}, `Ich bin nicht ${saved.vorname}`))));
  }

  let pickedAv = meta.avatar || 'fuchs';
  const avRow = h('div', {class:'avatar-picker'});
  function drawAv(){
    avRow.innerHTML = '';
    AVATARS.forEach(a => avRow.append(h('button', {type:'button', class:'av-opt' + (pickedAv === a.id ? ' on' : ''), title:a.name, onclick:() => { pickedAv = a.id; drawAv(); }}, a.emoji)));
  }
  drawAv();

  const fK = h('input', {id:'hk', placeholder:'z. B. 5b', maxlength:'6', autocomplete:'off'});
  const fV = h('input', {id:'hv', placeholder:'z. B. Lisa', maxlength:'30', autocomplete:'off'});
  const fI = h('input', {id:'hi', placeholder:'z. B. M', maxlength:'2', autocomplete:'off'});
  const err = h('p', {style:'color:#bf3e2d;font-weight:600'});
  const form = h('form', {style:'display:flex;flex-direction:column;gap:16px', hidden:!!(saved && saved.vorname)},
    h('div', {class:'fields'},
      h('label', {class:'field', for:'hk'}, 'Klasse', fK),
      h('label', {class:'field', for:'hv'}, 'Vorname', fV),
      h('label', {class:'field', for:'hi'}, '1. Buchstabe Nachname', fI)),
    h('div', {}, h('p', {style:'font-weight:600;font-size:15px;margin-bottom:8px'}, 'Wähle deinen Reise-Begleiter:'), avRow),
    err,
    h('div', {class:'row'}, h('button', {type:'submit', class:'btn big'}, 'Reise starten →')));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const k = fK.value.trim(), v = fV.value.trim(), i = fI.value.trim().replace('.', '').toUpperCase();
    if (!k || !v || !i){ err.textContent = 'Bitte f\u00FClle alle drei Felder aus.'; return; }
    student = {klasse:k, vorname:v, initial:i};
    meta = {avatar:pickedAv};
    writeJSON(HUB_STUDENT_KEY, student);
    writeJSON(HUB_META_KEY, meta);
    if (getSyncEndpoint()){
      const subBtn = form.querySelector('button[type="submit"]');
      if (subBtn){ subBtn.disabled = true; subBtn.textContent = '\u23F3 Suche gespeicherten Spielstand\u2026'; }
      const res = await loadFromTeacher(student);
      const restored = res && res.ok && res.found && res.snapshot ? applyCloudSnapshot(res.snapshot) : false;
      view.sel = getOverview().nextStation.id;
      renderApp();
      if (restored) toast(`\u2601\uFE0F Spielstand geladen! Willkommen zur\u00FCck, ${student.vorname}!`);
    } else {
      view.sel = getOverview().nextStation.id;
      renderApp();
    }
  });
  const det = h('details', {class:'teacher'}, h('summary', {}, 'Für Lehrkräfte (Demo & Hinweise)'),
    h('p', {style:'margin-top:8px'}, 'Alle 6 Einheiten lassen sich direkt über diese Karte öffnen. Einmal anmelden genügt für das gesamte Kapitel 0.'),
    h('div', {class:'row', style:'margin-top:10px'},
      h('button', {type:'button', class:'btn small ghost', onclick:() => loadDemo()}, '🔍 Demo-Stand laden (Ansicht testen)')));

  box.append(form, det);
  app.append(box);
}

function loadDemo(){
  student = {klasse:'5b', vorname:'Demo', initial:'K'};
  meta = {avatar:'fuchs'};
  writeJSON(HUB_STUDENT_KEY, student);
  writeJSON(HUB_META_KEY, meta);
  // Demo-Fortschritt für Station 0.1 & 0.2 anlegen, damit Karte & Stempelpass sofort lebendig wirken
  const demo01 = {schema:'pc01-lernpfad-v2', student, startedAt:iso(), lastSavedAt:iso(), current:'ende', activeSec:420, stationSec:{}, idle:[], tabLeaves:0, awaySec:0, exports:[], infoSeen:{}, tasks:{
    g1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:5,max:5},steps:{done:true,score:5,max:5}}},
    a1:{status:'erledigt', doneAt:iso(), parts:{gap:{done:true,score:4,max:4},text:{done:true,text:'Demo'}}},
    r1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:7,max:7},q:{done:true,score:1,max:1}}},
    r2:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:5,max:5},check:{done:true,score:4,max:4}}},
    w1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:8,max:8},self:{done:true},text:{done:true,text:'Demo'}}},
    e1:{status:'erledigt', doneAt:iso(), parts:{quiz:{done:true},text:{done:true,text:'Demo'}}}
  }};
  const demo02 = {schema:'pc02-lernpfad-v2', student, startedAt:iso(), lastSavedAt:iso(), current:'ende', activeSec:380, stationSec:{}, idle:[], tabLeaves:0, awaySec:0, exports:[], infoSeen:{}, tasks:{
    m1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:9,max:9}}},
    t1:{status:'erledigt', doneAt:iso(), parts:{steps:{done:true,score:5,max:5},gap:{done:true,score:5,max:5}}},
    f1:{status:'erledigt', doneAt:iso(), parts:{steps:{done:true,score:5,max:6}}},
    z1:{status:'erledigt', doneAt:iso(), parts:{steps:{done:true,score:3,max:3},gap:{done:true,score:5,max:5}}},
    w1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:7,max:8},self:{done:true},text:{done:true,text:'Demo'}}}
  }};
  writeJSON('pc01_lernpfad_v2', demo01);
  writeJSON('pc02_lernpfad_v2', demo02);
  setCacheFor('0.1', demo01, null);
  setCacheFor('0.2', demo02, null);
  view.sel = '0.3';
  renderApp();
}

const storedMeta = readJSON(HUB_META_KEY);
if (storedMeta && storedMeta.avatar) meta = storedMeta;

if (new URLSearchParams(location.search).get('demo') === '1'){
  loadDemo();
} else {
  const savedStudent = readJSON(HUB_STUDENT_KEY);
  if (savedStudent && savedStudent.klasse && savedStudent.vorname && savedStudent.initial){
    student = savedStudent;
    view.sel = getOverview().nextStation.id;
    renderApp();
    if (getSyncEndpoint()){
      loadFromTeacher(student).then(res => {
        if (res && res.ok && res.found && res.snapshot && applyCloudSnapshot(res.snapshot)){
          view.sel = getOverview().nextStation.id;
          if (!view.activeLesson) renderApp();
          toast('\u2601\uFE0F Aktueller Spielstand aus der Cloud geladen!');
        }
      });
    }
  } else {
    startScreen();
  }
}
})();
</script>
