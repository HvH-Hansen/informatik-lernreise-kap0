eturn h('div', {style:'display:flex;flex-direction:column;gap:14px'}, grid, msg);\n}\n\nfunction stepsTask(id, part, cfg){\n  const p = P(id, part);\n  const root = h('div', {class:'sim-wrap'});\n  let sim, steps, done, cur, sol, wrong, finished;\n  let metaEl, listEl, msgEl, ladderEl;\n  const firstUndone = () => steps.findIndex((_, k) => !done.has(k));\n  const setMsg = (t, cls) => { msgEl.className = 'msg ' + (cls || ''); msgEl.textContent = t || ''; };\n\n  function build(){\n    sim = cfg.make();\n    steps = cfg.steps(sim);\n    done = new Set(); sol = new Set(); cur = 0; wrong = 0; finished = !!p.done;\n    if (finished) steps.forEach((_, k) => done.add(k));\n    root.innerHTML = '';\n    metaEl = h('div', {class:'meta'});\n    listEl = h('ol', {class:'sl'});\n    msgEl = h('p', {class:'msg', 'aria-live':'polite'});\n    ladderEl = h('div', {});\n    const box = h('div', {class:'steps-box'}, metaEl, listEl, msgEl, ladderEl,\n      h('div', {class:'row'}, h('button', {class:'btn small ghost', type:'button', onclick:() => build()}, '↺ Neu starten')));\n    if (cfg.hint) root.append(h('p', {class:'hint-line'}, cfg.hint));\n    root.append(box, h('div', {class:'sim-grid' + (sim.side ? '' : ' noside')}, sim.el, sim.side));\n    sim.setEmit(onEvent);\n    skipAlready();\n    if (finished) setMsg('Schon geschafft! Du darfst gern noch weiter üben.', 'good');\n    drawSteps();\n  }\n  function skipAlready(){\n    if (cfg.any) return;\n    while (cur \u003c steps.length && steps[cur].already && steps[cur].already(sim)){ done.add(cur); cur++; }\n  }\n  function drawSteps(){\n    const n = steps.length;\n    metaEl.innerHTML = '';\n    const dots = h('div', {class:'dots', 'aria-hidden':'true'});\n    steps.forEach((_, k) => dots.append(h('i', {class:done.has(k) ? 'd' : (!cfg.any && k === cur && !finished ? 'a' : '')})));\n    metaEl.append(h('span', {}, finished || done.size === n ? 'Alle Schritte geschafft ✓' : cfg.any ? `${done.size} von ${n} geschafft` : `Schritt ${cu ){\n  const sim = {emit:() => {}, hlKeys:[], sel:0, doneLines:new Set()};\n  const LINES = [\n    {nr:1, task:'1. Schriftfarbe Rot', style:{color:'#15303f', size:'16px', bold:false, font:'Lexend, sans-serif', newline:false, bullet:false}},\n    {nr:2, task:'2. Schriftgröße 20', style:{color:'#15303f', size:'16px', bold:false, font:'Lexend, sans-serif', newline:false, bullet:false}},\n    {nr:3, task:'3. Fett schreiben', style:{color:'#15303f', size:'16px', bold:false, font:'Lexend, sans-serif', newline:false, bullet:false}},\n    {nr:4, task:'4. Times New Roman', style:{color:'#15303f', size:'16px', bold:false, font:'Lexend, sans-serif', newline:false, bullet:false}},\n    {nr:5, task:'5. Neue Zeile nach Satz 1', style:{color:'#15303f', size:'16px', bold:false, font:'Lexend, sans-serif', newline:false, bullet:false}},\n    {nr:6, task:'6. Aufzählungszeichen (•)', style:{color:'#15303f', size:'16px', bold:false, font:'Lexend, sans-serif', newline:false, bullet:false}}\n  ];\n  sim.lines = LINES;\n  const wrap = h('div', {class:'wp-win'});\n  const ribbon = h('div', {class:'wp-ribbon'});\n  const page = h('div', {class:'wp-page'});\n\n  function act(action){\n    const L = LINES[sim.sel];\n    if (action === 'red') L.style.color = '#bf3e2d';\n    else if (action === 'size20') L.style.size = '20px';\n    else if (action === 'bold') L.style.bold = !L.style.bold;\n    else if (action === 'times') L.style.font = '\"Times New Roman\", Times, serif';\n    else if (action === 'newline') L.style.newline = true;\n    else if (action === 'bullet'){ L.style.bullet = true; L.style.newline = true; }\n    render();\n    sim.emit({type:'format', line:sim.sel + 1, action, style:L.style}, sim);\n  }\n  sim.applySolve = (lineIdx, action) => { sim.sel = lineIdx; act(action); };\n\n  function render(){\n    ribbon.innerHTML = '';\n    const btn = (id, label, styleStr) => h('button', {\n      type:'button', class:'wp-btn', 'data-hl':id, style:styleStr || '',\n      onclick:() => act(id)\n    }, label);\n    ribbon.append(\n      btn('times', 'Schriftart: Times New Roman ▾', 'font-family:\"Times New Roman\",serif'),\n      btn('size20', 'Schriftgröße: 20 ▾', ''),\n      btn('bold', 'F Fett', 'font-weight:800'),\n      btn('red', 'A Schriftfarbe Rot', 'color:#bf3e2d;border-bottom:3px solid #bf3e2d'),\n      btn('newline', '↵ Neue Zeile', ''),\n      btn('bullet', '• Aufzählung', '')\n    );\n\n    page.innerHTML = '';\n    page.append(h('div', {style:'font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px'},\n      '📄 Text_formatieren.docx – Klicke zuerst auf den Textblock, dann oben auf das Werkzeug!'));\n    LINES.forEach((L, idx) => {\n      const st = L.style;\n      const s1 = 'Beim Basketballcamp lernen wir coole Tricks.';\n      const s2 = 'Am Ende gibt es ein großes Turnier.';\n      const contentHtml = st.bullet ? `&bull; ${s1}\u003cbr>&bull; ${s2}` : st.newline ? `${s1}\u003cbr>${s2}` : `${s1} ${s2}`;\n      const row = h('div', {\n        class:'wp-line' + (sim.sel === idx ? ' sel' : '') + (sim.doneLines.has(idx + 1) ? ' done' : ''),\n        'data-hl':'line' + (idx + 1),\n        onclick:() => { sim.sel = idx; render(); sim.emit({type:'select', line:idx + 1}, sim); }\n      },\n        h('div', {style:'font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between'},\n          h('span', {}, `Block ${L.nr} (${L.task})`),\n          h('span', {style:'color:var(--good)'}, sim.doneLines.has(idx + 1) ? '✓ fertig' : (sim.sel === idx ? '● ausgewählt' : 'anklicken'))),\n        h('div', {\n          style:`color:${st.color};font-size:${st.size};font-weight:${st.bold ? '700' : '400'};font-family:${st.font};line-height:1.5`,\n          html:contentHtml\n        })\n      );\n      page.append(row);\n    });\n  }\n  wrap.append(ribbon, page);\n  sim.hl = keys => {\n    wrap.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));\n    [].concat(keys || []).forEa nt)}\n.nav-item[data-state=done] .nav-num{border-color:var(--good);background:var(--good);color:#fff}\n.nav-item.zusatz .nav-num{border-style:dashed;border-color:var(--star-line);color:var(--star)}\n.nav-item.zusatz[data-state=done] .nav-num{background:var(--star);border-color:var(--star);border-style:solid;color:#fff}\n.nav-sep{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px;font-weight:600}\nmain{min-width:0;max-width:860px;display:flex;flex-direction:column;gap:28px;outline:none}\n@keyframes pageEnter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media (prefers-reduced-motion:no-preference){main > *{animation:pageEnter 260ms var(--ease-enter) both}}\n\n/* Seitenkopf */\n.st-head{display:flex;flex-direction:column;gap:10px}\n.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.st-head h2{font-size:32px}\n.intro{max-width:58ch;color:#274454;font-size:18px;line-height:1.7}\n\n/* Aufgabenblock – großzügiges Spacing & taktile Claymorphism-Tiefe */\n.task{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:30px 34px;display:flex;flex-direction:column;gap:24px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 24px rgba(21,48,63,.05)}\n.task.zusatz{border:2px dashed var(--star-line);background:linear-gradient(180deg,#ffffff,#fffaf5)}\n.task-head{display:flex;gap:14px;align-items:flex-start}\n.tag{flex:none;font-size:13px;font-weight:600;background:var(--good-soft);color:var(--good);border-radius:8px;padding:4px 10px;margin-top:3px}\n.tag.tag-star{background:var(--star-soft);color:var(--star)}\n.prompt{flex:1;font-weight:500;max-width:58ch;font-size:18px;line-height:1.65}\n.badge{flex:none;font-size:13px;border-radius:99px;padding:4px 12px;margin-top:3px;white-space:nowrap}\n.badge[data-s=offen]{background:var(--surface-2);color:var(--muted)}\n.badge[data-s=begonnen]{background:var(--accent-soft);color:var(--accent)}\n.badge[data-s=erledigt]{background:var(--good-soft);color:var(--good)}\n\n.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}\n.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-md);padding:12px 22px;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--accent-dark),0 4px 12px rgba(26,116,174,.18);transition:filter var(--m-in) var(--ease),transform var(--m-press) var(--ease),box-shadow var(--m-press) var(--ease)}\n.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}\n.btn:active:not(:disabled){transform:translateY(2px) scale(.985);box-shadow:0 1px 0 var(--accent-dark)}\n.btn:disabled{background:#a9bccb;cursor:not-allowed;filter:none;box-shadow:none}\n.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);box-shadow:0 2px 0 var(--accent-soft)}\n.btn.ghost:hover:not(:disabled){background:var(--accent-soft)}\n.btn.ghost:active:not(:disabled){box-shadow:none}\n.btn.small{min-height:44px;padding:9px 15px;font-size:15px;border-radius:var(--r-sm)}\n.btn.big{font-size:18px;padding:14px 28px}\n.msg{min-height:1.5em;font-weight:500;font-size:17px}\n.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.warn{color:var(--warn)}\n\n/* Hilfe-Leiter */\n.help{display:flex;flex-direction:column;gap:12px;align-items:flex-start}\n.btn-help{min-height:44px;border:1.5px solid #e2c56b;background:#fff9e6;color:#6b4e00;border-radius:99px;padding:8px 18px;font-size:15px;font-weight:600;box-shadow:0 2px 0 #ead794;transition:background var(--m-in) var(--ease),transform var(--m-press) var(--ease)}\n.btn-help:hover{background:#fdeeb5;transform:translateY(-1px)}\n.btn-help:active{transform:translateY(1px) scale(.985);box-shadow:none}\n.help.nudge .btn-help{animation:pulse 1.4s ease-in-out 4}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,197,107,.0)}50%{box-shadow:0 0 0 8px rgba(226,197,107,.45)}}\n.tip{background:#fffbea;border-left:4px solid #e2c56b;border-radius:10px;padding:14px 18px;font-size:16px;line-height:1.6;max-width:60ch}\n.confirm{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--bad-soft);border-radius:10px;padding:14px 18px;font-size:16px}\n.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}\n.chip{min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:15px;box-shadow:0 2px 0 var(--line);transition:transform var(--m-press) var(--ease),background var(--m-in) var(--ease)}\n.chip:hover{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-1px)}\n.chip:active{transform:translateY(1px) scale(.985);box-shadow:none}\n\n/* Zuordnen */\n.pool{display:flex;flex-wrap:wrap;gap:12px;min-height:72px;padding:18px;border:2px dashed var(--line);border-radius:var(--r-md);background:var(--surface-2)}\n.pool:empty::after{content:\"Alle Karten sind verteilt. Klicke auf „Prüfen“.\";color:var(--muted);font-size:15px;align-self:center}\n.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}\n.bucket{border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;min-height:165px;cursor:pointer;transition:border-color var(--m-in) var(--ease),background var(--m-in) var(--ease)}\n.sort.has-sel .bucket{border-color:var(--accent);background:var(--accent-soft)}\n.bucket.over{border-color:var(--accent);background:var(--accent-soft)}\n.bucket-head{display:flex;gap:8px;align-items:center;font-weight:600;font-size:16px;padding:12px 14px;border-bottom:1.5px solid var(--line)}\n.b-icon{font-size:24px}\n.bucket-body{display:flex;flex-direction:column;gap:10px;padding:12px;flex:1}\n.card{min-height:44px;display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding: pool.append(ce);\n  });\n  function select(cid){ selected = cid; Object.values(cardEls).forEach(e => e.classList.toggle('sel', e.dataset.c === cid)); root.classList.toggle('has-sel', !!cid); }\n  function place(cid, bid){ const ce = cardEls[cid]; if (ce.classList.contains('locked')) return; bodies[bid].append(ce); select(null); touch(id); msg.textContent = ''; }\n  function finishIfAll(){\n    if (cfg.cards.every(c => p.locked.includes(c.id))){\n      partDone(id, part, {score:p.firstScore == null ? 0 : p.firstScore, max:cfg.cards.length});\n      msg.className = 'msg good'; msg.textContent = 'Alles richtig! 🎉';\n      checkBtn.hidden = true; return true;\n    }\n    return false;\n  }\n  function check(){\n    const open = cfg.cards.filter(c => !p.locked.includes(c.id));\n    const unplaced = open.filter(c => cardEls[c.id].parentElement === pool);\n    if (unplaced.length){ msg.className = 'msg warn'; msg.textContent = `Es fehlen noch ${unplaced.length} Karten.`; return; }\n    let right = 0, wrong = 0;\n    open.forEach(c => {\n      const ce = cardEls[c.id];\n      const bid = ce.parentElement.parentElement.dataset.b;\n      if (bid === c.b){ right++; p.locked.push(c.id); ce.classList.add('locked', 'pop'); }\n      else { wrong++; ce.classList.add('shake'); setTimeout(() => { ce.classList.remove('shake'); pool.append(ce); }, 520); }\n    });\n    p.checks++; p.wrongTotal = (p.wrongTotal || 0) + wrong; T(id).attempts++;\n    if (p.firstScore == null) p.firstScore = right;\n    if (!finishIfAll()){\n      msg.className = 'msg bad'; msg.textContent = `${right} richtig, ${wrong} noch falsch. Probier es nochmal!`;\n      if (p.checks >= 2) ladder.nudge();\n      saveState();\n    }\n  }\n  const checkBtn = h('button', {class:'btn', type:'button', onclick:check}, 'Prüfen');\n  const tips = (cfg.tips || []).concat([{solution:true, action(){\n    const open = cfg.cards.filter(c => !p.locked.includes(c.id));\n    if (!open.length) return;\n    const c = open[Math.floor(Ma ) return;\n      cur[target] = w; b.disabled = true; sel = null; render(); touch(id); msg.textContent = '';\n    });\n    wordEls[w] = b; bank.append(b);\n  });\n  Object.values(p.locked).forEach(w => { if (wordEls[w]) wordEls[w].disabled = true; });\n  function render(){\n    gapEls.forEach((g, i) => {\n      const w = p.locked[i] || cur[i];\n      g.textContent = w || '…………';\n      g.classList.toggle('locked', !!p.locked[i]);\n      g.classList.toggle('sel', sel === i);\n    });\n  }\n  function finishIfAll(){\n    if (answers.every((_, i) => p.locked[i])){\n      partDone(id, part, {score:p.firstScore == null ? 0 : p.firstScore, max:answers.length});\n      msg.className = 'msg good'; msg.textContent = doneMsg;\n      checkBtn.hidden = true; return true;\n    }\n    return false;\n  }\n  function check(){\n    const open = answers.map((_, i) => i).filter(i => !p.locked[i]);\n    const empty = open.filter(i => !cur[i]);\n    if (empty.length){ msg.className = 'msg warn'; msg.textContent = `Es fehlen noch ${empty.length} Lücken.`; return; }\n    let right = 0, wrong = 0;\n    open.forEach(i => {\n      if (cur[i] === answers[i]){ right++; p.locked[i] = cur[i]; delete cur[i]; }\n      else { wrong++; wordEls[cur[i]].disabled = false; delete cur[i]; gapEls[i].classList.add('shake'); setTimeout(() => gapEls[i].classList.remove('shake'), 500); }\n    });\n    p.checks++; p.wrongTotal = (p.wrongTotal || 0) + wrong; T(id).attempts++;\n    if (p.firstScore == null) p.firstScore = right;\n    render();\n    if (!finishIfAll()){\n      msg.className = 'msg bad'; msg.textContent = `${right} richtig, ${wrong} falsch. Versuch es nochmal!`;\n      if (p.checks >= 2) ladder.nudge();\n      saveState();\n    }\n  }\n  const checkBtn = h('button', {class:'btn', type:'button', onclick:check}, 'Prüfen');\n  const ladder = helpLadder(id, part, (cfg.tips || []).concat([{solution:true, action(){\n    const open = answers.map((_, i) => i).filter(i => !p.locked[i]);\n    if (!open.length) return;\n    const i = open[Math.floor(Math.random() * open.length)];\n    if (cur[i]){ wordEls[cur[i]].disabled = false; delete cur[i]; }\n    for (const k of Object.keys(cur)) if (cur[k] === answers[i]) delete cur[k];\n    p.locked[i] = answers[i]; wordEls[answers[i]].disabled = true; p.solved = (p.solved || 0) + 1;\n    render(); finishIfAll();\n  }}]));\n  render();\n  if (p.done){ checkBtn.hidden = true; msg.className = 'msg good'; msg.textContent = doneMsg; }\n  return h('div', {style:'display:flex;flex-direction:column;gap:18px'},\n    h('p', {class:'hint-line'}, 'Klicke auf ein Wort unten. Es springt in die nächste freie Lücke.'),\n    textEl, bank, h('div', {class:'row'}, checkBtn, msg), ladder.el);\n}\n\nfunction mcTask(id, part, cfg){\n  const p = P(id, part); p.wrong = p.wrong || [];\n  const fb = h('p', {class:'msg', 'aria-live':'polite'});\n  const box = h('div', {class:'mc'});\n  if (cfg.q) box.append(h('p', {style:'font-weight:600;font-size:18px'}, cfg.q));\n  const keys = 'ABCDEF';\n  cfg.options.forEach((o, i) => {\n    const b = h('button', {class:'opt', type:'button'}, h('span', {class:'k'}, keys[i]), h('span', {}, o));\n    if (p.done){ b.disabled = true; if (i === cfg.correct) b.classList.add('good'); }\n    else if (p.wrong.includes(i)){ b.disabled = true; b.classList.add('bad'); }\n    b.addEventListener('click', () => {\n      if (p.done) return;\n      touch(id); T(id).attempts++;\n      if (p.firstChoice == null) p.firstChoice = o;\n      if (i === cfg.correct){\n        b.classList.add('good');\n        box.querySelectorAll('.opt').forEach(x => x.disabled = true);\n        fb.className = 'msg good'; fb.textContent = cfg.good || 'Richtig! 🎉';\n        partDone(id, part, {score:p.wrong.length === 0 ? 1 : 0, max:1, answer:o});\n      } else {\n        p.wrong.push(i); b.classList.add('bad'); b.disabled = true;\n        fb.className = 'msg bad'; fb.textContent = (cfg.bad && cfg.bad[i]) || 'Nicht ganz. Lies noch einmal genau.';\n        saveState();\n      }\n    });\n    box.append(b);\n  });\n  if (p.done){ fb.className = 'msg good'; fb.textContent = cfg.good || 'Richtig! 🎉'; }\n  box.append(fb);\n  return box;\n}\n\nfunction textTask(id, part, cfg){\n  const p = P(id, part);\n  const ta = h('textarea', {id:`ta-${id}-${part}`, rows:cfg.rows || 4, placeholder:cfg.placeholder || 'Schreibe hier …', spellcheck:'true'});\n  ta.value = p.text != null ? p.text : (p.draft || '');\n  const cnt = h('span', {class:'count'});\n  const msg = h('span', {class:'msg', 'aria-live':'polite'});\n  const saveBtn = h('button', {class:'btn', type:'button'}, 'Antwort speichern');\n  function upd(){\n    const w = countWords(ta.value);\n    cnt.textContent = `${w} ${w === 1 ? 'Wort' : 'Wörter'} (mindestens ${cfg.min})`;\n    cnt.classList.toggle('ok', w >= cfg.min);\n    saveBtn.disabled = w \u003c cfg.min;\n  }\n  let draftT = null;\n  ta.addEventListener('input', () => {\n    touch(id); upd();\n    clearTimeout(draftT); draftT = setTimeout(() => { p.draft = ta.value; saveState(); }, 700);\n    if (p.done && ta.value.trim() !== p.text){ msg.className = 'msg warn'; msg.textContent = 'Bitte noch einmal speichern.'; }\n  });\n  ta.addEventListener('paste', e => {\n    let len = 0; try { len = (e.clipboardData.getData('text') || '').length; } catch(_){}\n    p.pasteCount = (p.pasteCount || 0) + 1; p.pasteChars = (p.pasteChars || 0) + len; saveSoon();\n  });\n  saveBtn.addEventListener('click', () => {\n    const txt = ta.value.trim();\n    clearTimeout(draftT);\n    partDone(id, part, {text:txt, words:countWords(txt), saves:(p.saves || 0) + 1, savedAt:iso()});\n    delete p.draft;\n    msg.className = 'msg good'; msg.textContent = 'Gespeichert ✓';\n  });\n  function insert(s){\n    const pre = ta.value && !/\\s$/.test(ta.value) ? ' ' : '';\n    const startPos = ta.value.length + pre.length;\n    ta.value += pre + s + ' '; ta.focus();\n    const gap = s.indexOf('…');\n    if (gap >= 0){ ta.selectionStart = startPos + gap; ta.selectionEnd = startPos + gap + 1; }\n    else ta.selectionStart = ta.selectionEnd = ta.value.length;\n    p.startersUsed = (p.startersUsed || 0) + 1; touch(id); upd(); saveSoon();\n  }\n  const tips = [];\n  if (cfg.starters) tips.push({html:'Klicke auf einen Satzanfang:', node:() => h('div', {class:'chips'}, cfg.starters.map(s => h('button', {class:'chip', type:'button', onclick:() => insert(s)}, s)))});\n  (cfg.tips || []).forEach(t => tips.push(typeof t === 'string' ? {html:t} : t));\n  const ladder = tips.length ? helpLadder(id, part, tips) : null;\n  upd();\n  if (p.done && p.text != null){ msg.className = 'msg good'; msg.textContent = 'Gespeichert ✓'; }\n  return h('div', {class:'text-task'},\n    ta, h('div', {class:'row'}, saveBtn, cnt, msg), ladder ? ladder.el : null);\n}\n\nfunction rateTask(id, part, cfg){\n  const p = P(id, part); p.answers = p.answers || {};\n  const grid = h('div', {class:'rate'});\n  const msg = h('p', {class:'msg good', 'aria-live':'polite'});\n  const LV = [['😀', 'Kann ich gut'], ['🙂', 'Geht so'], ['😕', 'Noch unsicher']];\n  cfg.items.forEach(it => {\n    const opts = h('div', {class:'opts'});\n    LV.forEach(l => {\n      const b = h('button', {type:'button', 'aria-pressed':p.answers[it.k] === l[1] ? 'true' : 'false'}, l[0] + ' ' + l[1]);\n      b.addEventListener('click', () => {\n        p.answers[it.k] = l[1]; touch(id);\n        opts.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true');\n        if (cfg.items.every(x => p.answers[x.k])){ partDone(id, part, {answers:Object.assign({}, p.answers)}); msg.textContent = 'Danke! ✓'; } else saveSoon();\n      });\n      opts.append(b);\n    });\n    grid.append(h('div', {class:'rate-row'}, h('span', {style:'font-weight:500'}, it.label), opts));\n  });\n  if (p.done) msg.textContent = 'Danke! ✓';\n  return h('div', {style:'display:flex;flex-direction:column;gap:14px'}, grid, msg);\n}\n\nfunction stepsTask(id, part, cfg){\n  const p = P(id, part);\n  const root = h('div', {class:'sim-wrap'});\n  let sim, steps, done, cur, sol, wrong, finished;\n  let metaEl, listEl, msgEl, ladderEl;\n  const firstUndone = () => steps.findIndex((_, k) => !done.has(k));\n  const setMsg = (t, cls) => { msgEl.className = 'msg ' + (cls || ''); msgEl.textContent = t || ''; };\n\n  function build(){\n    sim = cfg.make();\n    steps = cfg.steps(sim);\n    done = new Set(); sol = new Set(); cur = 0; wrong = 0; finished = !!p.done;\n    if (finished) steps.forEach((_, k) => done.add(k));\n    root.innerHTML = '';\n    metaEl = h('div', {class:'meta'});\n    listEl = h('ol', {class:'sl'});\n    msgEl = h('p', {class:'msg', 'aria-live':'polite'});\n    ladderEl = h('div', {});\n    const box = h('div', {class:'steps-box'}, metaEl, listEl, msgEl, ladderEl,\n      h('div', {class:'row'}, h('button', {class:'btn small ghost', type:'button', onclick:() => build()}, '↺ Neu starten')));\n    if (cfg.hint) root.append(h('p', {class:'hint-line'}, cfg.hint));\n    root.append(box, sim.el);\n    sim.setEmit(onEvent);\n    skipAlready();\n    if (finished) setMsg('Schon geschafft! Du darfst gern noch weiter üben.', 'good');\n    drawSteps();\n  }\n  function skipAlready(){\n    while (cur \u003c steps.length && steps[cur].already && steps[cur].already(sim)){ done.add(cur); cur++; }\n  }\n  function drawSteps(){\n    const n = steps.length;\n    metaEl.innerHTML = '';\n    const dots = h('div', {class:'dots', 'aria-hidden':'true'});\n    steps.forEach((_, k) => dots.append(h('i', {class:done.has(k) ? 'd' : (k === cur && !finished ? 'a' : '')})));\n    metaEl.append(h('span', {}, finished || done.size === n ? 'Alle Schritte geschafft ✓' : `Schritt ${cur + 1} von ${n}`), dots);\n    listEl.innerHTML = '';\n    steps.forEach((s, k) => {\n      if (done.has(k)) listEl.append(h('li', {class:'done'}, h('span', {class:'n'}, '✓'), h('span', {class:'t'}, s.short)));\n      else if (k === cur) listEl.append(h('li', {class:'active' function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }

  const endpoint = getSyncEndpoint();
  if (!endpoint) return { ok:false, error:'Kein Endpunkt konfiguriert' };
  const payload = buildBundleExport(ov);
  try {
    const res = await fetch(endpoint, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body:JSON.stringify(payload),
      redirect:'follow'
    });
    let data = null;
    const txt = await res.text();
    try { data = JSON.parse(txt); } catch(e){}
    if (!res.ok || (data && data.ok === false)){
      throw new Error((data && data.error) || ('HTTP ' + res.status));
    }

    writeJSON(HUB_LASTSYNC_KEY, { at, schueler:student });

  const endpoint = getSyncEndpoint();
  const id = studentKey(stObj);
  if (!endpoint || !id) return { ok:false, found:false };
  const sep = endpoint.includes('?') ? '&' : '?';
  const url = `${endpoint}${sep}action=load&id=${encodeURIComponent(id)}`;
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
  try {
    const res = await fetch(url, { redirect:'follow', signal: ctrl ? ctrl.signal : undefined });
    if (timer) clearTimeout(timer);
    const txt = await res.text();
    const data = JSON.parse(txt);
    if (!res.ok || !data || data.ok === false) return { ok:false, found:false };
    return data;
  } catch(err){
    if (timer) clearTimeout(timer);
    return { ok:false, found:false };
  }

function applyCloudSnapshot(snap){
  if (!snap || !student) return false;
  if (snap.schueler && !sameStudent(snap.schueler, student)) return false;
  let changed = false;
  if (snap.begleiter && AVATARS.some(a => a.id === snap.begleiter) && meta.avatar !== snap.begleiter){
    meta.avatar = snap.begleiter;
    writeJSON(HUB_META_KEY, meta);
    changed = true;
  }
  const stationsMap = snap.stations || {};
  STATIONS.forEach(st => {
    const cloudRaw = stationsMap[st.id];
    if (!cloudRaw || !cloudRaw.tasks) return;
    if (!cloudRaw.student) cloudRaw.student = student;
    const localRaw = getStationRaw(st);
    const cloudCnt = countRawTasks(cloudRaw);
    const localCnt = countRawTasks(localRaw);
    const cloudT = cloudRaw.lastSavedAt ? new Date(cloudRaw.lastSavedAt).getTime() : 0;
    const localT = localRaw && localRaw.lastSavedAt ? new Date(localRaw.lastSavedAt).getTime() : 0;
    if (!localRaw || cloudCnt > localCnt || (cloudCnt === localCnt && cloudT > localT)){
      writeJSON(st.key, cloudRaw);
      setCacheFor(st.id, cloudRaw, null);
      changed = true;
    }
  });
  return changed;
}

function readJSON(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function getCache(){ return readJSON(HUB_CACHE_KEY) || {}; }
function setCacheFor(id, rawState, exportData){
  const c = getCache();
  c[id] = {rawState, exportData, syncedAt:iso()};
  writeJSON(HUB_CACHE_KEY, c);
}

function sameStudent(a, b){
  return a && b && String(a.klasse).toLowerCase() === String(b.klasse).toLowerCase()
    && String(a.vorname).toLowerCase() === String(b.vorname).toLowerCase()
    && String(a.initial).toUpperCase() === String(b.initial).toUpperCase();
}

function getStationRaw(st){
  const direct = readJSON(st.key);
  const cached = (getCache()[st.id] || {}).rawState || null;
  if (direct && student && sameStudent(direct.student, student)){
    if (!cached || !sameStudent(cached.student, student)) return direct;
    const dT = direct.lastSavedAt ? new Date(direct.lastSavedAt).getTime() : 0;
    const cT = cached.lastSavedAt ? new Date(cached.lastSavedAt).getTime() : 0;
    return dT >= cT ? direct : cached;
  }
  if (cached && student && sameStudent(cached.student, student)) return cached;
  return null;
}

function computeStationProgress(st){
  const raw = getStationRaw(st);
  const pflicht = st.tasks.filter(t => t.type === 'pflicht');
  const zusatz  = st.tasks.filter(t => t.type === 'zusatz');
  if (!raw){
    return {
      raw:null, state:'open', done:0, total:pflicht.length, pct:0,
      zusDone:0, zusTotal:zusatz.length,
      star1:false, star2:false, star3:false, stars:0, pctAuto:0, stampDate:null
    };
  }
  const tasks = raw.tasks || {};
  const done = pflicht.filter(t => tasks[t.id] && tasks[t.id].status === 'erledigt').length;
  const started = st.tasks.some(t => tasks[t.id] && tasks[t.id].status !== 'offen');
  const zusDone = zusatz.filter(t => tasks[t.id] && tasks[t.id].status === 'erledigt').length;

  let aP = 0, aM = 0;
  pflicht.forEach(def => {
    if (def.max){
      aM += def.max;
      const t = tasks[def.id];
      if (t) Object.values(t.parts || {}).forEach(p => { if (p.max) aP += p.score || 0; });
    }
  });
  const pctAuto = aM ? Math.min(100, Math.round(aP / aM * 100)) : 100;
  const star1 = done === pflicht.length;
  const star2 = star1 && pctAuto >= 80;
  const star3 = zusDone > 0;
  let lastDoneAt = null;
  if (star1){
    pflicht.forEach(def => {
      const d = tasks[def.id]?.doneAt;
      if (d && (!lastDoneAt || d > lastDoneAt)) lastDoneAt = d;
    });
  }
  return {
    raw, state: star1 ? 'done' : started ? 'started' : 'open',
    done, total:pflicht.length, pct:Math.round(done / pflicht.length * 100),
    zusDone, zusTotal:zusatz.length,
    star1, star2, star3, stars:(star1?1:0)+(star2?1:0)+(star3?1:0),
    pctAuto, stampDate:lastDoneAt
  };
}

function getOverview(){
  const list = STATIONS.map(st => ({st, pr:computeStationProgress(st)}));
  const stamps = list.filter(x => x.pr.star1).length;
  const stars  = list.reduce((a, x) => a + x.pr.stars, 0);
  const anyStarted = list.some(x => x.pr.state !== 'open');
  const ach = {
    start: anyStarted,
    s01: list[0].pr.star1, s02: list[1].pr.star1, s03: list[2].pr.star1,
    s04: list[3].pr.star1, s05: list[4].pr.star1, s06: list[5].pr.star1,
    master: stamps === STATIONS.length
  };
  const nextStation = (list.find(x => !x.pr.star1) || list[list.length - 1]).st;
  return {list, stamps, stars, maxStars:STATIONS.length * 3, ach, nextStation};
}

function mountLottie(el, data, fallbackSvg){
  if (!el) return;
  if (window.lottie && !reduced()){
    try {
      el.innerHTML = '';
      lottie.loadAnimation({container:el, renderer:'svg', loop:false, autoplay:true, animationData:JSON.parse(JSON.stringify(data))});
      return;
    } catch(_){}
  }
  el.innerHTML = fallbackSvg;
}

/* Toast & Konfetti */
let toastT = null;
function toast(text, lottieData, fallbackSvg){
  const t = $('#toast'); t.innerHTML = '';
  if (lottieData){
    const slot = h('span', {class:'lottie-slot sm'});
    t.append(slot);
    mountLottie(slot, lottieData, fallbackSvg);
  }
  t.append(document.createTextNode(text));
  t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2700);
}
function celebrate(text){
  const isStar = text.indexOf('⭐') >= 0 || text.indexOf('🏅') >= 0;
  toast(text, isStar ? LOTTIE_STAR : LOTTIE_CHECK, isStar ? SVG_STAR : SVG_CHECK);
  if (reduced()) return;
  const colors = ['#1a74ae','#0f8a6e','#e8a317','#d45d12','#2ea0c9'];
  for (let i = 0; i < 28; i++){
    const c = h('div', {class:'confetti'});
    c.style.left = (25 + Math.random() * 50) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'vw');
    c.style.setProperty('--rot', (Math.random() * 720) + 'deg');
    c.style.animationDelay = (Math.random() * .25) + 's';
    document.body.append(c);
    setTimeout(() => c.remove(), 2100);
  }
}

/* ================= Embedded Player ================= */
let lastKnownStamps = 0;
let lastTriggerSel = null;

function openStation(stId, specificPage){
  const st = STATIONS.find(x => x.id === stId);
  if (!st) return;
  const act = document.activeElement;
  if (act && act.dataset && act.dataset.trigger) lastTriggerSel = `[data-trigger="${act.dataset.trigger}"]`;
  else if (act && act.closest && act.closest('.marker[data-st]')) lastTriggerSel = `.marker[data-st="${act.closest('.marker[data-st]').dataset.st}"]`;
  else lastTriggerSel = `[data-trigger="panel-open-${stId}"], .marker[data-st="${stId}"]`;
  view.activeLesson = st.id;
  lastKnownStamps = getOverview().stamps;
  const player = $('#player');
  const frame  = $('#pl-frame');
  const title  = $('#pl-title');
  const newtab = $('#pl-newtab');

  const qs = new URLSearchParams({
    hub:'1',
    klasse:student.klasse,
    vorname:student.vorname,
    initial:student.initial
  });
  if (specificPage) qs.set('page', specificPage);
  if (getSyncEndpoint()) qs.set('cloud', '1');
  const url = `${st.file}?${qs.toString()}`;

  title.textContent = `${st.id} ${st.place} – ${st.title}`;
  if (EMBEDDED_LESSONS && EMBEDDED_LESSONS[st.id]){ newtab.hidden = true; } else { newtab.hidden = false; newtab.href = url; }
  updatePlayerStars(st);

  frame.onload = () => {
    const raw = getStationRaw(st);
    if (raw){
      try { frame.contentWindow.postMessage({type:'pc00_hydrate', lessonId:st.id, rawState:raw}, '*'); } catch(e){}
    }
  };
  const embeddedHtml = EMBEDDED_LESSONS && EMBEDDED_LESSONS[st.id];
  if (embeddedHtml){
    const qsTag = `\x3cscript>window.__PC00_QS__=${JSON.stringify('?' + qs.toString())};\x3c/script>`;
    const injectedHtml = /<head>/i.test(embeddedHtml)
      ? embeddedHtml.replace(/<head>/i, m => m + qsTag)
      : (qsTag + embeddedHtml);
    frame.removeAttribute('src');
    frame.srcdoc = injectedHtml;
  } else {
    frame.removeAttribute('srcdoc');
    frame.src = url;
  }
  const appEl = $('#app');
  if (appEl) appEl.inert = true;
  player.hidden = false;
  setTimeout(() => { const cb = $('#pl-close'); if (cb) cb.focus(); }, 20);
}

function updatePlayerStars(st){
  const pr = computeStationProgress(st);
  const el = $('#pl-stars');
  if (el) el.textContent = `${'⭐'.repeat(pr.stars)}${'☆'.repeat(3 - pr.stars)} (${pr.stars}/3)`;
}

function closePlayer(){
  const player = $('#player');
  const frame  = $('#pl-frame');
  const prevStamps = lastKnownStamps;
  player.hidden = true;
  const appEl = $('#app');
  if (appEl) appEl.inert = false;
  frame.removeAttribute('srcdoc');
  frame.src = 'about:blank';
  view.activeLesson = null;
  maybeAutoSync();
  renderApp();
  const restoreEl = (lastTriggerSel && $(lastTriggerSel)) || $('.panel .btn.big') || $('.map-banner .btn');
  if (restoreEl){
    try { restoreEl.focus(); } catch(e){}
  }
  lastTriggerSel = null;
  const nowStamps = getOverview().stamps;
  if (nowStamps > prevStamps){
    celebrate('🏅 Neuer Stempel im Computer-Führerschein! Das Motiv auf der Karte ist aufgewacht!');
  }
}

$('#pl-close').addEventListener('click', closePlayer);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#player').hidden){
    e.preventDefault();
    closePlayer();
  }
});

window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d) return;
  if (d.type === 'pc00_ready' && d.lessonId){
    const st = STATIONS.find(x => x.id === d.lessonId);
    const frame = $('#pl-frame');
    const raw = st ? getStationRaw(st) : null;
    if (st && raw && frame && frame.contentWindow){
      try { frame.contentWindow.postMessage({type:'pc00_hydrate', lessonId:st.id, rawState:raw}, '*'); } catch(e){}
    }
  } else if (d.type === 'pc00_sync' && d.lessonId && d.rawState){
    const st = STATIONS.find(x => x.id === d.lessonId);
    const prevRaw = st ? getStationRaw(st) : null;
    const hasProg = r => r && r.tasks && Object.keys(r.tasks).length > 0;
    if (hasProg(prevRaw) && !hasProg(d.rawState)) return;
    setCacheFor(d.lessonId, d.rawState, d.exportData);
    if (d.key && d.rawState) writeJSON(d.key, d.rawState);
    if (st) updatePlayerStars(st);
  } else if (d.type === 'pc00_submit' && d.lessonId){
    const st = STATIONS.find(x => x.id === d.lessonId);
    if (d.rawState){
      const prevRaw = st ? getStationRaw(st) : null;
      const hasProg = r => r && r.tasks && Object.keys(r.tasks).length > 0;
      if (!(hasProg(prevRaw) && !hasProg(d.rawState))){
        setCacheFor(d.lessonId, d.rawState, d.exportData);
        if (d.key) writeJSON(d.key, d.rawState);
      }
    }
    if (st) updatePlayerStars(st);
    const targetWin = ev.source || ($('#pl-frame') && $('#pl-frame').contentWindow);
    sendToTeacher(getOverview(), false).then(res => {
      try {
        if (targetWin) targetWin.postMessage({ type:'pc00_submit_result', lessonId:d.lessonId, ok:res.ok, at:res.at, error:res.error }, '*');
      } catch(e){}
    });
  } else if (d.type === 'pc00_close'){
    closePlayer();
  }
});

function buildBundleExport(ov){
  const cache = getCache();
  const units = ov.list.map(({st, pr}) => {
    const cachedExport = cache[st.id]?.exportData || null;
    return {
      id:st.id,
      titel:st.title,
      ort:st.place,
      status:pr.state,
      sterne:pr.stars,
      pflicht_erledigt:pr.done,
      pflicht_gesamt:pr.total,
      zusatz_erledigt:pr.zusDone,
      punkte_prozent:pr.pctAuto,
      export_daten:cachedExport,
      roh_stand:pr.raw
    };
  });
  return {
    format:'ki-lernlandkarte-kapitel0',
    version:2,
    schueler:student,
    begleiter:meta.avatar,
    gespeichert:iso(),
    zusammenfassung:{
      stempel:ov.stamps,
      stempel_max:STATIONS.length,
      sterne:ov.stars,
      sterne_max:ov.maxStars,
      abzeichen:Object.keys(ov.ach).filter(k => ov.ach[k])
    },
    einheiten:units
  };
}

function downloadJSON(data, name){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = h('a', {href:URL.createObjectURL(blob), download:name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}


function buildHubHvhFeedback(ov){
  const doneList = ov.list.filter(x => x.pr.star1);
  const bestItem = doneList.slice().sort((a, b) => b.pr.pctAuto - a.pr.pctAuto)[0];
  const startedItem = ov.list.find(x => x.pr.state === 'started');
  const openItem = ov.list.find(x => !x.pr.star1);
  const openZusItem = ov.list.find(x => x.pr.zusDone < x.pr.zusTotal);

  let p1, p2, p3, jumpId = null, jumpLabel = null;
  if (ov.stamps === STATIONS.length && bestItem){
    p1 = `Du hast alle ${STATIONS.length} Stationen gestempelt. Besonders stark warst du in „${bestItem.st.place}“.`;
  } else if (ov.stamps > 0 && bestItem){
    p1 = `Du hast schon ${ov.stamps} von ${STATIONS.length} Stempeln gesammelt. Sehr gut lief „${bestItem.st.place}“.`;
  } else if (startedItem){
    p1 = `Du bist in „${startedItem.st.place}“ schon gestartet. Bleib dran, das schaffst du!`;
  } else {
    p1 = 'Deine Lernlandkarte wartet auf dich. Starte gleich mit der ersten Station!';
  }

  if (openItem){
    const rem = openItem.pr.total - openItem.pr.done;
    p2 = `Mach als Nächstes in „${openItem.st.place}“ weiter. Dort fehlen dir noch ${rem} ${rem === 1 ? 'Aufgabe' : 'Aufgaben'}.`;
    p3 = `Öffne „${openItem.st.place}“ und löse heute noch eine Aufgabe bis zum Haken.`;
    jumpId = openItem.st.id;
    jumpLabel = `„${openItem.st.place}“ öffnen →`;
  } else if (openZusItem){
    p2 = `Alle Pflicht-Stempel sind da! Hol dir jetzt den Zusatz-Stern in „${openZusItem.st.place}“.`;
    p3 = `Schau in „${openZusItem.st.place}“ bei der Zusatzaufgabe vorbei und löse das Rätsel.`;
    jumpId = openZusItem.st.id;
    jumpLabel = `Zu „${openZusItem.st.place}“ →`;
  } else {
    p2 = 'Alle Stationen und Sterne sind geschafft. Sende oder speichere jetzt deinen gesamten Reisepass.';
    p3 = 'Klicke auf „Ergebnisse an Lehrkraft senden“ oder speichere dein Backup für IServ.';
  }

  return h('section', {class:'hvh-fb'},
    h('div', {class:'hvh-fb-head'}, h('h3', {}, 'Dein persönlicher Rückblick')),
    h('div', {class:'hvh-fb-grid'},
      h('div', {class:'hvh-part strength'}, h('b', {}, '1. Deine Stärke'), h('p', {}, p1)),
      h('div', {class:'hvh-part step'}, h('b', {}, '2. Dein nächster Schritt'), h('p', {}, p2)),
      h('div', {class:'hvh-part mini'}, h('b', {}, '3. Deine Mini-Aufgabe'), h('p', {}, p3),
        jumpId ? h('div', {}, h('button', {type:'button', class:'btn small ghost', onclick:() => openStation(jumpId)}, jumpLabel)) : null)));
}

function renderExportView(ov){
  const out = h('div', {style:'display:flex;flex-direction:column;gap:12px'});
  const clean = s => String(s || '').replace(/[^A-Za-z0-9ÄÖÜäöüß-]/g, '');
  const bundleName = `PC00_Reisepass_${clean(student.klasse)}_${clean(student.vorname)}${clean(student.initial)}_${new Date().toISOString().slice(0, 10)}.json`;

  const rows = ov.list.map(({st, pr}) => {
    const cachedExport = (getCache()[st.id] || {}).exportData;
    return h('div', {class:'export-row'},
      h('span', {style:'font-size:24px'}, st.icon),
      h('div', {style:'flex:1;min-width:180px'},
        h('b', {}, `${st.id} ${st.place}`),
        h('div', {style:'font-size:14px;color:var(--muted)'}, `${pr.done}/${pr.total} Pflichtaufgaben · ${pr.stars}/3 ⭐`)),
      cachedExport
        ? h('button', {type:'button', class:'btn small ghost', onclick:() => {
            const n = `${st.prefix}_${clean(student.klasse)}_${clean(student.vorname)}${clean(student.initial)}_${new Date().toISOString().slice(0, 10)}.json`;
            downloadJSON(cachedExport, n);
          }}, 'Einzel-JSON speichern')
        : h('button', {type:'button', class:'btn small ghost', 'data-trigger':'exp-open-' + st.id, onclick:() => openStation(st.id, 'ende')}, 'Im Lernpfad öffnen'));
  });

  const endpoint = getSyncEndpoint();
  const lastSync = readJSON(HUB_LASTSYNC_KEY);
  const lastSyncValid = lastSync && lastSync.at && sameStudent(lastSync.schueler, student);

  const saveAllBtn = h('button', {type:'button', class: endpoint ? 'btn ghost' : 'btn big good', onclick:() => {
    downloadJSON(buildBundleExport(ov), bundleName);
    out.innerHTML = '';
    out.append(h('div', {class:'save-ok'}, h('b', {}, 'Gesamt-Ergebnis gespeichert! \u2713 '),
      `Die Datei \u201E${bundleName}\u201C liegt im Ordner Downloads. Lade sie bei IServ hoch.`));
  }}, endpoint ? '\uD83D\uDCBE Backup als JSON speichern' : '\uD83D\uDCBE Gesamten Reisepass (Kapitel 0) speichern');

  const sendBtn = endpoint ? h('button', {type:'button', class:'btn big good', onclick:async () => {
    sendBtn.disabled = true;
    const prevTxt = sendBtn.textContent;
    sendBtn.textContent = '\u23F3 Wird gesendet\u2026';
    const res = await sendToTeacher(ov, false);
    sendBtn.disabled = false;
    sendBtn.textContent = prevTxt;
    out.innerHTML = '';
    if (res.ok){
      const tStr = new Date(res.at).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
      out.append(h('div', {class:'save-ok'}, h('b', {}, 'Erfolgreich \u00FCbermittelt! \u2713 '),
        `Deine Ergebnisse sind bei deiner Lehrkraft angekommen (${tStr} Uhr).`));
    } else {
      out.append(h('div', {style:'background:#fde8e6;border:1.5px solid #e5a39c;border-radius:var(--r-md);padding:16px 20px;font-size:16px'},
        h('b', {}, '\u26A0\uFE0F Senden fehlgeschlagen: '),
        `${res.error}. Nutze einfach \u201EBackup als JSON speichern\u201C und lade die Datei bei IServ hoch.`));
    }
  }}, '\u2601\uFE0F Ergebnisse an Lehrkraft senden') : null;

  const actions = endpoint
    ? h('div', {class:'row'}, sendBtn, saveAllBtn, h('button', {type:'button', class:'btn ghost', onclick:() => { view.tab = 'map'; renderApp(); }}, '\u2190 Zur\u00FCck zur Karte'))
    : h('div', {class:'row'}, saveAllBtn, h('button', {type:'button', class:'btn ghost', onclick:() => { view.tab = 'map'; renderApp(); }}, '\u2190 Zur\u00FCck zur Karte'));

  const syncHint = endpoint && lastSyncValid
    ? h('p', {style:'font-size:14px;color:var(--good);font-weight:600'}, `\u2713 Zuletzt zentral gespeichert: ${new Date(lastSync.at).toLocaleString('de-DE')}`)
    : null;

  const teacherNote = !endpoint
    ? h('details', {class:'teacher'}, h('summary', {}, 'F\u00FCr Lehrkr\u00E4fte: Zentrale Abgabe ohne JSON'),
        h('p', {style:'margin-top:8px'}, 'In der Online-Version (GitHub Pages) kann in config.js eine Google-Apps-Script-URL hinterlegt werden. Dann erscheinen die Ergebnisse direkt in Google Sheets.'))
    : null;

  const expSlot = h('span', {class:'lottie-slot'});
  mountLottie(expSlot, ov.stamps >= 4 ? LOTTIE_STAR : LOTTIE_CHECK, ov.stamps >= 4 ? SVG_STAR : SVG_CHECK);
  return h('div', {style:'display:flex;flex-direction:column;gap:20px'}, buildHubHvhFeedback(ov), h('section', {class:'export-card'},
    h('div', {class:'row', style:'gap:12px'}, expSlot, h('h2', {}, endpoint ? '\u2601\uFE0F Ergebnisse abgeben' : '\uD83D\uDCBE Ergebnisse f\u00FCr IServ speichern')),
    h('p', {}, `Hier siehst du deinen Stand in allen sechs Einheiten (${ov.stamps} von ${STATIONS.length} Stempeln \u00B7 ${ov.stars} von ${ov.maxStars} \u2B50).`),
    h('div', {style:'display:flex;flex-direction:column;gap:10px'}, rows),
    syncHint,
    actions,
    out,
    teacherNote));
}

function switchUser(){
  if (confirm(`Möchtest du das Profil (${student.vorname} ${student.initial}.) abmelden oder ein anderes Kind anmelden?`)){
    localStorage.removeItem(HUB_STUDENT_KEY);
    student = null;
    startScreen();
  }
}

function renderApp(){
  const app = $('#app'); app.innerHTML = '';
  const ov = getOverview();
  app.append(renderHeader(ov));
  const main = h('main', {id:'main-content', class:'wrap view-enter', tabindex:'-1'});
  if (view.tab === 'map') main.append(renderMapView(ov));
  else if (view.tab === 'passport') main.append(renderPassportView(ov));
  else main.append(renderExportView(ov));
  app.append(main);
  animIn(main.children, {y:10, duration:0.3, stagger:0.05});
}

function startScreen(){
  const app = $('#app'); app.innerHTML = '';
  const saved = readJSON(HUB_STUDENT_KEY);
  const box = h('div', {class:'start'});
  const heroSlot = h('div', {class:'lottie-slot'});
  box.append(
    h('div', {class:'start-head'}, heroSlot, h('h1', {}, h('small', {}, 'Informatik · Klasse 5/6 · Kapitel 0'), 'Willkommen in Mediatown! 🗺️')),
    h('p', {}, 'Begib dich auf die interaktive Lernreise durch alle 6 Computer-Stationen. Sammle Stempel, Sterne und erwecke die ganze Landkarte zum Leben!'));
  mountLottie(heroSlot, LOTTIE_STAR, SVG_STAR);

  if (saved && saved.klasse && saved.vorname && saved.initial){
    box.append(h('div', {style:'background:var(--blue-soft);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px'},
      h('p', {}, h('b', {}, `Willkommen zurück, ${saved.vorname} ${saved.initial}. (Klasse ${saved.klasse})!`)),
      h('div', {class:'row'},
        h('button', {type:'button', class:'btn big', onclick:() => { student = saved; renderApp(); }}, 'Zur Lernlandkarte →'),
        h('button', {type:'button', class:'btn ghost', onclick:() => { form.hidden = false; }}, `Ich bin nicht ${saved.vorname}`))));
  }

  let pickedAv = meta.avatar || 'fuchs';
  const avRow = h('div', {class:'avatar-picker'});
  function drawAv(){
    avRow.innerHTML = '';
    AVATARS.forEach(a => avRow.append(h('button', {type:'button', class:'av-opt' + (pickedAv === a.id ? ' on' : ''), title:a.name, onclick:() => { pickedAv = a.id; drawAv(); }}, a.emoji)));
  }
  drawAv();

  const fK = h('input', {id:'hk', placeholder:'z. B. 5b', maxlength:'6', autocomplete:'off'});
  const fV = h('input', {id:'hv', placeholder:'z. B. Lisa', maxlength:'30', autocomplete:'off'});
  const fI = h('input', {id:'hi', placeholder:'z. B. M', maxlength:'2', autocomplete:'off'});
  const err = h('p', {style:'color:#bf3e2d;font-weight:600'});
  const form = h('form', {style:'display:flex;flex-direction:column;gap:16px', hidden:!!(saved && saved.vorname)},
    h('div', {class:'fields'},
      h('label', {class:'field', for:'hk'}, 'Klasse', fK),
      h('label', {class:'field', for:'hv'}, 'Vorname', fV),
      h('label', {class:'field', for:'hi'}, '1. Buchstabe Nachname', fI)),
    h('div', {}, h('p', {style:'font-weight:600;font-size:15px;margin-bottom:8px'}, 'Wähle deinen Reise-Begleiter:'), avRow),
    err,
    h('div', {class:'row'}, h('button', {type:'submit', class:'btn big'}, 'Reise starten →')));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const k = fK.value.trim(), v = fV.value.trim(), i = fI.value.trim().replace('.', '').toUpperCase();
    if (!k || !v || !i){ err.textContent = 'Bitte f\u00FClle alle drei Felder aus.'; return; }
    student = {klasse:k, vorname:v, initial:i};
    meta = {avatar:pickedAv};
    writeJSON(HUB_STUDENT_KEY, student);
    writeJSON(HUB_META_KEY, meta);
    if (getSyncEndpoint()){
      const subBtn = form.querySelector('button[type="submit"]');
      if (subBtn){ subBtn.disabled = true; subBtn.textContent = '\u23F3 Suche gespeicherten Spielstand\u2026'; }
      const res = await loadFromTeacher(student);
      const restored = res && res.ok && res.found && res.snapshot ? applyCloudSnapshot(res.snapshot) : false;
      view.sel = getOverview().nextStation.id;
      renderApp();
      if (restored) toast(`\u2601\uFE0F Spielstand geladen! Willkommen zur\u00FCck, ${student.vorname}!`);
    } else {
      view.sel = getOverview().nextStation.id;
      renderApp();
    }
  });
  const det = h('details', {class:'teacher'}, h('summary', {}, 'Für Lehrkräfte (Demo & Hinweise)'),
    h('p', {style:'margin-top:8px'}, 'Alle 6 Einheiten lassen sich direkt über diese Karte öffnen. Einmal anmelden genügt für das gesamte Kapitel 0.'),
    h('div', {class:'row', style:'margin-top:10px'},
      h('button', {type:'button', class:'btn small ghost', onclick:() => loadDemo()}, '🔍 Demo-Stand laden (Ansicht testen)')));

  box.append(form, det);
  app.append(box);
  animIn([box], {y:14, duration:0.35, stagger:0});
}

function loadDemo(){
  student = {klasse:'5b', vorname:'Demo', initial:'K'};
  meta = {avatar:'fuchs'};
  writeJSON(HUB_STUDENT_KEY, student);
  writeJSON(HUB_META_KEY, meta);
  // Demo-Fortschritt für Station 0.1 & 0.2 anlegen, damit Karte & Stempelpass sofort lebendig wirken
  const demo01 = {schema:'pc01-lernpfad-v2', student, startedAt:iso(), lastSavedAt:iso(), current:'ende', activeSec:420, stationSec:{}, idle:[], tabLeaves:0, awaySec:0, exports:[], infoSeen:{}, tasks:{
    g1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:5,max:5},steps:{done:true,score:5,max:5}}},
    a1:{status:'erledigt', doneAt:iso(), parts:{gap:{done:true,score:4,max:4},text:{done:true,text:'Demo'}}},
    r1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:7,max:7},q:{done:true,score:1,max:1}}},
    r2:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:5,max:5},check:{done:true,score:4,max:4}}},
    w1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:8,max:8},self:{done:true},text:{done:true,text:'Demo'}}},
    e1:{status:'erledigt', doneAt:iso(), parts:{quiz:{done:true},text:{done:true,text:'Demo'}}}
  }};
  const demo02 = {schema:'pc02-lernpfad-v2', student, startedAt:iso(), lastSavedAt:iso(), current:'ende', activeSec:380, stationSec:{}, idle:[], tabLeaves:0, awaySec:0, exports:[], infoSeen:{}, tasks:{
    m1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:9,max:9}}},
    t1:{status:'erledigt', doneAt:iso(), parts:{steps:{done:true,score:5,max:5},gap:{done:true,score:5,max:5}}},
    f1:{status:'erledigt', doneAt:iso(), parts:{steps:{done:true,score:5,max:6}}},
    z1:{status:'erledigt', doneAt:iso(), parts:{steps:{done:true,score:3,max:3},gap:{done:true,score:5,max:5}}},
    w1:{status:'erledigt', doneAt:iso(), parts:{sort:{done:true,score:7,max:8},self:{done:true},text:{done:true,text:'Demo'}}}
  }};
  writeJSON('pc01_lernpfad_v2', demo01);
  writeJSON('pc02_lernpfad_v2', demo02);
  setCacheFor('0.1', demo01, null);
  setCacheFor('0.2', demo02, null);
  view.sel = '0.3';
  renderApp();
}

const storedMeta = readJSON(HUB_META_KEY);
if (storedMeta && storedMeta.avatar) meta = storedMeta;

if (new URLSearchParams(location.search).get('demo') === '1'){
  loadDemo();
} else {
  const savedStudent = readJSON(HUB_STUDENT_KEY);
  if (savedStudent && savedStudent.klasse && savedStudent.vorname && savedStudent.initial){
    student = savedStudent;
    view.sel = getOverview().nextStation.id;
    renderApp();
    if (getSyncEndpoint()){
      loadFromTeacher(student).then(res => {
        if (res && res.ok && res.found && res.snapshot && applyCloudSnapshot(res.snapshot)){
          view.sel = getOverview().nextStation.id;
          if (!view.activeLesson) renderApp();
          toast('\u2601\uFE0F Aktueller Spielstand aus der Cloud geladen!');
        }
      });
    }
  } else {
    startScreen();
  }
}
})();
</script>
</body>
</html>
