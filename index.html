<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mediatown – Deine Lernreise durch Kapitel 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  /* Primitive Tokens */
  --c-bg:#eef3f6; --c-surface:#ffffff; --c-surface-2:#f5f9fb; --c-ink:#15303f; --c-muted:#4c6675; --c-border:#c8d7e1;
  --c-blue:#1a74ae; --c-blue-dark:#145b8a; --c-blue-soft:#dcecf7;
  --c-teal:#0f8a6e; --c-teal-dark:#0b6b55; --c-teal-soft:#d6f2ea;
  --c-good:#1f7d4a; --c-good-dark:#176139; --c-good-soft:#d9f0e2;
  --c-gold:#d89c14; --c-gold-soft:#fff5d1;
  --c-orange:#d45d12; --c-orange-soft:#fdebd9; --c-orange-line:#f3b88c;
  --c-warn:#9a6a00; --c-warn-soft:#fdf1d2;
  /* Semantic & Component Tokens */
  --bg:var(--c-bg); --surface:var(--c-surface); --surface-2:var(--c-surface-2);
  --ink:var(--c-ink); --muted:var(--c-muted); --line:var(--c-border);
  --blue:var(--c-blue); --blue-soft:var(--c-blue-soft);
  --teal:var(--c-teal); --teal-soft:var(--c-teal-soft);
  --good:var(--c-good); --good-soft:var(--c-good-soft);
  --gold:var(--c-gold); --gold-soft:var(--c-gold-soft);
  --star:var(--c-orange); --star-soft:var(--c-orange-soft); --star-line:var(--c-orange-line);
  --warn:var(--c-warn); --warn-soft:var(--c-warn-soft);
  --f-display:"Fredoka","Lexend",system-ui,"Segoe UI",sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  /* Motion Tokens */
  --m-in:150ms; --m-out:120ms; --m-press:90ms;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}

/* Skip Link */
.skip-link{position:fixed;top:-60px;left:16px;z-index:200;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-sm);font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:top var(--m-in) var(--ease)}
.skip-link:focus{top:14px}

/* Topbar */
.hub-top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1.5px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(21,48,63,.06)}
.hub-brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.hub-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 0 var(--c-blue-dark),0 6px 14px rgba(26,116,174,.22)}
.hub-brand h1{font-size:22px;color:var(--ink)}
.hub-brand small{display:block;font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab-btn{min-height:44px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--line);transition:transform var(--m-in) var(--ease),background var(--m-in) var(--ease),border-color var(--m-in) var(--ease),box-shadow var(--m-in) var(--ease)}
.tab-btn:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
.tab-btn:active{transform:translateY(1px) scale(.985);box-shadow:none}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--c-blue-dark);box-shadow:0 2px 0 var(--c-blue-dark)}

.stats-pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.pill.gold{background:var(--gold-soft);border-color:#e2c56b;color:#785200}
.pill.user{min-height:44px;background:var(--blue-soft);border-color:#98c4e3;color:#114c78;cursor:pointer;box-shadow:0 2px 0 #98c4e3;transition:transform var(--m-in) var(--ease),filter var(--m-in) var(--ease)}
.pill.user:hover{filter:brightness(.97);transform:translateY(-1px)}
.pill.user:active{transform:translateY(1px) scale(.985);box-shadow:none}

/* Main Container */
.wrap{max-width:1320px;margin:0 auto;padding:24px 24px 80px;outline:none}
@keyframes viewEnter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view-enter > *{animation:viewEnter 320ms var(--ease-enter) both}

/* Map Layout (Claymorphism Elevation) */
.map-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:24px;align-items:start}
.map-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07);display:flex;flex-direction:column;gap:14px}
.map-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(95deg,var(--blue-soft),var(--teal-soft));border:1.5px solid #bdd9ea;border-radius:var(--r-md);padding:12px 18px}
.map-banner p{font-size:15px;color:#15303f;line-height:1.5}
.map-svg-box{position:relative;border-radius:var(--r-md);overflow:hidden;border:2px solid #b5cfe0;background:#b9e1f6;box-shadow:inset 0 2px 8px rgba(21,48,63,.08)}
.map-svg{display:block;width:100%;height:auto;user-select:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:2px 4px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot-c{width:14px;height:14px;border-radius:50%;display:inline-block}

/* SVG Interactive Elements */
.motif{transition:filter .5s ease, opacity .5s ease, transform .5s ease}
.motif.asleep{filter:grayscale(1) contrast(.9);opacity:.38}
.motif.awake{filter:none;opacity:1}
.marker{cursor:pointer;outline:none}
.marker .ring{transition:transform var(--m-in) var(--ease), stroke-width var(--m-in) var(--ease)}
.marker:hover .ring,.marker.selected .ring,.marker:focus-visible .ring{transform:scale(1.09)}
.marker.selected .halo,.marker:focus-visible .halo{opacity:1}
.halo{opacity:0;transition:opacity var(--m-in) var(--ease)}
@keyframes nextPulse{0%,100%{transform:scale(1);opacity:.48}50%{transform:scale(1.22);opacity:.12}}
.next-ring{transform-box:fill-box;transform-origin:center;animation:nextPulse 2.4s ease-in-out infinite}
.companion{transition:transform .7s cubic-bezier(.34,1.4,.64,1)}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.companion-inner{animation:floatBob 3s ease-in-out infinite}

/* Side Panel */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07);display:flex;flex-direction:column;gap:18px;position:sticky;top:88px}
.st-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 12px;border-radius:99px;width:fit-content}
.st-chip.r1{background:var(--blue-soft);color:var(--blue)}
.st-chip.r2{background:var(--teal-soft);color:var(--teal)}
.panel h2{font-size:26px}
.panel .desc{font-size:16px;color:#355061;line-height:1.6}
.star-box{background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.star-row{display:flex;align-items:center;gap:10px;font-size:15px}
.star-row.earned{color:var(--ink);font-weight:600}
.star-row.open{color:var(--muted)}
.task-mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task-mini{min-height:44px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);font-size:15px;cursor:pointer;text-align:left;width:100%;box-shadow:0 2px 0 var(--line);transition:transform var(--m-in) var(--ease),border-color var(--m-in) var(--ease),background var(--m-in) var(--ease)}
.task-mini:hover{border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
.task-mini:active{transform:translateY(1px) scale(.988);box-shadow:none}
.task-mini .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:2px solid var(--line);background:#fff;color:var(--muted)}
.task-mini.done .ic{background:var(--good);border-color:var(--good);color:#fff}
.task-mini.started .ic{border-color:var(--blue);color:var(--blue)}
.task-mini.zusatz.done .ic{background:var(--star);border-color:var(--star);color:#fff}

/* Tactile Claymorphic Buttons */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--blue);color:#fff;border-radius:var(--r-md);padding:12px 22px;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--c-blue-dark),0 4px 12px rgba(26,116,174,.2);transition:filter var(--m-in) var(--ease),transform var(--m-press) var(--ease),box-shadow var(--m-press) var(--ease)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 var(--c-blue-dark)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 var(--c-teal-dark),0 4px 12px rgba(15,138,110,.2)}
.btn.teal:active{box-shadow:0 1px 0 var(--c-teal-dark)}
.btn.good{background:var(--good);box-shadow:0 3px 0 var(--c-good-dark),0 4px 12px rgba(31,125,74,.2)}
.btn.good:active{box-shadow:0 1px 0 var(--c-good-dark)}
.btn.ghost{background:var(--surface);color:var(--blue);border:1.5px solid var(--blue);box-shadow:0 2px 0 var(--c-blue-soft)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.ghost:active{box-shadow:none}
.btn.small{min-height:44px;padding:9px 16px;font-size:14px;border-radius:var(--r-sm)}
.btn.big{font-size:18px;padding:14px 26px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* Passport View */
.pp-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.pp-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07);display:flex;flex-direction:column;gap:18px}
.avatar-stage{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--blue-soft),var(--teal-soft));border:1.5px solid #bdd9ea;border-radius:16px;padding:16px}
.avatar-circle{width:76px;height:76px;border-radius:50%;background:#fff;border:3px solid var(--blue);display:grid;place-items:center;font-size:44px;flex:none;box-shadow:0 4px 12px rgba(21,48,63,.12)}
.avatar-picker{display:flex;gap:8px;flex-wrap:wrap}
.av-opt{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:24px;display:grid;place-items:center;box-shadow:0 2px 0 var(--line);transition:transform var(--m-in) var(--ease),border-color var(--m-in) var(--ease)}
.av-opt:hover{transform:translateY(-1px);border-color:var(--blue)}
.av-opt:active{transform:translateY(1px) scale(.96)}
.av-opt.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 2px 0 var(--blue);transform:scale(1.05)}

.pp-bar{height:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.pp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .5s var(--ease-enter)}

.stamps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;font-variant-numeric:tabular-nums}
.stamp-slot{border:2px dashed var(--line);border-radius:18px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:transform var(--m-in) var(--ease),box-shadow var(--m-in) var(--ease)}
.stamp-slot:hover{transform:translateY(-2px)}
.stamp-slot.earned{border-style:solid;border-color:#93c5ab;background:linear-gradient(180deg,#ffffff,#f2fbf6);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 6px 16px rgba(31,125,74,.1)}
.stamp-seal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:38px;border:3px dashed #b9c9d4;color:#8ea3b0;background:#fff;position:relative}
.stamp-slot.earned .stamp-seal{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good);transform:rotate(-4deg)}
.stamp-slot.earned.r2 .stamp-seal{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}

.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ach-card{border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;opacity:.55;filter:grayscale(.9);transition:transform var(--m-in) var(--ease)}
.ach-card.on{opacity:1;filter:none;border-color:#e2c56b;background:#fffdf2;box-shadow:0 3px 0 #ead794,0 5px 14px rgba(216,156,20,.14)}
.ach-card .ai{font-size:30px}

/* Export View */
.export-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:28px 32px;display:flex;flex-direction:column;gap:20px;max-width:900px;margin:0 auto;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 8px 26px rgba(21,48,63,.07)}
.export-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r-md);background:var(--surface-2);border:1.5px solid var(--line);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.save-ok{background:var(--good-soft);border:1.5px solid #93c5ab;border-radius:var(--r-md);padding:16px 20px;font-size:16px}

/* Login / Start Screen */
.start{max-width:650px;margin:48px auto;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:38px 40px;display:flex;flex-direction:column;gap:22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 10px 32px rgba(21,48,63,.08)}
.start h1{font-size:36px}
.start h1 small{display:block;font-size:18px;color:var(--blue);font-weight:600;margin-bottom:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.field input{min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;background:var(--surface-2)}
.field:first-child{grid-column:1/-1;max-width:50%}

/* Embedded Station Player Overlay */
.player{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.player-bar{background:#15303f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.player-bar .title{font-family:var(--f-display);font-size:19px;font-weight:600;flex:1}
.player-bar .btn-back{min-height:44px;background:#fff;color:#15303f;border:0;border-radius:var(--r-sm);padding:8px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 #b8c9d4;transition:background var(--m-in) var(--ease),transform var(--m-press) var(--ease)}
.player-bar .btn-back:hover{background:#dcecf7;transform:translateY(-1px)}
.player-bar .btn-back:active{transform:translateY(1px) scale(.985);box-shadow:none}
.player-frame{flex:1;width:100%;border:0;background:#edf3f7}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--good);color:#fff;font-weight:600;padding:14px 24px;border-radius:99px;opacity:0;transition:opacity .3s,transform .3s;z-index:150;pointer-events:none;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;border-radius:2px;z-index:149;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.6}}

details.teacher{font-size:14px;color:var(--muted)}
details.teacher summary{cursor:pointer;font-weight:600}

@media (max-width:960px){
  .map-layout,.pp-grid{grid-template-columns:1fr}
  .panel{position:static}
  .fields{grid-template-columns:1fr}
  .field:first-child{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===== Ergänzungen: DaZ/A2-Wörter-Hilfe, Merksatz, HvH-Feedback & Lottie ===== */
.has-gsap main > *, .has-gsap .view-enter > *{animation:none!important}
.start-head{display:flex;align-items:center;gap:14px}
.start-head h1{flex:1}
.lottie-slot{width:48px;height:48px;flex:none;display:grid;place-items:center}
.lottie-slot.sm{width:28px;height:28px}
.lottie-slot svg{width:100%;height:100%;display:block}
.toast{display:inline-flex;align-items:center;gap:10px}

.glossary{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(21,48,63,.04)}
.glossary-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.glossary-lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.g-chip{min-height:38px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:99px;padding:5px 14px;font-size:15px;font-weight:500;transition:transform .12s var(--ease),border-color .15s var(--ease),background-color .15s var(--ease)}
.g-chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.g-chip:active{transform:scale(.97)}
.g-chip[aria-expanded=true]{border-color:var(--accent);background:var(--accent);color:#fff}
.g-pop{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:16px;line-height:1.55}

.merke-box{display:flex;flex-direction:column;gap:4px}
.merke-box strong{font-family:var(--f-display);font-size:18px}

.hvh-fb{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--blue, var(--accent));border-radius:var(--r-lg, 18px);padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 16px rgba(21,48,63,.05)}
.hvh-fb-head h3{font-size:21px;color:var(--blue, var(--accent))}
.hvh-fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.hvh-part{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
.hvh-part.strength{background:var(--good-soft);border:1.5px solid #b5dec6}
.hvh-part.step{background:var(--accent-soft, var(--blue-soft));border:1.5px solid #b8d7ec}
.hvh-part.mini{background:var(--warn-soft);border:1.5px solid #ecd496}
.hvh-part b{font-family:var(--f-display);font-size:16px}

</style>
</head>
<body>
<a class="skip-link" href="#main-content">Zum Inhalt springen</a>
<div id="app"></div>
<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="pl-title" hidden>
  <div class="player-bar">
    <button type="button" class="btn-back" id="pl-close">← Zurück zur Lernlandkarte</button>
    <div class="title" id="pl-title">Station</div>
    <span class="pill gold" id="pl-stars">☆☆☆</span>

cludes(c.id))){\n      partDone(id, part, {score:p.firstScore == null ? 0 : p.firstScore, max:cfg.cards.length});\n      msg.className = 'msg good'; msg.textContent = 'Alles richtig! 🎉';\n      checkBtn.hidden = true; return true;\n    }\n    return false;\n  }\n  function check(){\n    const open = cfg.cards.filter(c => !p.locked.includes(c.id));\n    const unplaced = open.filter(c => cardEls[c.id].parentElement === pool);\n    if (unplaced.length){ msg.className = 'msg warn'; msg.textContent = `Es fehlen noch ${unplaced.length} Karten.`; return; }\n    let right = 0, wrong = 0;\n    open.forEach(c => {\n      const ce = cardEls[c.id];\n      const bid = ce.parentElement.parentElement.dataset.b;\n      if (bid === c.b){ right++; p.locked.push(c.id); ce.classList.add('locked', 'pop'); }\n      else { wrong++; ce.classList.add('shake'); setTimeout(() => { ce.classList.remove('shake'); pool.append(ce); }, 520); }\n    });\n    p.checks++; p.wrongTotal = (p.wrongTotal || 0) + wrong; T(id).attempts++;\n    if (p.firstScore == null) p.firstScore = right;\n    if (!finishIfAll()){\n      msg.className = 'msg bad';\n      msg.textContent = `${right} richtig, ${wrong} noch falsch. Probier es nochmal!`;\n      if (p.checks >= 2) ladder.nudge();\n      saveState();\n    }\n  }\n  const checkBtn = h('button', {class:'btn', type:'button', onclick:check}, 'Prüfen');\n  const tips = (cfg.tips || []).concat([{solution:true, action(){\n    const open = cfg.cards.filter(c => !p.locked.includes(c.id));\n    if (!open.length) return;\n    const c = open[Math.floor(Math.random() * open.length)];\n    p.locked.push(c.id); p.solved = (p.solved || 0) + 1;\n    const ce = cardEls[c.id]; ce.classList.add('locked', 'pop'); bodies[c.b].append(ce);\n    msg.className = 'msg warn'; msg.textContent = `Eine Karte wurde richtig einsortiert.`;\n    finishIfAll();\n  }}]);\n  const ladder = helpLadder(id, part, tips);\n  root.append(h('p', {class:'hint-line'}, 'Klicke auf eine Karte und dann auf das || []);\n  const list = h('div', {class:'checklist'});\n  const msg = h('p', {class:'msg', 'aria-live':'polite'});\n  const labels = [];\n  OPTS.forEach((o, i) => {\n    const cid = `${id}-${part}-${i}`;\n    const cb = h('input', {type:'checkbox', id:cid}); cb.checked = sel.has(i); cb.disabled = !!p.done;\n    cb.addEventListener('change', () => { cb.checked ? sel.add(i) : sel.delete(i); labels[i].classList.remove('good', 'bad'); touch(id); });\n    const lab = h('label', {class:'check', for:cid}, cb, h('span', {}, o.t));\n    if (p.done && o.ok) lab.classList.add('good');\n    labels.push(lab); list.append(lab);\n  });\n  const btn = h('button', {class:'btn', type:'button'}, 'Prüfen');\n  btn.addEventListener('click', () => {\n    if (!sel.size){ msg.className = 'msg warn'; msg.textContent = 'Kreuze zuerst etwas an.'; return; }\n    let right = 0, wrong = 0;\n    OPTS.forEach((o, i) => {\n      labels[i].classList.remove('good', 'bad');\n      if (sel.has(i)){ if (o.ok){ right++; labels[i].classList.add('good'); } else { wrong++; labels[i].classList.add('bad'); } }\n    });\n    p.checks++; T(id).attempts++;\n    if (p.firstScore == null) p.firstScore = Math.max(0, right - wrong);\n    p.selected = [...sel];\n    if (right === need && wrong === 0){\n      partDone(id, part, {score:p.firstScore, max:need, answer:[...sel].map(i => OPTS[i].t)});\n      msg.className = 'msg good'; msg.textContent = cfg.doneMsg || 'Alles richtig! 🎉';\n      btn.hidden = true; list.querySelectorAll('input').forEach(x => x.disabled = true);\n    } else {\n      msg.className = 'msg bad';\n      msg.textContent = (wrong ? `${wrong} Kreuz passt nicht (rot). ` : 'Gut! ') + (right \u003c need ? `Es fehlen noch ${need - right} richtige.` : '');\n      if (p.checks >= 2) ladder.nudge();\n      saveState();\n    }\n  });\n  const ladder = helpLadder(id, part, (cfg.tips || []).concat([{solution:true, action(){\n    const miss = OPTS.map((o, i) => i).filter(i => OPTS[i].ok && !sel.has(i));\n    if (!miss.length){ msg.className = 'msg warn'; msg.textContent = 'Entferne die roten Kreuze.'; return; }\n    const i = miss[0]; sel.add(i); $('#' + `${id}-${part}-${i}`).checked = true; labels[i].classList.add('good');\n    msg.className = 'msg warn'; msg.textContent = 'Eine richtige Antwort wurde angekreuzt.';\n  }}]));\n  if (p.done){ btn.hidden = true; msg.className = 'msg good'; msg.textContent = cfg.doneMsg || 'Alles richtig! 🎉'; }\n  return h('div', {style:'display:flex;flex-direction:column;gap:18px'}, list, h('div', {class:'row'}, btn, msg), ladder.el);\n}\n\n/* Freitext */\nfunction textTask(id, part, cfg){\n  const p = P(id, part);\n  const ta = h('textarea', {id:`ta-${id}-${part}`, rows:cfg.rows || 4, placeholder:cfg.placeholder || 'Schreibe hier …', spellcheck:'true'});\n  ta.value = p.text != null ? p.text : (p.draft || '');\n  const cnt = h('span', {class:'count'});\n  const msg = h('span', {class:'msg', 'aria-live':'polite'});\n  const saveBtn = h('button', {class:'btn', type:'button'}, 'Antwort speichern');\n  function upd(){\n    const w = countWords(ta.value);\n    cnt.textContent = `${w} ${w === 1 ? 'Wort' : 'Wörter'} (mindestens ${cfg.min})`;\n    cnt.classList.toggle('ok', w >= cfg.min);\n    saveBtn.disabled = w \u003c cfg.min;\n  }\n  let draftT = null;\n  ta.addEventListener('input', () => {\n    touch(id); upd();\n    clearTimeout(draftT); draftT = setTimeout(() => { p.draft = ta.value; saveState(); }, 700);\n    if (p.done && ta.value.trim() !== p.text){ msg.className = 'msg warn'; msg.textContent = 'Bitte noch einmal speichern.'; }\n  });\n  ta.addEventListener('paste', e => {\n    let len = 0; try { len = (e.clipboardData.getData('text') || '').length; } catch(_){}\n    p.pasteCount = (p.pasteCount || 0) + 1; p.pasteChars = (p.pasteChars || 0) + len; saveSoon();\n  });\n  saveBtn.addEventListener('click', () => {\n    const txt = ta.value.trim();\n    clearTimeout(draftT);\n    partDone(id, part, {text:txt, words:countWords(txt), saves:(p.saves || 0) + 1, savedAt:iso()});\n    delete p.draft;\n    msg.className = 'msg good'; msg.textContent = 'Gespeichert ✓';\n  });\n  function insert(s){\n    const pre = ta.value && !/\\s$/.test(ta.value) ? ' ' : '';\n    const startPos = ta.value.length + pre.length;\n    ta.value += pre + s + ' '; ta.focus();\n    const gap = s.indexOf('…');\n    if (gap >= 0){ ta.selectionStart = startPos + gap; ta.selectionEnd = startPos + gap + 1; }\n    else ta.selectionStart = ta.selectionEnd = ta.value.length;\n    p.startersUsed = (p.startersUsed || 0) + 1; touch(id); upd(); saveSoon();\n  }\n  const tips = [];\n  if (cfg.starters) tips.push({html:'Klicke auf einen Satzanfang:', node:() => h('div', {class:'chips'}, cfg.starters.map(s => h('button', {class:'chip', type:'button', onclick:() => insert(s)}, s)))});\n  (cfg.tips || []).forEach(t => tips.push(typeof t === 'string' ? {html:t} : t));\n  const ladder = tips.length ? helpLadder(id, part, tips) : null;\n  upd();\n  if (p.done && p.text != null){ msg.className = 'msg good'; msg.textContent = 'Gespeichert ✓'; }\n  return h('div', {class:'text-task'},\n    ta, h('div', {class:'row'}, saveBtn, cnt, msg), ladder ? ladder.el : null);\n}\n\n/* Selbsteinschätzung */\nfunction rateTask(id, part, cfg){\n  const p = P(id, part); p.answers = p.answers || {};\n  const grid = h('div', {class:'rate'});\n  const msg = h('p', {class:'msg good', 'aria-live':'polite'});\n  const LV = [['😀', 'Kann ich gut'], ['🙂', 'Geht so'], ['😕', 'Noch unsicher']];\n  cfg.items.forEach(it => {\n    const opts = h('div', {class:'opts'});\n    LV.forEach(l => {\n      const b = h('button', {type:'button', 'aria-pressed':p.answers[it.k] === l[1] ? 'true' : 'false'}, l[0] + ' ' + l[1]);\n      b.addEventListener('click', () => {\n        p.answers[it.k] = l[1]; touch(id);\n        opts.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true');\n        if (cfg.items.every(x => p.answers[x.k])){ partDone(id, part, {answers:Object.assign({}, p.answers)}); msg.textContent = 'Danke! ✓'; } else saveSoon();\n      });\n      opts.append(b);\n    });\n    grid.append(h('div', {class:'rate-row'}, h('span', {style:'font-weight:500'}, it.label), opts));\n  });\n  if (p.done) msg.textContent = 'Danke! ✓';\n  return h('div', {style:'display:flex;flex-direction:column;gap:14px'}, grid, msg);\n}\n\n/* Schritt-für-Schritt-Simulator (ohne Audio) */\nfunction stepsTask(id, part, cfg){\n  const p = P(id, part);\n  const root = h('div', {class:'sim-wrap'});\n  let sim, steps, done, cur, sol, wrong, finished;\n  let metaEl, listEl, msgEl, ladderEl;\n  const firstUndone = () => steps.findIndex((_, k) => !done.has(k));\n  const setMsg = (t, cls) => { msgEl.className = 'msg ' + (cls || ''); msgEl.textContent = t || ''; };\n\n  function build(){\n    sim = cfg.make();\n    steps = cfg.steps(sim);\n    done = new Set(); sol = new Set(); cur = 0; wrong = 0; finished = !!p.done;\n    if (finished) steps.forEach((_, k) => done.add(k));\n    root.innerHTML = '';\n    metaEl = h('div', {class:'meta'});\n    listEl = h('ol', {class:'sl'});\n    msgEl = h('p', {class:'msg', 'aria-live':'polite'});\n    ladderEl = h('div', {});\n    const box = h('div', {class:'steps-box'}, metaEl, listEl, msgEl, ladderEl,\n      h('div', {class:'row'}, h('button', {class:'btn small ghost', type:'button', onclick:() => build()}, '↺ Neu starten')));\n    if (cfg.hint) root.append(h('p', {class:'hint-line'}, cfg.hint));\n    root.append(box, sim.el);\n    sim.setEmit(onEvent);\n    skipAlready();\n    if (finished) setMsg('Schon geschafft! Du darfst gern noch weiter üben.', 'good');\n    drawSteps();\n  }\n  function skipAlready(){\n    while (cur \u003c steps.length && steps[cur].already && steps[cur].already(sim)){ done.add(cur); cur++; }\n  }\n  function drawSteps(){\n    const n = steps.length;\n    metaEl.innerHTML = '';\n    const dots = h('div', {class:'dots', 'aria-hidden':'true'});\n    steps.forEach((_, k) => dots.append(h('i', {class:done.has(k) ? 'd' : (k === cur && !finished ? 'a' : '')})));\n    metaEl.append(h('span', {}, finished || done.size === n ? 'Alle Schritte geschafft ✓' : `Schritt ${cur + 1} von ${n}`), dots);\n    listEl.innerHTML = '';\n    steps.forEach((s, k) => {\n      if (done.has(k)) listEl.append(h('li', {class:'done'}, h('span', {class:'n'}, '✓'), h('span', {class:'t'}, s.short)));\n      else if (k === cur) listEl.append(h('li', {class:'active'}, h('span', {class:'n'}, k + 1), h('span', {class:'t', html:s.text})));\n    });\n    if (!finished && cur \u003c n - 1) listEl.append(h('li', {class:'later'}, `Danach noch ${n - cur - 1} ${n - cur - 1 === 1 ? 'Schritt' : 'Schritte'}.`));\n    ladderEl.innerHTML = '';\n    if (!finished && done.size \u003c n){\n      const k = firstUndone(), s = steps[k];\n      const tips = (s.tips || []).map(t => ({html:t}));\n      if (s.hl) tips.push({html:'', node:() => { sim.hl(s.hl(sim)); return h('span', {}, 'Die richtige Stelle blinkt gelb. 🟡'); }});\n      if (s.solve) tips.push({solution:true, action(){ sol.add(k); s.solve(sim); }});\n      ladderEl.append(helpLadder(id, part + '_s' + k, tips).el);\n    }\n  }\n  function completeStep(k){\n    done.add(k);\n    if (steps[k].after) steps[k].after(sim);\n    cur = k + 1; skipAlready();\n    if (done.size >= steps.length) return finish();\n    drawSteps();\n  }\n  function finish(){\n    finished = true;\n    partDone(id, part, {score:Math.max(0, steps.length - sol.size), max:steps.length, wrong, lösungshilfen:sol.size});\n    setMsg(cfg.doneMsg || 'Geschafft! 🎉', 'good');\n    drawSteps();\n  }\n  function onEvent(ev){\n    if (finished) return;\n    touch(id);\n    const r = steps[cur].test(ev, sim);\n    if (r === true){ setMsg('Richtig! ✓', 'good'); completeStep(cur); }\n    else if (typeof r === 'string'){\n      wrong++; p.wrong = wrong; setMsg(r, 'warn'); T(id).attempts++; saveSoon();\n      if (wrong % 3 === 0) ladders.forEach(l => l.nudge())   if (IN_FRAME){\n    return h('button', {class:'btn small ghost', type:'button', onclick:() => { saveState(); window.parent.postMessage({type:'pc00_close', lessonId:LESSON.id}, '*'); }}, label || '🗺️ Lernlandkarte');\n  }\n  return h('a', {class:'btn small ghost', href:HUB_FILE}, label || '🗺️ Lernlandkarte');\n}\n\nRENDER.ende = (pg, main) => {\n  const s = summary(S), st = calcStars(S);\n  main.append(pageHead(pg, 'Ergebnis abgeben', 'Klicke auf \u003cb>„Ergebnis speichern“\u003c/b> und lade die Datei bei IServ hoch – oder kehre direkt zur Lernlandkarte zurück.'));\n  main.append(h('div', {class:'stamp-card'},\n    h('h3', {style:'font-size:20px'}, st.star1 ? '🏅 Stations-Stempel freigeschaltet!' : '🏅 Dein Stations-Stempel (noch in Arbeit)'),\n    h('div', {class:'star-list'},\n      h('div', {class:'star-item' + (st.star1 ? ' on' : '')}, st.star1 ? '⭐' : '☆', h('span', {}, 'Stern 1: Alle Pflichtaufgaben erledigt')),\n      h('div', {class:'star-item' + (st.star2 ? ' on' : '')}, st.star2 ? '⭐' : '☆', h('span', {}, `Stern 2: Mindestens 80 % Punkte (${st.pctAuto} %)`)),\n      h('div', {class:'star-item' + (st.star3 ? ' on' : '')}, st.star3 ? '⭐' : '☆', h('span', {}, 'Stern 3: Zusatzaufgabe geschafft')))));\n  const box = h('section', {class:'task'});\n  const badgeSlot = h('div', {class:'lottie-slot'});\n  box.append(h('div', {class:'row', style:'gap:18px'}, badgeSlot, h('span', {class:'big-num'}, s.pct + ' %'),\n    h('p', {}, `${s.done} von ${s.total} Pflichtaufgaben erledigt`, h('br'), `${s.zusDone} von ${s.zusTotal} Zusatzaufgaben ⭐ erledigt.`)));\n  const list = h('ul', {class:'result-list'});\n  Object.keys(TASKS).forEach(k => {\n    const t = S.tasks[k]; const ok = t && t.status === 'erledigt';\n    const firstPg = PAGES.find(x => x.task === k) || PAGES[0];\n    list.append(h('li', {class:(ok ? 'done ' : '') + (TASKS[k].type === 'zusatz' ? 'star' : '')},\n      h('span', {class:'mark'}, ok ? '✓' : (TASKS[k].type === 'zusatz' ? '⭐' : '')),\n      h('span', {st   const backMap = IN_FRAME\n    ? h('button', {class:'btn big ghost', type:'button', onclick:() => { saveState(); window.parent.postMessage({type:'pc00_close', lessonId:LESSON.id}, '*'); }}, '🗺️ Zurück zur Lernlandkarte')\n    : h('a', {class:'btn big ghost', href:HUB_FILE}, '🗺️ Zurück zur Lernlandkarte');\n  main.append(h('div', {class:'row'}, saveBtn, backMap), out, pager(pg));\n};\n\nfunction hash(str){ let h1 = 5381; for (let i = 0; i \u003c str.length; i++){ h1 = ((h1 \u003c\u003c 5) + h1 + str.charCodeAt(i)) >>> 0; } return h1.toString(16); }\nfunction niveau(def, t){\n  if (!t || t.status === 'offen') return {stufe:0, text:'nicht bearbeitet'};\n  let score = 0, max = 0;\n  Object.values(t.parts || {}).forEach(p => { if (p.max){ score += p.score || 0; max += p.max; } });\n  const hasText = Object.values(t.parts || {}).some(p => p.text != null);\n  if (t.status !== 'erledigt') return {stufe:1, text:'begonnen, nicht fertig'};\n  if (!max) return {stufe:null, text:hasText ? 'Freitext – Niveau wird nachträglich bewertet' : 'erledigt (ohne Punktbewertung)'};\n  const r = score / max;\n  if ((t.solutionCount || 0) > 0 && r \u003c .5) return {stufe:1, text:'mit Lösungshilfe gelöst'};\n  if (r >= .8 && !t.hints && !t.solutionCount) return {stufe:3, text:'selbstständig und sicher gelöst'};\n  if (r >= .5) return {stufe:2, text:'teilweise selbstständig / mit Hilfe gelöst'};\n  return {stufe:1, text:'nur mit vielen Versuchen oder Hilfe gelöst'};\n}\nfunction buildExport(st){\n  const tasks = Object.keys(TASKS).map(k => {\n    const def = TASKS[k], t = st.tasks[k] || {status:'offen', parts:{}};\n    let score = 0, max = 0;\n    Object.values(t.parts || {}).forEach(p => { if (p.max){ score += p.score || 0; max += p.max; } });\n    const parts = {};\n    Object.entries(t.parts || {}).forEach(([pk, p]) => {\n      const c = Object.assign({}, p);\n      if (c.draft != null){ if (c.draft.trim() !== c.text) c.entwurf_nicht_gespeichert = c.draft; delete c.draft; }\n      parts[pk] = c;\n    });\n    return {id:k, titel:def.title, art:def.type, station:def.station, aufgabenstellung:def.prompt, status:t.status,\n      punkte:max ? score : null, punkte_max:max || null, versuche:t.attempts || 0, tipps_geoeffnet:t.hints || 0,\n      loesungshilfe_genutzt:t.solutionCount || 0, begonnen:t.firstAt || null, erledigt:t.doneAt || null,\n      niveau_automatisch:niveau(def, t), teile:parts};\n  });\n  const s = summary(st);\n  let aP = 0, aM = 0;\n  tasks.filter(t => t.art === 'pflicht').forEach(t => { if (TASKS[t.id].max){ aM += TASKS[t.id].max; aP += t.punkte || 0; } });\n  const stationMin = {};\n  Object.entries(st.stationSec || {}).forEach(([k, v]) => stationMin[k] = +(v / 60).toFixed(1));\n  const payload = {\n    format:'ki-lernpfad-ergebnis', version:2,\n    lerneinheit_id:LESSON.id, lerneinheit:LESSON.titel,\n    schueler:st.student, gestartet:st.startedAt, gespeichert:iso(), fruehere_speicherungen:st.exports || [],\n    zusammenfassung:{\n      pflicht_erledigt:s.done, pflicht_gesamt:s.total, pflicht_prozent:s.pct,\n      zusatz_erledigt:s.zusDone, zusatz_gesamt:s.zusTotal,\n      punkte_automatisch:aP, punkte_automatisch_max:aM, punkte_prozent:aM ? Math.min(100, Math.round(aP / aM * 100)) : 0,\n      sterne_gesamt:calcStars(st).count,\n      tipps_gesamt:tasks.reduce((a, t) => a + t.tipps_geoeffnet, 0),\n      loesungshilfen_gesamt:tasks.reduce((a, t) => a + t.loesungshilfe_genutzt, 0)\n    },\n    aktivitaet:{\n      aktive_minuten:+((st.activeSec || 0) / 60).toFixed(1),\n      minuten_seit_start:+((Date.now() - new Date(st.startedAt).getTime()) / 60000).toFixed(1),\n      leerlauf_phasen_ueber_2_min:st.idle || [],\n      leerlauf_minuten_gesamt:+(st.idle || []).reduce((a, b) => a + b.minutes, 0).toFixed(1),\n      seite_verlassen_anzahl:st.tabLeaves || 0,\n      minuten_ausserhalb_der_seite:+((st.awaySec || 0) / 60).toFixed(1),\n      minuten_pro_station:stationMin\n    },\n    aufgaben:tasks\n  };\n  payload.pruefsumme = hash(JSON.stringify(payload));\n  return payload;\n}\nfunction fileName(st){\n  const clean = s => String(s || '').replace(/[^A-Za-z0-9ÄÖÜäöüß-]/g, '');\n  return `${LESSON.prefix}_${clean(st.student.klasse)}_${clean(st.student.vorname)}${clean(st.student.initial)}_${new Date().toISOString().slice(0, 10)}.json`;\n}\nfunction downloadResult(st){\n  const data = buildExport(st);\n  const name = fileName(st);\n  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});\n  const a = h('a', {href:URL.createObjectURL(blob), download:name});\n  document.body.append(a); a.click();\n  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);\n  if (st === S){ S.exports.push(iso()); saveState(); }\n  return name;\n}\n\n/* Navigation & Gerüst */\nfunction pageState(pg){\n  if (pg.info) return S.infoSeen && S.infoSeen[pg.id] ? 'done' : 'open';\n  if (!pg.task) return 'open';\n  const t = S.tasks[pg.task];\n  if (!t) return 'open';\n  if (pg.part){\n    const p = t.parts && t.parts[pg.part];\n    if (p && p.done) return 'done';\n    if (t.status !== 'offen') return 'started';\n    return 'open';\n  }\n  return t.status === 'erledigt' ? 'done' : t.status === 'begonnen' ? 'started' : 'open';\n}\nfunction refreshNav(){\n  if (!S || !S.student) return;\n  document.querySelectorAll('.nav-item[data-id]').forEach(b => {\n    const pg = PAGES.find(x => x.id === b.dataset.id);\n    if (pg) b.dataset.state = pageState(pg);\n  });\n  document.querySelectorAll('[data-badge]').forEach(b => {\n    const id = b.dataset.badge, part = b.dataset.part;\n    const t = S.tasks[id];\n    let st = 'offen';\n    if (t){\n      if (part && t.parts && t.parts[part] && t.parts[part].done) st = 'erledigt';\n      else if (t.status === 'erledigt') st = 'erledigt';\n      else if (t.status === 'begonnen') st = 'begonnen';\n    }\n    b.dataset.s = st; b.textContent = st === 'erledigt' ? '✓ erledigt' : st === 'begonnen' ? 'begonnen' : 'offen';\n  });\n  const s = summary(S), st = calcStars(S);\n  const bar = $('#bar'); if (bar){ bar.style.width = s.pct + '%'; if (bar.parentElement) bar.parentElement.setAttribute('aria-valuenow', String(s.pct)); }\n  const lbl = $('#bar-lbl'); if (lbl) lbl.textContent = `${s.done} von ${s.total} Pflichtaufgaben`;\n  const zl = $('#bar-zus'); if (zl) zl.textContent = s.zusDone ? `⭐ ${s.zusDone} Zusatz` : '';\n  const sp = $('#stars-pill'); if (sp) sp.textContent = `${'⭐'.repeat(st.count)}${'☆'.repeat(3 - st.count)} (${st.count}/3)`;\n}\nfunction go(id){\n  ladders = [];\n  const pg = PAGES.find(x => x.id === id) || PAGES[0];\n  S.current = pg.id; lastProgress = Date.now(); nudged = false;\n  if (pg.info){ S.infoSeen = S.infoSeen || {}; S.infoSeen[pg.id] = true; }\n  saveState();\n  const main = $('#main'); main.innerHTML = '';\n  RENDER[pg.id](pg, main);\n  document.querySelectorAll('.nav-item').forEach(b => {\n    const on = b.dataset.id === pg.id;\n    b.classList.toggle('active', on);\n    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');\n  });\n  animIn(main.querySelectorAll('.st-head, .glossary, .info-grid > div, .task, .stamp-card, .hvh-fb, .merke, .pager'));\n  refreshNav();\n  window.scrollTo({top:0, behavior:reduced() ? 'auto' : 'smooth'});\n}\nfunction shell(){\n  const app = $('#app'); app.innerHTML = '';\n  const nav = h('nav', {class:'nav', 'aria-label':'Seiten'});\n  let lastGroup = '';\n  PAGES.forEach(pg => {\n    if (pg.group && pg.group !== lastGroup){\n      nav.append(h('div', {class:'nav-sep'}, pg.group));\n      lastGroup = pg.group;\n    }\n    nav.append(h('button', {class:'nav-item' + (pg.zusatz ? ' zusatz' : ''), type:'button', 'data-id':pg.id, onclick:() => go(pg.id)},\n      h('span', {class:'nav-num'}, pg.n), h('span', {class:'nav-label'}, pg.short)));\n  });\n  app.append(\n    h('header', {class:'top'},\n      hubBtn('🗺️ Karte'),\n      h('div', {class:'brand'}, h('b', {}, LESSON.id), h('span', {}, LESSON.shortTitle)),\n      h('div', {class:'progress'}, h('div', {class:'progress-label'}, h('span', {id:'bar-lbl'}), h('span', {id:'bar-zus'})), h('div', {class:'bar', role:'progressbar', 'aria-label':'Pflichtaufgaben-Fortschritt', 'aria-valuemin':'0', 'aria-valuemax':'100', 'aria-valuenow':'0'}, h('i', {id:'bar'}))),\n      h('span', {class:'stars-pill', id:'stars-pill', title:'Sterne in dieser Station'}),\n      h('span', {class:'who'}, h('strong', {}, `${S.student.vorname} ${S.student.initial}.`), ` · ${S.student.klasse}`),\n      h('button', {class:'btn small', type:'button', onclick:() => go('ende')}, 'Abgeben')),\n    h('div', {class:'shell'}, nav, h('main', {id:'main', tabindex:'-1'})));\n  go(QP.get('page') || S.current || PAGES[0].id);\n  if (!IN_FRAME || hasTaskProg(S)) notifyHub();\n  else { try { window.parent.postMessage({type:'pc00_ready', lessonId:LESSON.id}, '*'); } catch(e){} }\n}\n\nfunction sameStudent(a, b){\n  return a && b && String(a.klasse).toLowerCase() === String(b.klasse).toLowerCase()\n    && String(a.vorname).toLowerCase() === String(b.vorname).toLowerCase()\n    && String(a.initial).toUpperCase() === String(b.initial).toUpperCase();\n}\n\nwindow.addEventListener('message', ev => {\n  const d = ev.data;\n  if (!d || d.lessonId !== LESSON.id) return;\n  if (d.type === 'pc00_hydrate' && d.rawState && d.rawState.student){\n    const inc = normState(d.rawState);\n    const incT = inc.lastSavedAt ? new Date(inc.lastSavedAt).getTime() : 0;\n    const curT = S && S.lastSavedAt ? new Date(S.lastSavedAt).getTime() : 0;\n    const upgradeEmpty = S && sameStudent(S.student, inc.student) && !hasTaskProg(S) && hasTaskProg(inc);\n    if (!S || !sameStudent(S.student, inc.student) || upgradeEmpty || incT > curT){\n      if (S && S.student && !sameStudent(S.student, inc.student)) archive(S);\n      S = inc;\n      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}\n      shell();\n    }\n  } else if (d.type === 'pc00_goto' && d.page && S){\n    go(d.page);\n  }\n});\n\n/* Startbildschirm  {class:'fields'},\n      h('label', {class:'field', for:'klasse'}, 'Klasse', fK),\n      h('label', {class:'field', for:'vorname'}, 'Vorname', fV),\n      h('label', {class:'field', for:'initial'}, '1. Buchstabe Nachname', fI)),\n    err, h('div', {class:'row'}, h('button', {class:'btn big', type:'submit'}, 'Los geht’s →')));\n  form.addEventListener('submit', e => {\n    e.preventDefault();\n    const k = fK.value.trim(), v = fV.value.trim(), i = fI.value.trim().replace('.', '').toUpperCase();\n    if (!k || !v || !i){ err.textContent = 'Bitte fülle alle drei Felder aus.'; return; }\n    if (prev && prev.student) archive(prev);\n    S = freshState({klasse:k, vorname:v, initial:i});\n    saveState(); shell();\n  });\n  box.append(form, h('div', {class:'row'}, h('a', {class:'btn small ghost', href:HUB_FILE}, '🗺️ Lieber über die Lernlandkarte starten')));\n  const arch = loadArchive();\n  const det = h('details', {class:'teacher'}, h('summary', {}, 'Für Lehrkräfte'));\n  const al = h('div', {class:'arch'});\n  const all = (prev && prev.student ? [prev] : []).concat(arch);\n  if (!all.length) al.append(h('span', {}, 'Noch keine Ergebnisse auf diesem Gerät gespeichert.'));\n  all.forEach(st => {\n    const s = summary(st);\n    al.append(h('div', {class:'row'}, h('span', {}, `${st.student.klasse} · ${st.student.vorname} ${st.student.initial}. · ${new Date(st.startedAt).toLocaleString('de-DE')} · ${s.pct} %`),\n      h('button', {class:'btn small ghost', type:'button', onclick:() => downloadResult(st)}, 'Herunterladen')));\n  });\n  det.append(h('p', {}, 'Gespeicherte Stände auf diesem Gerät:'), al);\n  box.append(det);\n  app.append(box);\n  animIn([box], {y:14, duration:0.35, stagger:0});\n}\n\nstartScreen();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","0.2":"\u003c!doctype html>\n\u003chtml lang=\"de\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Lernpfad 0.2 – Maus und Tastatur für Profis\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Fredoka:wght@500;600&display=swap\">\n\u003cstyle>\n/* Layout: Ruhiger, offener Lernpfad – maximal 1 Übung pro Seite, ohne Audio, Hub-kompatibel */\n:root{\n  --bg:#edf3f6; --surface:#ffffff; --surface-2:#f5f9fb; --ink:#15303f; --muted:#4c6675; --line:#c8d7e1;\n  --accent:#1a74ae; --accent-dark:#145b8a; --accent-ink:#ffffff; --accent-soft:#dcecf7;\n  --merke:#fdf1bf; --merke-line:#d8ae28;\n  --good:#1f7d4a; --good-soft:#d9f0e2; --bad:#bf3e2d; --bad-soft:#fae1dc; --warn:#9a6a00; --warn-soft:#fdf1d2;\n  --star:#d45d12; --star-soft:#fdebd9; --star-line:#f3b88c;\n  --f-display:\"Fredoka\",\"Lexend\",system-ui,\"Segoe UI\",sans-serif;\n  --f-body:\"Lexend\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --r:18px; --r-lg:22px; --r-md:14px; --r-sm:10px;\n  --m-in:150ms; --m-out:120ms; --m-press:90ms;\n  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);\n  color-scheme:light;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.75;letter-spacing:.01em}\nbutton,input,textarea,select{font:inherit;color:inherit;touch-action:manipulation}\nbutton{cursor:pointer}\na{color:inherit;text-decoration:none}\n:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}\np{margin:0}\n\n/* Skip Link */\n.skip-link{position:fixed;top:-60px;left:16px;z-index:200;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-sm);font-weight:600;font-size:15px;box-shadow 4px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:16px;line-height:1.55}\n\n.merke-box{display:flex;flex-direction:column;gap:4px}\n.merke-box strong{font-family:var(--f-display);font-size:18px}\n\n.hvh-fb{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--blue, var(--accent));border-radius:var(--r-lg, 18px);padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 16px rgba(21,48,63,.05)}\n.hvh-fb-head h3{font-size:21px;color:var(--blue, var(--accent))}\n.hvh-fb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}\n.hvh-part{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}\n.hvh-part.strength{background:var(--good-soft);border:1.5px solid #b5dec6}\n.hvh-part.step{background:var(--accent-soft, var(--blue-soft));border:1.5px solid #b8d7ec}\n.hvh-part.mini{background:var(--warn-soft);border:1.5px solid #ecd496}\n.hvh-part b{font-family:var(--f-display);font-size:16px}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip-link\" href=\"#main\">Zum Inhalt springen\u003c/a>\n\u003cdiv id=\"app\">\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_svg.min.js\">\u003c/script>\n\u003cscript>\n(function(){\n'use strict';\n\nconst $ = (s, r = document) => r.querySelector(s);\nfunction h(tag, attrs, ...kids){\n  const e = document.createElement(tag);\n  for (const [k, v] of Object.entries(attrs || {})){\n    if (k === 'class') e.className = v;\n    else if (k === 'html') e.innerHTML = v;\n    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);\n    else if (v === true) e.setAttribute(k, '');\n    else if (v !== false && v != null) e.setAttribute(k, v);\n  }\n  for (const c of kids.flat()){\n    if (c == null || c === false) continue;\n    e.append(c.nodeType ? c : document.createTextNode(String(c)));\n  }\n  return e;\n}\nconst iso = (t = Date.now()) => new Date(t).toISOString();\nconst countWords = s => (String(s || '').match(/[A-Za-zÄÖÜäöüß0-9]+/g) || []).length;\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst escH = s => String(s).replace(/[&\u003c>\"]/g, c => ({'&':'&amp;', '\u003c':'&lt;', '>':'&gt;', '\"':'&quot;'}[c]));\n\nconst HUB_KEY = 'pc00_hub_student_v2';\nconst HUB_FILE = 'Kapitel_0_Lernlandkarte_Hub.html';\nconst QP = new URLSearchParams(window.__PC00_QS__ || location.search);\nconst IN_FRAME = window.parent !== window;\n\nconst LESSON = {\n  id:'0.2',\n  shortTitle:'Maus und Tastatur für Profis',\n  titel:'0.2 Maus und Tastatur für Profis (Informatik, Realschule Klasse 5)',\n  prefix:'PC02',\n  startText:'Hier übst du die 5 wichtigsten Sondertasten, das 10-Finger-Tippen, das Zeichnen und alle Maus-Tricks.'\n};\n\nconst TASKS = {\n  m1:{station:'verteilung', type:'pflicht', parts:['sort'], max:9, title:'Aufgabe 1: Maus oder Tastatur?',\n      prompt:'Ordne die 9 Situationen der Maus oder der Tastatur zu.'},\n  t1:{station:'tasten',     type:'pflicht', parts:['steps','gap'], max:10, title:'Aufgabe 2: Die 5 Profi-Tasten',\n      prompt:'Teste die 5 Sondertasten am Modell und sichere ihre Namen.'},\n  f1:{station:'tippen',     type:'pflicht', parts:['steps'], max:6, title:'Aufgabe 3: 10-Finger-Trainer',\n      prompt:'Tippe die 6 Zeichenfolgen aus dem Buch fehlerfrei ab.'},\n  z1:{station:'zeichnen',   type:'pflicht', parts:['steps','gap'], max:10, title:'Aufgabe 4 & 5: Zeichnen & Maus',\n      prompt:'Zeichne 5 Figuren mit Formen und ordne die Maus-Aktionen zu.'},\n  w1:{station:'check',      type:'pflicht', parts:['sort','self','text'], max:8, title:'Wissenscheck 0.2',\n      prompt:'Ordne Maus und Tastatur zu, schätze dich ein und erkläre das Formen-Werkzeug.'},\n  e1:{station:'zusatz',     type:'zusatz',  parts:['quiz','text'], max:0, title:'Zusatz ⭐ Profi-Tasten & Blind-Tippen',\n      prompt:'Löse das Alt-Gr-Rätsel und teste das Blind-Tippen.'}\n};\n\nconst PAGES = [\n  {id:'m1_sort',  n:1,    short:'Maus oder Tastatur?', group:'1. Überblick',        task:'m1', part:'sort'},\n  {id:'t1_info',  n:'i',  short:'Die 5 Profi-Tasten',  group:'2. Tastatur',         info:true},\n  {id:'t1_steps', n:2,    short:'Tasten testen',       group:'2. Tastatur',         task:'t1', part:'steps'},\n  {id:'t1_gap',   n:3,    short:'Tasten-Namen',        group:'2. Tastatur',         task:'t1', part:'gap'},\n  {id:'f1_steps', n:4,    short:'10-Finger-Trainer',   group:'3. Tippen',           task:'f1', part:'steps'},\n  {id:'z1_steps', n:5,    short:'Figuren zeichnen',    group:'4. Zeichnen & Maus',  task:'z1', part:'steps'},\n  {id:'z1_gap',   n:6,    short:'Maus-Handgriffe',     group:'4. Zeichnen & Maus',  task:'z1', part:'gap'},\n  {id:'w1_sort',  n:7,    short:'Check: Sortieren',    group:'5. Wissenscheck',     task:'w1', part:'sort'},\n  {id:'w1_self',  n:8,    short:'Check: Wie sicher?',  group:'5. Wissenscheck',     task:'w1', part:'self'},\n  {id:'w1_text',  n:9,    short:'Check: Stift/Form',   group:'5. Wissenscheck',     task:'w1', part:'text'},\n  {id:'e1_quiz',  n:'⭐', short:'Alt-Gr-Rätsel',       group:'Für Schnelle',        task:'e1', part:'quiz', zusatz:true},\n  {id:'e1_text',  n:'⭐', short:'Blind-Tippen',        group:'Für Schnelle',        task:'e1', part:'text', zusatz:true},\n  {id:'ende',     n:'✓',  short:'Abgeben',             group:'Zum Schluss'}\n];\n\nfunction makeKeySim02(){\n  const k = {emit:() => {}, hlKeys:[]};\n  const NAMES = {\n    esc:'die Escape-Taste (lila)',\n    caps:'die Feststelltaste (blau)',\n    shift:'die Umschalttaste (grün)',\n    back:'die Rücktaste (gelb)',\n    enter:'die Eingabetaste (rot)',\n    other:'eine normale Buchstabentaste'\n  };\n  k.names = NAMES;\n  const wrap = h('div', {class:'kb-wrap'});\n  const screen = h('div', {style:'background:#15303f;color:#e0f2fe;border-radius:10px;padding:12px 16px;font-family:ui-monospace,Consolas,monospace;font-size:16px;min-height:50px;display:flex;align-items:center'},\n    h('span', {id:'kb-out'}, 'Klicke auf die gesuchte farbige Taste!'));\n\n  function keyBtn(id, label, cls){\n    const b = h('button', {type:'button', class:'kb-key ' + (cls || ''), 'data-part':id}, label);\n    b.addEventListener('click', () => {\n      k.hlKeys = []; applyHl();\n      const out = wrap.querySelector('#kb-out');\n      if (out) out.textContent = 'Gedrückt: ' + (NAMES[id] || label);\n      k.emit({type:'key', part:id}, k);\n    });\n    return b;\n  }\n  wrap.append(\n    screen,\n    h('div', {class:'kb-row'},\n      keyBtn('esc', 'esc', 'c-purple'),\n      keyBtn('other', '1'), keyBtn('other', '2'), keyBtn('other', '3'), keyBtn('other', '4'), keyBtn('other', '5'),\n      keyBtn('back', '⟵ Rücktaste', 'wide c-yellow')\n    ),\n    h('div', {class:'kb-row'},\n      keyBtn('other', 'Q'), keyBtn('other', 'W'), keyBtn('other', 'E'), keyBtn('other', 'R'), keyBtn('other', 'T'), keyBtn('other', 'Z'),\n      keyBtn('enter', '↵ Enter', 'wide c-red')\n    ),\n    h('div', {class:'kb-row'},\n      keyBtn('caps', '⇩ Feststell', 'wide c-blue'),\n      keyBtn('other', 'A'), keyBtn('other', 'S'), keyBtn('other', 'D'), keyBtn('other', 'F'), keyBtn('other', 'G'), keyBtn('other', 'H')\n    ),\n    h('div', {class:'kb-row'},\n      keyBtn('shift', '⇧ Umschalt', 'wide c-green'),\n      keyBtn('other', 'Y'), keyBtn('other', 'X'), keyBtn('other', 'C'), keyBtn('other', 'V'), keyBtn('other', 'B'),\n      keyBtn('shift', '⇧ Shift', 'wide c-green')\n    )\n  );\n  function applyHl(){\n    wrap.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));\n    wrap.querySelectorAll('[data-part]').forEach(x => { if (k.hlKeys.includes(x.dataset.part)) x.classList.add('hl'); });\n  }\n  k.hl = keys => { k.hlKeys = [].concat(keys || []); applyHl(); };\n  k.setEmit = fn => { k.emit = fn; };\n  k.el = wrap;\n  return k;\n}\n\nfunction makeTypingSim02(){\n  const t = {emit:() => {}, hlKeys:[], idx:0};\n  const LINES = [\n    {nr:1, code:'falködajsöa',        hint:'Stufe 1: Grundreihe (klein)'},\n    {nr:2, code:'dfriolwpqöüzat',     hint:'Stufe 2: Grundreihe & obere Reihe'},\n    {nr:3, code:'mazybcöntc,px.',     hint:'Stufe 3: Untere Reihe mit , und .'},\n    {nr:4, code:'1b740lB36a8k9,',     hint:'Stufe 4: Zahlen und Großbuchstaben'},\n    {nr:5, code:'QoRmö p?G§jK)',      hint:'Stufe 5: Mit ⇧ für ? § )'},\n    {nr:6, code:'2Z }g @ 8€Ü:/{OR]-', hint:'Stufe 6: Profi-Zeichen mit Alt Gr'}\n  ];\n  t.lines = LINES;\n  const wrap = h('div', {class:'type-box'});\n  const head = h('div', {style:'font-weight:600;color:var(--accent);font-size:16px'});\n  const target = h('div', {class:'type-target'});\n  const inp = h('input', {class:'type-inp', type:'text', placeholder:'Hier abtippen …', autocomplete:'off', spellcheck:'false', 'data-hl':'inp'});\n  const bar = h('div', {class:'row', style:'gap:8px'});\n  ['@', '€', '{', '}', '[', ']', '§'].forEach(ch => {\n    bar.append(h('button', {type:'button', class:'btn small ghost', onclick:() => { inp.value += ch; inp.focus(); checkVal(); }}, ch));\n  });\n\n  function renderLine(){\n    const curL = LINES[Math.min(t.idx, LINES.length - 1)];\n    head.textContent = `Folge ${curL.nr} von 6 · ${curL.hint}`;\n    target.innerHTML = '';\n    const v = inp.value;\n    for (let i = 0; i \u003c curL.code.length; i++){\n      const sp = h('span', {}, curL.code[i]);\n      if (i \u003c v.length) sp.className = v[i] === curL.code[i] ? 'ok' : 'err';\n      else if (i === v.length) sp.className = 'cur';\n      target.append(sp);\n    }\n  }\n  function checkVal(){\n    renderLine();\n    const curL = LINES[Math.min(t.idx, LINES.length - 1)];\n    if (inp.value === curL.code){\n      const doneIdx = t.idx;\n      t.idx = Math.min(t.idx + 1, LINES.length);\n      inp.value = '';\n      renderLine();\n      t.emit({type:'typed', nr:doneIdx + 1}, t);\n    } else if (inp.value.length >= curL.code.length){\n      t.emit({type:'typo', nr:t.idx + 1}, t);\n    }\n  }\n  inp.addEventListener('input', checkVal);\n  t.solveCurrent = nr => { t.idx = nr - 1; inp.value = LINES[nr - 1].code; checkVal(); };\n  t.hl = () => { inp.classList.add('hl'); inp.focus(); };\n  t.setEmit = fn => { t.emit = fn; };\n  wrap.append(head, target, inp, h('p', {class:'hint-line'}, 'Hilfs-Tasten für Sonderzeichen:'), bar);\n  renderLine();\n  t.el = wrap;\n  return t;\n}\n\nfunction makePaintSim02(){\n  const p = {emit:() => {}, hlKeys:[], mode:'pen', doneShapes:new Set()};\n  const SHAPES = [\n    {id:'circle', label:'① Kreis', svg:'\u003csvg width=\"56\" height=\"56\" viewBox=\"0 0 60 60\">\u003ccircle cx=\"30\" cy=\"30\" r=\"24\" fill=\"none\" stroke=\"#15303f\" stroke-width=\"3\"/>\u003c/svg>'},\n    {id:'smiley', label:'② Smiley', svg:'\u003csvg width=\"56\" height=\"56\" viewBox=\"0 0 60 60\">\u003ccircle cx=\"30\" cy=\"30\" r=\"24\" fill=\"none\" stroke=\"#15303f\" stroke-width=\"3\"/>\u003ccircle cx=\"22\" cy=\"24\" r=\"3.5\" fill=\"#15303f\"/>\u003ccircle cx=\"38\" cy=\"24\" r=\"3.5\" fill=\"#15303f\"/>\u003cpath d=\"M20 35 Q30 45 40 35\" fill=\"none\" stroke=\"#15303f\" stroke-width=\"3\"/>\u003c/svg>'},\n    {id:'star',   label:'③ Stern',  svg:'\u003csvg width=\"56\" height=\"56\" viewBox=\"0 0 60 60\">\u003cpolygon points=\"30,6 37,22 54,22 40,33 45,50 30,40 15,50 20,33 6,22 23,22\" fill=\"none\" stroke=\"#15303f\" stroke-width=\"3\"/>\u003c/svg>'},\n    {id:'stop',   label:'④ Verbot', svg:'\u003csvg width=\"56\" height=\"56\" viewBox=\"0 0 60 60\">\u003ccircle cx=\"30\" cy=\"30\" r=\"24\" fill=\"none\" stroke=\"#15303f\" stroke-width=\"3\"/>\u003ccircle cx=\"30\" cy     if (!finishIfAll()){\n      msg.className = 'msg bad';\n      msg.textContent = `${right} richtig, ${wrong} noch falsch. Probier es nochmal!`;\n      if (p.checks >= 2) ladder.nudge();\n      saveState();\n    }\n  }\n  const checkBtn = h('button', {class:'btn', type:'button', onclick:check}, 'Prüfen');\n  const tips = (cfg.tips || []).concat([{solution:true, action(){\n    const open = cfg.cards.filter(c => !p.locked.includes(c.id));\n    if (!open.length) return;\n    const c = open[Math.floor(Math.random() * open.length)];\n    p.locked.push(c.id); p.solved = (p.solved || 0) + 1;\n    const ce = cardEls[c.id]; ce.classList.add('locked', 'pop'); bodies[c.b].append(ce);\n    msg.className = 'msg warn'; msg.textContent = `Eine Karte wurde richtig einsortiert.`;\n    finishIfAll();\n  }}]);\n  const ladder = helpLadder(id, part, tips);\n  root.append(h('p', {class:'hint-line'}, 'Klicke auf eine Karte und dann auf das passende Feld (oder ziehe sie mit der Maus).'),\n    pool, bucketsEl, h('div', {class:'row'}, checkBtn, msg), ladder.el);\n  if (p.done){ checkBtn.hidden = true; msg.className = 'msg good'; msg.textContent = 'Alles richtig! 🎉'; }\n  return root;\n}\n\n/* Lückentext */\nfunction gapTask(id, part, cfg){\n  const p = P(id, part); p.locked = p.locked || {}; p.checks = p.checks || 0;\n  const doneMsg = cfg.doneMsg || 'Alles richtig! 🎉';\n  const answers = cfg.segments.filter(s => typeof s === 'object').map(s => s.gap);\n  const cur = {}; let sel = null;\n  const textEl = h('div', {class:'gaptext'});\n  const bank = h('div', {class:'bank'});\n  const msg = h('p', {class:'msg', 'aria-live':'polite'});\n  const gapEls = [], wordEls = {};\n  let gi = 0;\n  cfg.segments.forEach(s => {\n    if (s === '\\n'){ textEl.append(h('br')); return; }\n    if (typeof s === 'string'){ textEl.append(s); return; }\n    const idx = gi++;\n    const g = h('button', {class:'gap', type:'button'});\n    g.addEventListener('click', () => {\n      if (p.locked[idx]) return;\n      if (cur[idx]){ wordEls[cur[idx]].disabled = false; delete cur[idx]; sel = idx; }\n      else sel = (sel === idx ? null : idx);\n      render(); touch(id);\n    });\n    gapEls.push(g); textEl.append(g);\n  });\n  shuffle(cfg.bank).forEach(w => {\n    const b = h('button', {class:'word', type:'button'}, w);\n    b.addEventListener('click', () => {\n      let target = sel;\n      if (target == null || p.locked[target] || cur[target]) target = gapEls.findIndex((_, i) => !p.locked[i] && !cur[i]);\n      if (target \u003c 0) return;\n      cur[target] = w; b.disabled = true; sel = null; render(); touch(id); msg.textContent = '';\n    });\n    wordEls[w] = b; bank.append(b);\n  });\n  Object.values(p.locked).forEach(w => { if (wordEls[w]) wordEls[w].disabled = true; });\n  function render(){\n    gapEls.forEach((g, i) => {\n      const w = p.locked[i] || cur[i];\n      g.textContent = w || '…………';\n      g.classList.toggle('locked', !!p.locked[i]);\n      g.classList.toggle('sel', sel === i);\n    });\n  }\n  function finishIfAll(){\n    if (answers.every((_, i) => p.locked[i])){\n      partDone(id, part, {score:p.firstScore == null ? 0 : p.firstScore, max:answers.length});\n      msg.className = 'msg good'; msg.textContent = doneMsg;\n      checkBtn.hidden = true; return true;\n    }\n    return false;\n  }\n  function check(){\n    const open = answers.map((_, i) => i).filter(i => !p.locked[i]);\n    const empty = open.filter(i => !cur[i]);\n    if (empty.length){ msg.className = 'msg warn'; msg.textContent = `Es fehlen noch ${empty.length} Lücken.`; return; }\n    let right = 0, wrong = 0;\n    open.forEach(i => {\n      if (cur[i] === answers[i]){ right++; p.locked[i] = cur[i]; delete cur[i]; }\n      else { wrong++; wordEls[cur[i]].disabled = false; delete cur[i]; gapEls[i].classList.add('shake'); setTimeout(() => gapEls[i].classList.remove('shake'), 500); }\n    });\n    p.checks++; p.wrongTotal = (p.wrongTotal || 0) + wrong; T(id).attempts++;\n    if (p.firstScore == null) p.firstScore = right;\n    render();\n    if (!finishIfAll()){\n      msg.className = 'msg bad'; msg.textContent = `${right} richtig, ${wrong} falsch. Versuch es nochmal!`;\n      if (p.checks >= 2) ladder.nudge();\n      saveState();\n    }\n  }\n  const checkBtn = h('button', {class:'btn', type:'button', onclick:check}, 'Prüfen');\n  const ladder = helpLadder(id, part, (cfg.tips || []).concat([{solution:true, action(){\n    const open = answers.map((_, i) => i).filter(i => !p.locked[i]);\n    if (!open.length) return;\n    const i = open[Math.floor(Math.random() * open.length)];\n    if (cur[i]){ wordEls[cur[i]].disabled = false; delete cur[i]; }\n    for (const k of Object.keys(cur)) if (cur[k] === answers[i]) delete cur[k];\n    p.locked[i] = answers[i]; wordEls[answers[i]].disabled = true; p.solved = (p.solved || 0) + 1;\n    render(); finishIfAll();\n  }}]));\n  render();\n  if (p.done){ checkBtn.hidden = true; msg.className = 'msg good'; msg.textContent = doneMsg; }\n  return h('div', {style:'display:flex;flex-direction:column;gap:18px'},\n    h('p', {class:'hint-line'}, 'Klicke auf ein Wort unten. Es springt in die nächste freie Lücke.'),\n    textEl, bank, h('div', {class:'row'}, checkBtn, msg), ladder.el);\n}\n\n/* Auswahlfrage */\nfunction mcTask(id, part, cfg){\n  const p = P(id, part); p.wrong = p.wrong || [];\n  const fb = h('p', {class:'msg', 'aria-live':'polite'});\n  const box = h('div', {class:'mc'});\n  if (cfg.q) box.append(h('p', {style:'font-weight:600;font-size:18px'}, cfg.q));\n  const keys = 'ABCDEF';\n  cfg.options.forEach((o, i) => {\n    const b = h('button', {class:'opt', type:'button'}, h('span', {class:'k'}, keys[i]), h('span', {}, o));\n    if (p.done){ b.disabled = true; if (i === cfg.correct) b.classList.add('good'); }\n    else if (p.wrong.includes(i)){ b.disabled = true; b.classList.add('bad'); }\n    b.addEventListener('click', () => {\n      if (p.done) return;\n      touch(id); T(id).attempts++;\n      if (p.firstChoice == null) p.firstChoice = o;\n      if (i === cfg.correct){\n        b.classList.add('good');\n        box.querySelectorAll('.opt').forEach(x => x.disabled = true);\n        fb.className = 'msg good'; fb.textContent = cfg.good || 'Richtig! 🎉';\n        partDone(id, part, {score:p.wrong.length === 0 ? 1 : 0, max:1, answer:o});\n      } else {\n        p.wrong.push(i); b.classList.add('bad'); b.disabled = true;\n        fb.className = 'msg bad'; fb.textContent = (cfg.bad && cfg.bad[i]) || 'Nicht ganz. Lies noch einmal genau.';\n        saveState();\n      }\n    });\n    box.append(b);\n  });\n  if (p.done){ fb.className = 'msg good'; fb.textContent = cfg.good || 'Richtig! 🎉'; }\n  box.append(fb);\n  return box;\n}\n\n/* Freitext */\nfunction textTask(id, part, cfg){\n  const p = P(id, part);\n  const ta = h('textarea', {id:`ta-${id}-${part}`, rows:cfg.rows || 4, placeholder:cfg.placeholder || 'Schreibe hier …', spellcheck:'true'});\n  ta.value = p.text != null ? p.text : (p.draft || '');\n  const cnt = h('span', {class:'count'});\n  const msg = h('span', {class:'msg', 'aria-live':'polite'});\n  const saveBtn = h('button', {class:'btn', type:'button'}, 'Antwort speichern');\n  function upd(){\n    const w = countWords(ta.value);\n    cnt.textContent = `${w} ${w === 1 ? 'Wort' : 'Wörter'} (mindestens ${cfg.min})`;\n    cnt.classList.toggle('ok', w >= cfg.min);\n    saveBtn.disabled = w \u003c cfg.min;\n  }\n  let draftT = null;\n  ta.addEventListener('input', () => {\n    touch(id); upd();\n    clearTimeout(draftT); draftT = setTimeout(() => { p.draft = ta.value; saveState(); }, 700);\n    if (p.done && ta.value.trim() !== p.text){ msg.className = 'msg warn'; msg.textContent = 'Bitte noch einmal speichern.'; }\n  });\n  ta.addEventListener('paste', e => {\n    let len = 0; try { len = (e.clipboardData.getData('text') || '').length; } catch(_){}\n    p.pasteCount = (p.pasteCount || 0) + 1; p.pasteChars = (p.pasteChars || 0) + len; saveSoon();\n  });\n  saveBtn.addEventListener('click', () => {\n    const txt = ta.value.trim();\n    clearTimeout(draftT);\n    partDone(id, part, {text:txt, words:countWords(txt), saves:(p.saves || 0) + 1, savedAt:iso()});\n    delete p.draft;\n    msg.className = 'msg good'; msg.textContent = 'Gespeichert ✓';\n  });\n  function insert(s){\n    const pre = ta.value && !/\\s$/.test(ta.value) ? ' ' : '';\n    const startPos = ta.value.length + pre.length;\n    ta.value += pre + s + ' '; ta.focus();\n    const gap = s.indexOf('…');\n    if (gap >= 0){ ta.selectionStart = startPos + gap; ta.selectionEnd = startPos + gap + 1; }\n    else ta.selectionStart = ta.selectionEnd = ta.value.length;\n    p.startersUsed = (p.startersUsed || 0) + 1; touch(id); upd(); saveSoon();\n  }\n  const tips = [];\n  if (cfg.starters) tips.push({html:'Klicke auf einen Satzanfang:', node:() => h('div', {class:'chips'}, cfg.starters.map(s => h('button', {class:'chip', type:'button', onclick:() => insert(s)}, s)))});\n  (cfg.tips || []).forEach(t => tips.push(typeof t === 'string' ? {html:t} : t));\n  const ladder = tips.length ? helpLadder(id, part, tips) : null;\n  upd();\n  if (p.done && p.text != null){ msg.className = 'msg good'; msg.textContent = 'Gespeichert ✓'; }\n  return h('div', {class:'text-task'},\n    ta, h('div', {class:'row'}, saveBtn, cnt, msg), ladder ? ladder.el : null);\n}\n\n/* Selbsteinschätzung */\nfunction rateTask(id, part, cfg){\n  const p = P(id, part); p.answers = p.answers || {};\n  const grid = h('div', {class:'rate'});\n  const msg = h('p', {class:'msg good', 'aria-live':'polite'});\n  const LV = [['😀', 'Kann ich gut'], ['🙂', 'Geht so'], ['😕', 'Noch unsicher']];\n  cfg.items.forEach(it => {\n    const opts = h('div', {class:'opts'});\n    LV.forEach(l => {\n      const b = h('button', {type:'button', 'aria-pressed':p.answers[it.k] === l[1] ? 'true' : 'false'}, l[0] + ' ' + l[1]);\n      b.addEventListener('click', () => {\n        p.answers[it.k] = l[1]; touch(id);\n        opts.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true');\n        if (cfg.items.every(x => p.answers[x.k])){ partDone(id, part, {answers:Object.assign({}, p.answers)}); msg.textContent = 'Danke! ✓'; } else saveSoon();\n      });\n      opts.append(b);\n    });\n    grid.append(h('div', {class:'rate-row'}, h('span', {style:'font-weight:500'}, it.label), opts));\n  });\n  if (p.done) msg.textContent = 'Danke! ✓';\n  return h('div', {style:'display:flex;flex-direction:column;gap:14px'}, grid, msg);\n}\n\n/* Schritt-für-Schritt-Simulator (ohne Audio) */\nfunction stepsTask(id, part, cfg){\n  const p = P(id, part);\n  const root = h('div', {class:'sim-wrap'});\n  let sim, steps, done, cur, sol, wrong, finished;\n  let metaEl, listEl, msgEl, ladderEl;\n  const firstUndone = () => steps.findIndex((_, k) => !done.has(k));\n  const setMsg = (t, cls) => { msgEl.className = 'msg ' + (cls || ''); msgEl.textContent = t || ''; };\n\n  function build(){\n    sim = cfg.make();\n    steps = cfg.steps(sim);\n    done = new Set(); sol = new Set(); cur = 0; wrong = 0; finished = !!p.done;\n    if (finished) steps.forEach((_, k) => done.add(k));\n    root.innerHTML = '';\n    metaEl = h('div', {class:'meta'});\n    listEl = h('ol', {class:'sl'});\n    msgEl = h('p', {class:'msg', 'aria-live':'polite'});\n    ladderEl = h('div', {});\n    const box = h('div', {class:'steps-box'}, metaEl, listEl, msgEl, ladderEl,\n      h('div', {class:'row'}, h('button', {class:'btn small ghost', type:'button', onclick:() => build()}, '↺ Neu starten')));\n    if (cfg.hint) root.append(h('p', {class:'hint-line'}, cfg.hint));\n    root.append(box, sim.el);\n    sim.setEmit(onEvent);\n    skipAlready();\n    if (finished) setMsg('Schon geschafft! Du darfst gern noch weiter üben.', 'good');\n    drawSteps();\n  }\n  function skipAlready(){\n    while (cur \u003c steps.length && steps[cur].already && steps[cur].already(sim)){ done.add(cur); cur++; }\n  }\n  function drawSteps(){\n    const n = steps.length;\n    metaEl.innerHTML = '';\n    const dots = h('div', {class:'dots', 'aria-hidden':'true'});\n    steps.forEach((_, k) => dots.append(h('i', {class:done.has(k) ? 'd' : (k === cur && !finished ? 'a' : '')})));\n    metaEl.append(h('span', {}, finished || done.size === n ? 'Alle Schritte geschafft ✓' : `Schritt ${cur + 1} von ${n}`), dots);\n    listEl.innerHTML = '';\n    steps.forEach((s, k) => {\n      if (done.has(k)) listEl.append(h('li', {class:'done'}, h('span', {class:'n'}, '✓'), h('span', {class:'t'}, s.short)));\n      else if (k === cur) listEl.append(h('li', {class:'active'}, h('span', {class:'n'}, k + 1), h('span', {class:'t', html:s.text})));\n    });\n    if (!finished && cur \u003c n - 1) listEl.append(h('li', {class:'later'}, `Danach noch ${n - cur - 1} ${n - cur - 1 === 1 ? 'Schritt' : 'Schritte'}.`));\n    ladderEl.innerHTML = '';\n    if (!finished && done.size \u003c n){\n      const k = firstUndone(), s = steps[k];\n      const tips = (s.tips || []).map(t => ({html:t}));\n      if (s.hl) tips.push({html:'', node:() => { sim.hl(s.hl(sim)); return h('span', {}, 'Die richtige Stelle blinkt gelb. 🟡'); }});\n      if (s.solve) tips.push({solution:true, action(){ sol.add(k); s.solve(sim); }});\n      ladderEl.append(helpLadder(id, part + '_s' + k, tips).el);\n    }\n  }\n  function completeStep(k){\n    done.add(k);\n    if (steps[k].after) steps[k].after(sim);\n    cur = k + 1; skipAlready();\n    if (done.size >= steps.length) return finish();\n    drawSteps();\n  }\n  function finish(){\n    finished = true;\n    partDone(id, part, {score:Math.max(0, steps.length - sol.size), max:steps.length, wrong, lösungshilfen:sol.size});\n    setMsg(cfg.doneMsg || 'Geschafft! 🎉', 'good');\n    drawSteps();\n  }\n  function onEvent(ev){\n    if (finished) return;\n    touch(id);\n    const r = steps[cur].test(ev, sim);\n    if (r === true){ setMsg('Richtig! ✓', 'good'); completeStep(cur); }\n    else if (typeof r == .stringify(S)); } catch(e){}\n      shell();\n    }\n  } else if (d.type === 'pc00_goto' && d.page && S){\n    go(d.page);\n  }\n});\n\n/* Startbildschirm */\nfunction startScreen(){\n  const prev = loadState();\n  const hs = hubStudent();\n  if (hs){\n    if (prev && sameStudent(prev.student, hs)){ S = prev; shell(); return; }\n    if (prev && prev.student) archive(prev);\n    S = freshState(hs); if (!IN_FRAME) saveState(); shell(); return;\n  }\n  const app = $('#app'); app.innerHTML = '';\n  const box = h('div', {class:'start'});\n  const heroSlot = h('div', {class:'lottie-slot'});\n  box.append(h('div', {class:'start-head'}, heroSlot, h('h1', {}, h('small', {}, `Informatik · Kapitel ${LESSON.id}`), LESSON.shortTitle)),\n    h('p', {}, LESSON.startText),\n    h('p', {class:'hint-line'}, 'Lies jede Aufgabe in Ruhe. Wenn du nicht weiterkommst, hilft dir der Tipp-Knopf.'));\n  mountLottie(heroSlot, LOTTIE_STAR, SVG_STAR);\n  if (prev && prev.student){\n    box.append(h('div', {class:'task', style:'gap:14px;padding:22px'},\n      h('p', {}, h('b', {}, `Willkommen zurück, ${prev.student.vorname} ${prev.student.initial}. (${prev.student.klasse})!`)),\n      h('div', {class:'row'},\n        h('button', {class:'btn big', type:'button', onclick:() => { S = prev; saveHubStudent(S.student); shell(); }}, 'Weiterarbeiten →'),\n        h('button', {class:'btn ghost', type:'button', onclick:() => { form.hidden = false; warn.hidden = false; }}, `Ich bin nicht ${prev.student.vorname}`))));\n  }\n  const warn = h('p', {class:'msg warn', hidden:true}, `Der Stand von ${prev && prev.student ? prev.student.vorname : ''} bleibt für die Lehrkraft gespeichert.`);\n  const fK = h('input', {id:'klasse', placeholder:'z. B. 5b', maxlength:'6', autocomplete:'off'});\n  const fV = h('input', {id:'vorname', placeholder:'z. B. Lisa', maxlength:'30', autocomplete:'off'});\n  const fI = h('input', {id:'initial', placeholder:'z. B. M', maxlength:'2', autocomplete:'off'});\n  const err = h('p', {cla u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Lernpfad 0.3 – Wie arbeite ich am Computer?\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Fredoka:wght@500;600&display=swap\">\n\u003cstyle>\n/* Layout: Ruhiger, offener Lernpfad – maximal 1 Übung pro Seite, ohne Audio, Hub-kompatibel */\n:root{\n  --bg:#edf3f6; --surface:#ffffff; --surface-2:#f5f9fb; --ink:#15303f; --muted:#4c6675; --line:#c8d7e1;\n  --accent:#1a74ae; --accent-dark:#145b8a; --accent-ink:#ffffff; --accent-soft:#dcecf7;\n  --merke:#fdf1bf; --merke-line:#d8ae28;\n  --good:#1f7d4a; --good-soft:#d9f0e2; --bad:#bf3e2d; --bad-soft:#fae1dc; --warn:#9a6a00; --warn-soft:#fdf1d2;\n  --star:#d45d12; --star-soft:#fdebd9; --star-line:#f3b88c;\n  --f-display:\"Fredoka\",\"Lexend\",system-ui,\"Segoe UI\",sans-serif;\n  --f-body:\"Lexend\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  --r:18px; --r-lg:22px; --r-md:14px; --r-sm:10px;\n  --m-in:150ms; --m-out:120ms; --m-press:90ms;\n  --ease:cubic-bezier(.2,.8,.2,1); --ease-enter:cubic-bezier(.22,1,.36,1);\n  color-scheme:light;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.75;letter-spacing:.01em}\nbutton,input,textarea,select{font:inherit;color:inherit;touch-action:manipulation}\nbutton{cursor:pointer}\na{color:inherit;text-decoration:none}\n:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}\np{margin:0}\n\n/* Skip Link */\n.skip-link{position:fi er:0;border-radius:12px;padding:9px 12px;font-size:15px;color:var(--ink);line-height:1.35;transition:background var(--m-in) var(--ease),transform var(--m-in) var(--ease),box-shadow var(--m-in) var(--ease)}\n.nav-item:hover{background:var(--surface);transform:translateX(2px)}\n.nav-item.active{background:var(--surface);box-shadow:inset 4px 0 0 var(--accent),0 3px 10px rgba(21,48,63,.08);font-weight:600;color:var(--accent)}\n.nav-num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}\n.nav-item[data-state=started] .nav-num{border-color:var(--accent);color:var(--accent)}\n.nav-item[data-state=done] .nav-num{border-color:var(--good);background:var(--good);color:#fff}\n.nav-item.zusatz .nav-num{border-style:dashed;border-color:var(--star-line);color:var(--star)}\n.nav-item.zusatz[data-state=done] .nav-num{background:var(--star);border-color:var(--star);border-style:solid;color:#fff}\n.nav-sep{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px;font-weight:600}\nmain{min-width:0;max-width:900px;display:flex;flex-direction:column;gap:28px;outline:none}\n@keyframes pageEnter{from{opacity:.01;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n@media (prefers-reduced-motion:no-preference){main > *{animation:pageEnter 260ms var(--ease-enter) both}}\n\n/* Seitenkopf */\n.st-head{display:flex;flex-direction:column;gap:10px}\n.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.st-head h2{font-size:32px}\n.intro{max-width:58ch;color:#274454;font-size:18px;line-height:1.7}\n\n/* Aufgabenblock – großzügiges Spacing & taktile Claymorphism-Tiefe */\n.task{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:30px 34px;display:flex;flex-direction:column;gap:24px
